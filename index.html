<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha AI</title>
<meta name="theme-color" content="#07080b">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9a869'%3E%3Cpath d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#07080b;
  --surface:#101319;
  --surface-2:#171c25;
  --border:rgba(255,255,255,.09);
  --gold:#c9a869;
  --gold-2:#e6cb99;
  --emerald:#00e599;
  --red:#e05a4e;
  --text:#f3f1ec;
  --muted:#8b91a0;
}

html.light{
  --bg:#f3f0e8;
  --surface:#ffffff;
  --surface-2:#f2eee2;
  --border:rgba(0,0,0,.09);
  --text:#211d16;
  --muted:#6b6f7a;
}

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(
      60% 55% at 12% 8%,
      rgba(201,168,105,.12),
      transparent 60%
    ),
    radial-gradient(
      55% 50% at 88% 92%,
      rgba(0,229,153,.09),
      transparent 60%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    'Plus Jakarta Sans',
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Noto Sans Devanagari",
    sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:28px 16px;
  overflow:hidden;

  transition:
    background .3s,
    color .3s;
}


/* =========================
   MAIN APP
========================= */

.shell{
  width:100%;
  max-width:480px;
  height:min(700px,90vh);

  background:var(--surface);

  border:1px solid var(--border);
  border-radius:22px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  box-shadow:0 40px 90px rgba(0,0,0,.35);

  transition:
    background .3s,
    border-color .3s;
}


/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  padding:15px 16px;

  border-bottom:1px solid var(--border);

  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  min-width:0;
}

.brand-mark{
  width:36px;
  height:36px;

  border-radius:10px;

  flex-shrink:0;

  background:
    linear-gradient(
      135deg,
      var(--gold-2),
      #9c7c47
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:17px;

  color:#1c1608;
}

.brand-name{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:15.5px;

  color:var(--text);

  line-height:1.2;
}

.brand-sub{
  font-size:10.5px;
  color:var(--muted);
  margin-top:1px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;

  flex-shrink:0;
}


/* =========================
   STATUS
========================= */

.status-pill{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:10.5px;
  font-weight:600;

  color:var(--emerald);

  background:rgba(0,229,153,.08);

  border:1px solid rgba(0,229,153,.25);

  padding:5px 9px;

  border-radius:20px;

  transition:.2s;
}

.status-pill.angry{
  color:var(--red);

  background:rgba(224,90,78,.1);

  border-color:rgba(224,90,78,.35);
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:currentColor;

  box-shadow:0 0 6px currentColor;
}


/* =========================
   BUTTONS
========================= */

.icon-btn{
  width:29px;
  height:29px;

  border-radius:9px;

  border:1px solid var(--border);

  background:rgba(120,120,120,.04);

  color:var(--muted);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.2s;
}

.icon-btn:hover{
  color:var(--gold-2);
  border-color:var(--gold);
}

.icon-btn.off{
  color:#e07a7a;
  border-color:rgba(224,122,122,.35);
}

.icon-btn.active{
  color:var(--emerald);
  border-color:var(--emerald);
}

.icon-btn svg.moon{
  display:none;
}

html.light .icon-btn svg.sun{
  display:none;
}

html.light .icon-btn svg.moon{
  display:block;
}


/* =====================================================
   NEW INDIAN WOMAN AI AVATAR
===================================================== */

.stage{
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:8px;

  gap:10px;

  min-height:0;
}


/* Avatar container */

.avatar-wrap{
  position:relative;

  width:280px;
  height:310px;

  flex-shrink:0;

  display:flex;
  align-items:flex-end;
  justify-content:center;
}


/* Woman */

.ai-woman{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  transform-origin:50% 100%;

  animation:aiIdle 5s ease-in-out infinite;

  z-index:2;
}


/* Woman image */

.ai-woman-img{
  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center bottom;

  display:block;

  user-select:none;
  -webkit-user-drag:none;

  filter:
    drop-shadow(
      0 18px 28px rgba(0,0,0,.35)
    );

  transform-origin:50% 100%;
}


/* =========================
   NORMAL IDLE MOVEMENT
========================= */

@keyframes aiIdle{

  0%,100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  25%{
    transform:
      translateY(-2px)
      rotate(-.35deg)
      scale(1.005);
  }

  50%{
    transform:
      translateY(-4px)
      rotate(0deg)
      scale(1.01);
  }

  75%{
    transform:
      translateY(-2px)
      rotate(.35deg)
      scale(1.005);
  }

}


/* =========================
   SPEAKING ANIMATION
========================= */

.avatar-wrap.speaking .ai-woman{

  animation:
    aiSpeaking
    .65s
    ease-in-out
    infinite;
}


@keyframes aiSpeaking{

  0%,100%{
    transform:
      translateY(0)
      scale(1);
  }

  25%{
    transform:
      translateY(-3px)
      scale(1.012);
  }

  50%{
    transform:
      translateY(-6px)
      scale(1.018);
  }

  75%{
    transform:
      translateY(-3px)
      scale(1.012);
  }

}


/* =========================
   SPEAKING GLOW
========================= */

.ai-speaking-glow{

  position:absolute;

  width:220px;
  height:120px;

  left:50%;
  bottom:8px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,229,153,.22),
      rgba(0,229,153,.08) 40%,
      transparent 72%
    );

  filter:blur(15px);

  opacity:0;

  pointer-events:none;

  transition:opacity .3s;

  z-index:-1;
}


.avatar-wrap.speaking .ai-speaking-glow,
.avatar-wrap.thinking .ai-speaking-glow{

  opacity:1;

  animation:
    aiGlow
    1.1s
    ease-in-out
    infinite;
}


@keyframes aiGlow{

  0%,100%{
    transform:
      translateX(-50%)
      scale(.9);

    opacity:.35;
  }

  50%{
    transform:
      translateX(-50%)
      scale(1.12);

    opacity:.8;
  }

}


/* =========================
   THINKING DOTS
========================= */

.ai-think-dots{

  position:absolute;

  top:32px;
  right:8px;

  display:flex;

  gap:6px;

  padding:9px 12px;

  border-radius:16px;

  background:
    rgba(201,168,105,.12);

  border:
    1px solid
    rgba(201,168,105,.25);

  opacity:0;

  transform:
    translateY(5px)
    scale(.9);

  transition:.25s;

  z-index:5;
}


.ai-think-dots span{

  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--gold-2);

  animation:
    aiDot
    1s
    ease-in-out
    infinite;
}


.ai-think-dots span:nth-child(2){
  animation-delay:.15s;
}

.ai-think-dots span:nth-child(3){
  animation-delay:.3s;
}


@keyframes aiDot{

  0%,80%,100%{
    transform:translateY(0);
    opacity:.35;
  }

  40%{
    transform:translateY(-4px);
    opacity:1;
  }

}


.avatar-wrap.thinking .ai-think-dots{

  opacity:1;

  transform:
    translateY(0)
    scale(1);
}


/* =========================
   HAPPY
========================= */

.avatar-wrap.happy .ai-woman{

  animation:
    aiHappy
    .7s
    ease-in-out
    2;
}


@keyframes aiHappy{

  0%,100%{
    transform:
      translateY(0)
      scale(1);
  }

  50%{
    transform:
      translateY(-8px)
      scale(1.025);
  }

}


/* =========================
   CONFUSED
========================= */

.avatar-wrap.confused .ai-woman{

  animation:
    aiConfused
    1.4s
    ease-in-out
    infinite;
}


@keyframes aiConfused{

  0%,100%{
    transform:rotate(0deg);
  }

  50%{
    transform:
      rotate(2deg)
      translateY(-2px);
  }

}


/* =========================
   SURPRISED
========================= */

.avatar-wrap.surprised .ai-woman{

  animation:
    aiSurprised
    .6s
    ease-in-out
    2;
}


@keyframes aiSurprised{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:
      scale(1.035)
      translateY(-4px);
  }

}


/* =========================
   ANGRY
========================= */

.avatar-wrap.angry .ai-woman{

  animation:
    aiAngry
    .18s
    linear
    infinite;

  filter:
    drop-shadow(
      0 18px 30px
      rgba(224,90,78,.25)
    );
}


@keyframes aiAngry{

  0%,100%{
    transform:
      translateX(0)
      rotate(0);
  }

  25%{
    transform:
      translateX(-3px)
      rotate(-.7deg);
  }

  75%{
    transform:
      translateX(3px)
      rotate(.7deg);
  }

}


/* =========================
   YAWN
========================= */

.avatar-wrap.yawn .ai-woman{

  animation:
    aiYawn
    1.8s
    ease-in-out;
}


@keyframes aiYawn{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:
      scale(1.035)
      translateY(-4px);
  }

}


/* =========================
   CAPTION
========================= */

.caption{

  min-height:52px;

  max-width:360px;
  width:100%;

  background:var(--surface-2);

  border:
    1px solid
    var(--border);

  border-radius:14px;

  padding:11px 15px;

  font-size:13.5px;

  line-height:1.55;

  text-align:center;

  color:var(--text);

  transition:
    border-color .2s,
    background .3s;
}

.caption.placeholder{
  color:var(--muted);
  font-style:italic;
}

.caption.angry-txt{
  border-color:
    rgba(224,90,78,.4);
}


/* =========================
   INPUT
========================= */

.input-row{

  display:flex;

  align-items:flex-end;

  gap:7px;

  padding:12px 14px;

  border-top:
    1px solid
    var(--border);

  flex-shrink:0;
}


#userInput{

  flex:1;

  background:var(--surface-2);

  border:
    1px solid
    var(--border);

  border-radius:12px;

  padding:10px 12px;

  color:var(--text);

  font-family:inherit;

  font-size:13.3px;

  line-height:1.4;

  resize:none;

  outline:none;

  min-height:40px;
  max-height:100px;
}


#userInput:focus{
  border-color:var(--gold);
}

#userInput::placeholder{
  color:var(--muted);
}


/* =========================
   MIC + SEND
========================= */

#micBtn,
#sendBtn{

  width:40px;
  height:40px;

  border-radius:11px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    filter .2s,
    background .2s;
}


#sendBtn{

  background:
    linear-gradient(
      135deg,
      var(--gold-2),
      var(--gold)
    );

  color:#1c1608;

  border:none;
}


#sendBtn:hover:not(:disabled){
  filter:brightness(1.08);
}


#sendBtn:disabled{
  opacity:.5;
  cursor:not-allowed;
}


#micBtn{

  background:var(--surface-2);

  border:
    1px solid
    var(--border);

  color:var(--muted);
}


#micBtn.listening{

  color:#fff;

  background:var(--red);

  border-color:var(--red);

  animation:
    micpulse
    1s
    infinite;
}


@keyframes micpulse{

  0%,100%{
    box-shadow:
      0 0 0 0
      rgba(224,90,78,.5);
  }

  50%{
    box-shadow:
      0 0 0 7px
      rgba(224,90,78,0);
  }

}


button:focus-visible,
textarea:focus-visible{

  outline:
    2px solid
    var(--gold);

  outline-offset:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  body{
    padding:0;
  }

  .shell{

    max-width:100%;

    height:100vh;
    height:100dvh;

    border-radius:0;

    border:none;
  }

  .brand-sub{
    display:none;
  }

  .avatar-wrap{
    width:285px;
    height:315px;
  }

}


/* SMALL HEIGHT PHONE */

@media(max-height:700px){

  .avatar-wrap{
    width:240px;
    height:270px;
  }

}


/* VERY SMALL PHONE */

@media(max-width:360px){

  .avatar-wrap{
    width:225px;
    height:250px;
  }

  .caption{
    font-size:12.5px;
  }

}

</style>
</head>


<body>

<div class="shell">

(function(){


/* =========================
   AI CONFIG
========================= */

];


const CONFUSE_WORDS = [

  "pata nahi",
  "confus",

  "specify",
  "clarify",

];


const SURPRISE_WORDS = [

  "wow",

  "amazing",
  "incredible",
  "वाह",
  "हैरान"

];


/* =========================
   STATE
========================= */

let chatHistory = [];

let activeGenId = 0;

let isBusy = false;

let voiceOn = true;

let userName =
  localStorage.getItem("alphaAiName") || "";

let awaitingName = !userName;

let idleTimer = null;

let recognizing = false;

let recognition = null;


/* =========================
   ELEMENTS
========================= */

const wrap =
  document.getElementById("avatarWrap");

const caption =
  document.getElementById("caption");

const input =
  document.getElementById("userInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const resetBtn =
  document.getElementById("resetBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const themeBtn =
  document.getElementById("themeBtn");

const statusPill =
  document.getElementById("statusPill");

const statusText =
  document.getElementById("statusText");


/* =========================
   AVATAR STATE
========================= */

function setState(state){

  wrap.classList.remove(
    "thinking",
    "speaking",
    "angry",
    "happy",
    "confused",
    "surprised",
    "yawn"
  );


  if(state){

    wrap.classList.add(state);

  }


  statusPill.classList.toggle(
    "angry",
    state === "angry"
  );


  statusText.textContent =
    state === "angry"
      ? "Naraz"
      : "Online";


  resetIdleTimer();

}


/* =========================
   CAPTION
========================= */

function setCaption(
  text,
  placeholder,
  angry
){

  caption.textContent = text;

  caption.classList.toggle(
    "placeholder",
    !!placeholder
  );

  caption.classList.toggle(
    "angry-txt",
    !!angry
  );

}


/* =========================
   RUDE DETECTION
========================= */

function isRude(text){

  const t =
    text.toLowerCase();

  return RUDE_WORDS.some(
    w => t.includes(w)
  );

}


/* =========================
   EMOTION DETECTION
========================= */

function detectEmotion(text){

  const t =
    text.toLowerCase();


  if(
    CONFUSE_WORDS.some(
      w => t.includes(w)
    )
  ){

    return "confused";

  }


  if(
    SURPRISE_WORDS.some(
      w => t.includes(w)
    )
  ){

    return "surprised";

  }


  if(
    HAPPY_WORDS.some(
      w => t.includes(w)
    )
  ){

    return "happy";

  }


  return "";

}


/* =========================
   HINDI VOICE
========================= */

function pickHindiVoice(){

  const voices =
    speechSynthesis.getVoices();


  return (

    voices.find(
      v => /hi[-_]?IN/i.test(v.lang)
    )

    ||

    voices.find(
      v => /hi/i.test(v.lang)
    )

    ||

    null

  );

}


/* =========================
   SPEECH
========================= */

function speak(
  text,
  emotion
){

  return new Promise(
    resolve => {

      if(
        !voiceOn ||
        !("speechSynthesis" in window)
      ){

        resolve();

        return;

      }


      speechSynthesis.cancel();


      const utter =
        new SpeechSynthesisUtterance(
          text
        );


      const v =
        pickHindiVoice();


      if(v){

        utter.voice = v;

      }


      utter.rate =
        emotion === "angry"
          ? 1.15
          : 1;


      utter.pitch =
        emotion === "angry"
          ? 1.15
          : emotion === "happy"
            ? 1.1
            : 1;


      utter.onstart = () => {

        setState(
          emotion === "angry"
            ? "angry"
            : "speaking"
        );

      };


      utter.onend = () => {

        if(
          emotion &&
          emotion !== "angry"
        ){

          setState(emotion);

        }


        setTimeout(
          () => setState(""),
          emotion ? 1400 : 0
        );


        resolve();

      };


      utter.onerror = () => {

        setState("");

        resolve();

      };


      speechSynthesis.speak(
        utter
      );

    }
  );

}


/* =========================
   TEXTAREA AUTO GROW
========================= */

function autoGrow(){

  input.style.height =
    "auto";


  input.style.height =
    Math.min(
      input.scrollHeight,
      100
    ) + "px";

}


/* =========================
   AI API
========================= */

async function callAIProvider(
  messages
){

  const sys =
    BASE_PROMPT +
    (
      userName
        ? ` User ka naam ${userName} hai, kabhi kabhi unhe naam se bulao.`
        : ""
    );


  const response =
    await fetch(
      AI_CONFIG.endpoint,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          model:
            AI_CONFIG.model,

          max_tokens:
            1000,

          system:
            sys,

          messages:
            messages

        })

      }
    );


  if(!response.ok){

    let detail =
      "HTTP " +
      response.status;


    try{

      const errData =
        await response.json();


      detail =
        (
          errData.error &&
          errData.error.message
        )

        ||

        (
          typeof errData.error ===
          "string"
            ? errData.error
            : JSON.stringify(
                errData
              )
        );

    }catch(e){}


    throw new Error(detail);

  }


  const data =
    await response.json();


  const textBlock =
    (
      data.content || []
    ).find(
      b => b.type === "text"
    );


  return textBlock
    ? textBlock.text
    : "";

}


/* =========================
   SEND MESSAGE
========================= */

async function submitQuery(){

  if(isBusy)
    return;


  const text =
    input.value.trim();


  if(!text)
    return;


  isBusy = true;

  sendBtn.disabled = true;

  input.value = "";

  autoGrow();


  /* NAME */

  if(awaitingName){

    userName =
      text.split(" ")[0];


    localStorage.setItem(
      "alphaAiName",
      userName
    );


    awaitingName = false;


    setState("happy");


    setCaption(
      `Namaste ${userName}! Ab bataiye, kya jaanna chahte ho?`,
      false
    );


    await speak(
      `Namaste ${userName}! Ab bataiye, kya jaanna chahte ho?`,
      "happy"
    );


    isBusy = false;

    sendBtn.disabled = false;

    return;

  }


  const rude =
    isRude(text);


  chatHistory.push({

    role:"user",

    content:text

  });


  /* RUDE */

  if(rude){

    setState("angry");


    setCaption(
      `Aise baat mat karo mujhse, ${userName}!`,
      false,
      true
    );


    await new Promise(
      r => setTimeout(
        r,
        1400
      )
    );

  }


  /* THINKING */

  setState("thinking");


  setCaption(
    "Sochta hoon...",
    true
  );


  const myGenId =
    ++activeGenId;


  try{

    const reply =
      await callAIProvider(
        chatHistory
      );


    if(
      myGenId !==
      activeGenId
    ){

      return;

    }


    chatHistory.push({

      role:"assistant",

      content:reply

    });


    const emotion =
      rude
        ? "angry"
        : detectEmotion(
            reply
          );


    setCaption(
      reply,
      false,
      rude
    );


    await speak(
      reply,
      emotion
    );


  }catch(err){

    setCaption(
      "Configuration needed. Alpha AI abhi connect nahi ho paya. (" +
      (
        err &&
        err.message
          ? err.message
          : String(err)
      ) +
      ")",
      false
    );

  }finally{

    if(
      myGenId ===
      activeGenId
    ){

      setState("");

      isBusy = false;

      sendBtn.disabled =
        false;

    }

  }

}


/* =========================
   RESET
========================= */

function resetChat(){

  speechSynthesis.cancel();


  chatHistory = [];


  activeGenId++;


  isBusy = false;


  sendBtn.disabled =
    false;


  setState("");


  setCaption(

    userName
      ? `Naya baatcheet shuru, ${userName}!`
      : "Namaste! Pehle apna naam bataiye.",

    true

  );

}


/* =========================
   VOICE TOGGLE
========================= */

function toggleVoice(){

  voiceOn =
    !voiceOn;


  voiceBtn.classList.toggle(
    "off",
    !voiceOn
  );


  if(!voiceOn){

    speechSynthesis.cancel();

  }

}


/* =========================
   THEME
========================= */

function applyTheme(t){

  document.documentElement
    .classList.toggle(
      "light",
      t === "light"
    );

}


function toggleTheme(){

  const cur =
    document.documentElement
      .classList.contains(
        "light"
      )
      ? "light"
      : "dark";


  const next =
    cur === "light"
      ? "dark"
      : "light";


  applyTheme(next);


  localStorage.setItem(
    "alphaAiTheme",
    next
  );

}


/* =========================
   IDLE / YAWN
========================= */

function resetIdleTimer(){

  if(idleTimer){

    clearTimeout(
      idleTimer
    );

  }


  idleTimer =
    setTimeout(
      () => {

        if(
          !isBusy &&
          !wrap.classList.length
        ){

          setState("yawn");


          setTimeout(
            () => {

              if(!isBusy){

                setState("");

              }

            },
            1800
          );

        }else{

          resetIdleTimer();

        }

      },
      26000
    );

}


/* =========================
   SPEECH RECOGNITION
========================= */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SR){

  recognition =
    new SR();


  recognition.lang =
    "hi-IN";


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.onresult =
    (e) => {

      const transcript =
        e.results[0][0]
          .transcript;


      input.value =
        transcript;


      autoGrow();


      submitQuery();

    };


  recognition.onend =
    () => {

      recognizing = false;

      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    () => {

      recognizing = false;

      micBtn.classList.remove(
        "listening"
      );

    };

}else{

  micBtn.title =
    "Voice input is samay is browser mein nahi hai";

  micBtn.style.opacity =
    ".4";

}


/* =========================
   MICROPHONE
========================= */

micBtn.addEventListener(
  "click",
  () => {

    if(!recognition)
      return;


    if(recognizing){

      recognition.stop();

      return;

    }


    recognizing = true;


    micBtn.classList.add(
      "listening"
    );


    recognition.start();

  }
);


/* =========================
   INPUT
========================= */

input.addEventListener(
  "input",
  () => {

    autoGrow();

    resetIdleTimer();

  }
);


/* ENTER TO SEND */

input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      submitQuery();

    }

  }
);


/* =========================
   BUTTONS
========================= */

sendBtn.addEventListener(
  "click",
  submitQuery
);


resetBtn.addEventListener(
  "click",
  resetChat
);


voiceBtn.addEventListener(
  "click",
  toggleVoice
);


themeBtn.addEventListener(
  "click",
  toggleTheme
);


/* =========================
   VOICES
========================= */

if(
  "speechSynthesis" in window
){

  speechSynthesis.onvoiceschanged =
    () => {};

}


/* =========================
   INITIAL LOAD
========================= */

applyTheme(
  localStorage.getItem(
    "alphaAiTheme"
  ) || "dark"
);


if(
  userName &&
  !awaitingName
){

  setCaption(
    `Namaste ${userName}! Kuch bhi poochiye.`,
    true
  );

}


resetIdleTimer();


})();

</script>

</body>
</html>
