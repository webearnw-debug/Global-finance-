<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parnarav AI - Universal Studio</title>
    
    <!-- External UI Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Syntax Highlighter -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    
    <!-- Puter Cloud AI Engine Core SDK -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #0b0f19;
            --bg-card: #111827;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --sidebar-width: 290px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100dvh;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .parnarav-brain-icon {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.4));
        }

        .nav-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 14px 0 6px 6px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.86rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-card);
            color: var(--accent-cyan);
            border: 1px solid var(--border-color);
        }

        .tools-menu {
            margin-top: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
        }

        .tool-btn {
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Workspace Main Layout */
        .workspace {
            flex: 1;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: 58px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .voice-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .voice-toggle-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: var(--accent-green);
            font-weight: 600;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 90%;
            animation: fadeIn 0.25s ease-in-out;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            font-weight: 800;
        }

        .user .avatar {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .bubble {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            line-height: 1.6;
            font-size: 0.92rem;
            word-wrap: break-word;
            overflow-x: auto;
            position: relative;
        }

        .user .bubble {
            background-color: #1e3a8a;
            border-color: #3b82f6;
            color: #fff;
        }

        .widget-card {
            background: #070a13;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .widget-title {
            color: var(--accent-purple);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Input Controls */
        .input-wrapper {
            padding: 12px 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
        }

        .input-box:focus-within {
            border-color: var(--accent-cyan);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.93rem;
            resize: none;
            height: 40px;
            padding-top: 10px;
            line-height: 1.4;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .btn-icon.listening {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
            animation: pulseMic 1.2s infinite;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        pre {
            background: #000 !important;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        code { font-family: 'JetBrains Mono', monospace; }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -100%;
                top: 0;
                bottom: 0;
            }
            .sidebar.open {
                left: 0;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            .mobile-menu-btn { display: block; }
            .message-row { max-width: 96%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="brand-logo">
            <svg class="parnarav-brain-icon" viewBox="0 0 64 64" fill="none">
                <defs>
                    <linearGradient id="leftBrainRed" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ef4444" />
                        <stop offset="100%" stop-color="#b91c1c" />
                    </linearGradient>
                    <linearGradient id="rightBrainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1d4ed8" />
                    </linearGradient>
                </defs>
                <path d="M30 10C22 10 15 15.5 14 23.5C10 24.8 7 28.5 7 33C7 36 8.5 38.8 11 40.5C10 42.8 10.2 45.5 11.5 47.8C13.5 51.2 17.5 53 21 53C22.5 53 24 52.5 25.2 51.7C27 54.5 30 56 30 56V10Z" fill="url(#leftBrainRed)" />
                <path d="M34 10C42 10 49 15.5 50 23.5C54 24.8 57 28.5 57 33C57 36 55.5 38.8 53 40.5C54 42.8 53.8 45.5 52.5 47.8C50.5 51.2 46.5 53 43 53C41.5 53 40 52.5 38.8 51.7C37 54.5 34 56 34 56V10Z" fill="url(#rightBrainBlue)" />
            </svg>
            <span style="background: linear-gradient(135deg, #ff4d4d, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Parnarav AI</span>
        </div>

        <div class="nav-section-title">Operating Modes & Roles</div>
        <ul class="nav-list" id="navList">
            <li class="nav-item active" onclick="AppController.switchMode('OMNI', this)">
                <i class="fa-solid fa-brain"></i> Omni Super AI
            </li>
            <li class="nav-item" onclick="AppController.switchMode('FINANCE', this)">
                <i class="fa-solid fa-chart-line"></i> Trading & Finance
            </li>
            <li class="nav-item" onclick="AppController.switchMode('DEV', this)">
                <i class="fa-solid fa-code"></i> Coding Master
            </li>
            <li class="nav-item" onclick="AppController.switchMode('INTERVIEW', this)">
                <i class="fa-solid fa-user-tie"></i> Mock Interviewer
            </li>
            <li class="nav-item" onclick="AppController.switchMode('SALES', this)">
                <i class="fa-solid fa-handshake"></i> Sales Executive
            </li>
        </ul>

        <div class="tools-menu">
            <div style="font-size:0.75rem; font-weight:700; color:var(--accent-cyan); margin-bottom:8px; text-transform:uppercase;">
                Omni Knowledge Tools
            </div>
            <button class="tool-btn" onclick="OmniKnowledgeEngine.solveExamQuestion()">
                <i class="fa-solid fa-graduation-cap" style="color:var(--accent-purple)"></i> Exam Solver
            </button>
            <button class="tool-btn" onclick="OmniKnowledgeEngine.deepResearch()">
                <i class="fa-solid fa-book-open" style="color:var(--accent-cyan)"></i> Deep Research
            </button>
            <button class="tool-btn" onclick="GeminiOmniEngine.triggerAgenticTask()">
                <i class="fa-solid fa-robot" style="color:var(--accent-yellow)"></i> Agentic Auto-Fix Loop
            </button>

            <div style="font-size:0.75rem; font-weight:700; color:var(--accent-purple); margin:12px 0 8px 0; text-transform:uppercase;">
                Finance Tools
            </div>
            <button class="tool-btn" onclick="QuantEngine.runAnalysis()">
                <i class="fa-solid fa-bolt" style="color:var(--accent-green)"></i> Quant Signals
            </button>
            <button class="tool-btn" onclick="FinancialEngine.calcSIP()">
                <i class="fa-solid fa-calculator" style="color:var(--accent-cyan)"></i> SIP Calculator
            </button>
            <button class="tool-btn" onclick="FinancialEngine.calcEMI()">
                <i class="fa-solid fa-house" style="color:var(--accent-yellow)"></i> Loan EMI Engine
            </button>
        </div>
    </aside>

    <!-- Workspace Main -->
    <main class="workspace" id="workspaceMain">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="AppController.toggleSidebar(event)">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="mode-indicator" style="font-weight: 700; font-size: 0.88rem;">
                    Parnarav AI: Omni Super AI Active
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <button class="voice-toggle-btn" id="voiceToggleBtn" onclick="VoiceEngine.toggleVoice()">
                    <i class="fa-solid fa-volume-high"></i> <span id="voiceStatusText">Voice OFF</span>
                </button>

                <div class="status-badge">
                    <div class="status-dot"></div>
                    Super AI Active
                </div>
            </div>
        </header>

        <section class="chat-area" id="chatContainer">
            <!-- Dynamic Messages Loaded Here -->
        </section>

        <footer class="input-wrapper">
            <div class="input-box">
                <button class="btn-icon" id="micToggleBtn" title="Speak Input" onclick="VoiceInputEngine.toggleMic()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <textarea id="userInput" placeholder="यहाँ अपना सवाल या मैसेज दर्ज करें..." onkeydown="AppController.handleKeyPress(event)"></textarea>
                <button class="btn-send" onclick="AppController.submitQuery()" title="Send Message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>

    <script>
        // System Creator Identity
        const SYSTEM_CREATOR = "मुझे बिलासपुर में रहने वाले एक पर्सन ने बनाया है।";

        // =================================================================
        // 🚀 OMNI AI ENGINE MODULE (PUTER.JS INTEGRATION)
        // =================================================================
        const GeminiOmniEngine = {
            chatHistory: [],

            resetMemory: function() {
                this.chatHistory = [];
                console.log("[GeminiOmniEngine]: Memory reset.");
            },

            processChat: async function(userPrompt, systemInstruction, onChunkCallback) {
                if (this.chatHistory.length === 0 && systemInstruction) {
                    this.chatHistory.push({ role: "system", content: systemInstruction });
                }
                
                this.chatHistory.push({ role: "user", content: userPrompt });

                try {
                    const responseStream = await puter.ai.chat(this.chatHistory, { stream: true });

                    let fullReply = "";
                    for await (const part of responseStream) {
                        if (part?.text) {
                            fullReply += part.text;
                            if (onChunkCallback) onChunkCallback(fullReply);
                        }
                    }

                    this.chatHistory.push({ role: "assistant", content: fullReply });
                    return fullReply;

                } catch (err) {
                    console.warn("[GeminiOmniEngine Non-Stream Fallback]:", err);
                    const response = await puter.ai.chat(this.chatHistory);
                    const textResponse = typeof response === 'string' 
                        ? response 
                        : (response?.message?.content || response?.text || "Error processing request.");

                    this.chatHistory.push({ role: "assistant", content: textResponse });
                    if (onChunkCallback) onChunkCallback(textResponse);
                    return textResponse;
                }
            },

            generateStructuredData: async function(prompt) {
                const systemPrompt = "तैयार डेटा को केवल शुद्ध और क्लीन JSON फॉर्मेट में ही रिटर्न करें।";
                return await puter.ai.chat(`${systemPrompt}\n\nTask: ${prompt}`);
            },

            triggerAgenticTask: async function() {
                const userTask = prompt("एजेंट को ऑटो-एक्ज़ीक्यूशन और सेल्फ-करेक्शन के लिए टास्क दें:");
                if (!userTask) return;

                document.getElementById('userInput').value = `[Agentic Loop Executing]: ${userTask}`;
                AppController.submitQuery();
            }
        };

        // =================================================================
        // 🎙️ VOICE TTS ENGINE (TEXT-TO-SPEECH)
        // =================================================================
        const VoiceEngine = {
            enabled: false,

            toggleVoice: function() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('voiceToggleBtn');
                const txt = document.getElementById('voiceStatusText');
                if (this.enabled) {
                    btn.classList.add('active');
                    txt.innerText = "Voice ON";
                    this.speak("वॉइस मोड सक्रिय कर दिया गया है।");
                } else {
                    btn.classList.remove('active');
                    txt.innerText = "Voice OFF";
                    window.speechSynthesis.cancel();
                }
            },

            speak: function(text) {
                if (!this.enabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();

                const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*_#`~]/g, '').trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                window.speechSynthesis.speak(utterance);
            }
        };

        // =================================================================
        // 🎙️ VOICE STT ENGINE (SPEECH-TO-TEXT / MICROPHONE)
        // =================================================================
        const VoiceInputEngine = {
            recognition: null,
            isListening: false,

            init: function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.warn("Speech Recognition API not supported in this browser.");
                    return false;
                }
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                this.recognition.lang = 'hi-IN';

                this.recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    const inputEl = document.getElementById('userInput');
                    if (inputEl) {
                        inputEl.value = (inputEl.value ? inputEl.value + " " : "") + transcript;
                    }
                    this.stop();
                };

                this.recognition.onerror = (err) => {
                    console.error("Speech Recognition Error:", err);
                    this.stop();
                };

                this.recognition.onend = () => {
                    this.stop();
                };
                return true;
            },

            toggleMic: function() {
                if (!this.recognition && !this.init()) {
                    alert("आपका ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता है।");
                    return;
                }

                if (this.isListening) {
                    this.stop();
                } else {
                    this.start();
                }
            },

            start: function() {
                if (!this.recognition) this.init();
                try {
                    this.recognition.start();
                    this.isListening = true;
                    document.getElementById('micToggleBtn')?.classList.add('listening');
                } catch (e) {
                    console.error("Mic start failed:", e);
                }
            },

            stop: function() {
                if (this.recognition && this.isListening) {
                    try { this.recognition.stop(); } catch(e) {}
                }
                this.isListening = false;
                document.getElementById('micToggleBtn')?.classList.remove('listening');
            }
        };

        // Reset local storage memory
        localStorage.clear();

        // =================================================================
        // SPECIALIZED KNOWLEDGE ENGINES
        // =================================================================
        const OmniKnowledgeEngine = {
            solveExamQuestion: function() {
                const q = prompt("अपना रीजनिंग, मैथ्स या कॉम्पिटिटिव एग्जाम का सवाल दर्ज करें:");
                if (!q) return;
                document.getElementById('userInput').value = `[Exam Solver]: इस प्रश्न का सटीक, चरणबद्ध हल प्रदान करें:\n${q}`;
                AppController.submitQuery();
            },
            deepResearch: function() {
                const topic = prompt("किस विषय पर डीप रिसर्च या विश्लेषण चाहिए?");
                if (!topic) return;
                document.getElementById('userInput').value = `[Deep Research]: '${topic}' विषय पर विस्तृत विश्लेषण तैयार करें।`;
                AppController.submitQuery();
            }
        };

        const QuantEngine = {
            runAnalysis: function() {
                const rsi = (Math.random() * (75 - 25) + 25).toFixed(2);
                let signal = rsi < 35 ? "STRONG_BUY" : (rsi > 65 ? "STRONG_SELL" : "NEUTRAL");
                const html = `
                    <div class="widget-card">
                        <div class="widget-title"><i class="fa-solid fa-chart-line"></i> QUANT DECISION ENGINE</div>
                        • Asset Pair: <b>BTC/USD</b><br>
                        • RSI (14 Period): <b>${rsi}</b><br>
                        • Decision Verdict: <b style="color:${signal === 'STRONG_BUY' ? 'var(--accent-green)' : (signal === 'STRONG_SELL' ? 'var(--accent-red)' : 'var(--accent-yellow)')}">${signal}</b>
                    </div>`;
                UIManager.appendMsg(html, 'ai', null, '📊');
            }
        };

        const FinancialEngine = {
            calcSIP: function() {
                let amount = parseFloat(prompt("Monthly SIP Amount (₹):", "10000")) || 10000;
                let rate = parseFloat(prompt("Expected Return (%):", "15")) || 15;
                let years = parseInt(prompt("Tenure (Years):", "10")) || 10;
                let r = (rate / 100) / 12, n = years * 12;
                let invested = amount * n;
                let futureValue = amount * (((Math.pow(1 + r, n) - 1) / r)) * (1 + r);
                const html = `
                    <div class="widget-card">
                        <div class="widget-title"><i class="fa-solid fa-coins"></i> SIP PROJECTION ENGINE</div>
                        • Total Invested: ₹${invested.toLocaleString()}<br>
                        • Projected Corpus: <b style="color:var(--accent-green)">₹${Math.round(futureValue).toLocaleString()}</b>
                    </div>`;
                UIManager.appendMsg(html, 'ai', null, '💰');
            },
            calcEMI: function() {
                let p = parseFloat(prompt("Loan Amount (₹):", "500000")) || 500000;
                let rate = parseFloat(prompt("Interest Rate (%):", "8.5")) || 8.5;
                let years = parseInt(prompt("Tenure (Years):", "5")) || 5;
                let r = (rate / 12) / 100, n = years * 12;
                let emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const html = `
                    <div class="widget-card">
                        <div class="widget-title"><i class="fa-solid fa-house"></i> LOAN EMI ENGINE</div>
                        • Monthly EMI: <b style="color:var(--accent-cyan)">₹${Math.round(emi).toLocaleString()}</b>/month
                    </div>`;
                UIManager.appendMsg(html, 'ai', null, '🏦');
            }
        };

        // =================================================================
        // UI MANAGER
        // =================================================================
        const UIManager = {
            appendMsg: function(content, sender, id = null, customAvatar = null, avatarClass = "") {
                const container = document.getElementById('chatContainer');
                const row = document.createElement('div');
                row.className = `message-row ${sender}`;
                if (id) row.id = id;

                let icon = sender === 'user' ? '👤' : (customAvatar || '🧠');
                let avatarHTML = `<div class="avatar ${avatarClass}">${icon}</div>`;

                row.innerHTML = `${avatarHTML}<div class="bubble">${content}</div>`;
                container.appendChild(row);
                container.scrollTop = container.scrollHeight;
            },
            renderActionBar: function(aiMsgId) {
                const msgContainer = document.getElementById(aiMsgId);
                if (!msgContainer) return;
                const bubble = msgContainer.querySelector('.bubble');
                if (!bubble || bubble.querySelector('.ai-action-bar')) return;

                const actionBarHTML = `
                    <div class="ai-action-bar">
                        <button class="action-btn" onclick="AppController.copyResponse(this)">📋 Copy</button>
                        <button class="action-btn" onclick="VoiceEngine.speak(this.closest('.bubble').innerText)">🔊 Speak</button>
                        <button class="action-btn like-btn" onclick="AppController.toggleFeedback(this)">👍</button>
                    </div>`;
                bubble.insertAdjacentHTML('beforeend', actionBarHTML);
            }
        };

        // =================================================================
        // MAIN APP CONTROLLER
        // =================================================================
        const AppController = {
            currentMode: 'OMNI',

            init: function() {
                this.switchMode('OMNI', document.querySelectorAll('.nav-item')[0]);
                this.setupOutsideClickListener();
            },

            setupOutsideClickListener: function() {
                document.addEventListener('click', (event) => {
                    const sidebar = document.getElementById('sidebar');
                    const mobileBtn = document.getElementById('mobileMenuBtn');
                    
                    if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                        if (!sidebar.contains(event.target) && !mobileBtn.contains(event.target)) {
                            this.closeSidebarMobile();
                        }
                    }
                });
            },

            switchMode: function(mode, element) {
                this.currentMode = mode;
                
                if (element) {
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    element.classList.add('active');
                }
                
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML = '';

                let titleName = "Omni Super AI Active";

                if (mode === 'FINANCE') titleName = "Trading & Finance Active";
                else if (mode === 'DEV') titleName = "Coding Master Active";
                else if (mode === 'INTERVIEW') titleName = "Mock Interviewer Active";
                else if (mode === 'SALES') titleName = "Sales Executive Active";
                else titleName = "Omni Super AI Active";

                document.getElementById('mode-indicator').innerText = `Parnarav AI: ${titleName}`;

                this.renderDefaultWelcome(mode);
                this.closeSidebarMobile();
            },

            renderDefaultWelcome: function(mode) {
                let welcomeText = "";
                let avatarIcon = "🧠";
                if (mode === 'FINANCE') {
                    avatarIcon = "📈";
                    welcomeText = `<b>📈 Trading & Finance Engine Active!</b><br>
                    नमस्ते! मैं आपका क्वांट एवं फाइनेंशियल AI हूँ।<br><br>
                    • <b>बाजार विश्लेषण:</b> ट्रेडिंग रणनीतियाँ, रिस्क मैनेजमेंट एवं मार्केट ट्रेंड्स।<br>
                    • <b>फाइनेंशियल टूल्स:</b> SIP, EMI एवं क्वांट सिग्नल कैलकुलेटर उपलब्ध।`;
                } else if (mode === 'DEV') {
                    avatarIcon = "💻";
                    welcomeText = `<b>💻 Coding Master Engine Active!</b><br>
                    नमस्ते! मैं आपका सॉफ्टवेयर आर्किटेक्ट AI हूँ।<br><br>
                    • <b>कोड जनरेशन:</b> किसी भी भाषा में ऑप्टिमाइज्ड, प्रोडक्शन-रेडी कोड व डिबगिंग।<br>
                    • <b>प्रौद्योगिकी सलाह:</b> टेक-स्टैक चयन और सॉफ्टवेयर आर्किटेक्चर समाधान।`;
                } else if (mode === 'INTERVIEW') {
                    avatarIcon = "👔";
                    welcomeText = `<b>👔 Senior Mock Interviewer Active!</b><br>
                    नमस्ते! मैं आपका सीनियर टेक्निकल इंटरव्यूअर हूँ।<br><br>
                    • <b>लाइव इंटरव्यू सिमुलेशन:</b> मैं आपसे एक-एक करके तकनीकी प्रश्न पूछूँगा।<br>
                    • <b>फीडबैक:</b> आपके उत्तर का विश्लेषण करके रियल-टाइम स्कोर और फीडबैक मिलेगा।`;
                } else if (mode === 'SALES') {
                    avatarIcon = "🤝";
                    welcomeText = `<b>🤝 B2B Sales Executive Active!</b><br>
                    नमस्ते! मैं आपका B2B Sales Expert हूँ।<br><br>
                    • <b>Objection Handling & Persuasion:</b> किसी भी सेल्स रिजेक्शन या फीस डिस्काउंट की स्थिति में बातचीत का अभ्यास करें।`;
                } else {
                    avatarIcon = "🧠";
                    welcomeText = `<b>🧠 Omni Super AI Engine Active!</b><br>
                    नमस्ते! मैं आपका यूनिवर्सल AI असिस्टेंट हूँ।<br><br>
                    • <b>सामान्य प्रश्न व परीक्षा तैयारी:</b> कठिन से कठिन विषयों का सरल विश्लेषण।<br>
                    • <b>बहुभाषी भाषा समझ:</b> आप किसी भी शैली या भाषा में बेझिझक सवाल पूछ सकते हैं।`;
                }

                const aiMsgId = 'ai-welcome-' + Date.now();
                UIManager.appendMsg(welcomeText, 'ai', aiMsgId, avatarIcon);
                UIManager.renderActionBar(aiMsgId);
            },

            handleKeyPress: function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.submitQuery();
                }
            },

            copyResponse: function(btn) {
                const bubble = btn.closest('.bubble');
                const clone = bubble.cloneNode(true);
                const bar = clone.querySelector('.ai-action-bar');
                if (bar) bar.remove();
                navigator.clipboard.writeText(clone.innerText.trim()).then(() => {
                    btn.innerHTML = '✅ Copied!';
                    setTimeout(() => { btn.innerHTML = '📋 Copy'; }, 2000);
                });
            },

            toggleFeedback: function(btn) {
                btn.style.color = '#4ade80';
            },

            submitQuery: async function() {
                const input = document.getElementById('userInput');
                if (!input) return;

                const text = input.value.trim();
                if (!text) return;

                const mode = this.currentMode;

                UIManager.appendMsg(text, 'user');
                input.value = '';

                const aiMsgId = 'ai-' + Date.now();
                let currentAvatar = '🧠';

                if (mode === 'INTERVIEW') currentAvatar = '👔';
                else if (mode === 'SALES') currentAvatar = '🤝';
                else if (mode === 'DEV') currentAvatar = '💻';
                else if (mode === 'FINANCE') currentAvatar = '📈';

                UIManager.appendMsg("<i>Thinking... ⚡</i>", 'ai', aiMsgId, currentAvatar);

                // DYNAMIC SYSTEM PROMPT CONFIGURED FOR DIFFERENT ROLES
                let systemRolePrompt = "";

                if (mode === 'INTERVIEW') {
                    systemRolePrompt = `ROLE: Senior Tech Lead & Mock Interviewer.
1. DUTY: Conduct a structured technical mock interview. Ask strictly ONE question at a time.
2. FEEDBACK: Evaluate user's answers with constructive feedback before asking the next question.
3. TONE: Professional, analytical, fair, and supportive.
4. CREATOR RULE: "${SYSTEM_CREATOR}".`;
                } else if (mode === 'SALES') {
                    systemRolePrompt = `ROLE: B2B SaaS Sales Executive & Persuasion Specialist.
1. DUTY: Handle objections, explain product value proposition, and practice B2B sales pitch negotiations.
2. TONE: Energetic, highly persuasive, confident, and solution-oriented.
3. CREATOR RULE: "${SYSTEM_CREATOR}".`;
                } else if (mode === 'FINANCE') {
                    systemRolePrompt = `ROLE: Quantitative & Financial Trading AI Specialist. Creator info: "${SYSTEM_CREATOR}".`;
                } else if (mode === 'DEV') {
                    systemRolePrompt = `ROLE: Senior Software Architect and Master Programmer. Creator info: "${SYSTEM_CREATOR}".`;
                } else {
                    systemRolePrompt = `ROLE: Universal General Knowledge & Omni AI Communication Specialist.
1. TONE & COMMUNICATION: Adapt tone dynamically, switch language smoothly between Hindi/Hinglish/English.
2. CREATOR RULE: "${SYSTEM_CREATOR}".`;
                }

                const bubbleElement = document.getElementById(aiMsgId);
                const bubble = bubbleElement ? bubbleElement.querySelector('.bubble') : null;

                try {
                    const finalReply = await GeminiOmniEngine.processChat(
                        text,
                        systemRolePrompt,
                        (streamedText) => {
                            if (bubble) {
                                bubble.innerHTML = window.marked ? marked.parse(streamedText) : streamedText;
                                if (window.hljs) hljs.highlightAll();
                            }
                        }
                    );

                    if (bubbleElement) {
                        UIManager.renderActionBar(aiMsgId);
                    }
                    VoiceEngine.speak(finalReply);
                } catch (err) {
                    if (bubble) {
                        bubble.innerHTML = `**[System Error]** AI Connection Error: \`${err.message || err}\``;
                    }
                }
            },

            toggleSidebar: function(e) {
                if (e) e.stopPropagation();
                document.getElementById('sidebar').classList.toggle('open');
            },

            closeSidebarMobile: function() {
                document.getElementById('sidebar').classList.remove('open');
            }
        };

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            AppController.init();
        });
    </script>
</body>
</html>
