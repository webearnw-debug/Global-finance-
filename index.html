<!-- =====================================================================
     PARNARAV FINANCE AI — Embeddable Chat Widget
     Iss poore block ko apni website ke </body> tag se pehle paste kar dein.
     Kahin bhi paste karein — ek floating icon apne aap bottom-right corner
     mein aa jayega. Click karte hi chat panel khulega.
===================================================================== -->

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://js.puter.com/v2/"></script>

<style>
  #pf-root, #pf-root * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

  /* ---------- Floating Button ---------- */
  #pf-fab {
    position: fixed; bottom: 22px; right: 22px; width: 58px; height: 58px;
    border-radius: 50%; background: linear-gradient(135deg,#0f172a,#1e3a8a);
    color: #38bdf8; display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer; z-index: 999998;
    box-shadow: 0 10px 28px rgba(15,23,42,.45);
    border: 1px solid rgba(56,189,248,.35);
    transition: transform .2s ease;
  }
  #pf-fab:hover { transform: scale(1.08); }

  /* ---------- Chat Panel ---------- */
  #pf-panel {
    position: fixed; bottom: 92px; right: 22px; z-index: 999999;
    width: 380px; max-width: calc(100vw - 32px);
    height: 560px; max-height: calc(100vh - 130px);
    background: #0b0f19; border: 1px solid #1f2937; border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
    display: none; flex-direction: column; overflow: hidden;
  }
  #pf-panel.open { display: flex; }

  .pf-head {
    background: #111827; color: #f9fafb; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #1f2937;
  }
  .pf-head b { font-size: 15px; }
  .pf-head small { display:block; color:#9ca3af; font-size: 11px; }
  .pf-close { cursor: pointer; color: #9ca3af; font-size: 18px; }
  .pf-close:hover { color: #fff; }

  .pf-quick { display: flex; gap: 6px; padding: 8px 10px; flex-wrap: wrap; background:#0b0f19; border-bottom:1px solid #1f2937; }
  .pf-qbtn {
    background: #111827; border: 1px solid #1f2937; color: #d1d5db;
    font-size: 11.5px; padding: 6px 9px; border-radius: 8px; cursor: pointer; font-weight:600;
  }
  .pf-qbtn:hover { border-color: #38bdf8; color: #38bdf8; }

  .pf-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background:#0b0f19; }

  .pf-msg { max-width: 88%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; word-wrap: break-word; }
  .pf-msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 2px; }
  .pf-msg.ai   { align-self: flex-start; background: #111827; color: #e5e7eb; border: 1px solid #1f2937; border-bottom-left-radius: 2px; }
  .pf-msg.ai b { color: #38bdf8; }

  .pf-foot { display: flex; gap: 8px; padding: 10px; background: #0b0f19; border-top: 1px solid #1f2937; }
  .pf-input {
    flex: 1; background: #111827; border: 1px solid #1f2937; color: #f9fafb;
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px; outline: none; resize:none; height: 40px;
  }
  .pf-input:focus { border-color: #38bdf8; }
  .pf-send {
    width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg,#38bdf8,#818cf8); color: #fff; display:flex; align-items:center; justify-content:center;
  }

  @media (max-width: 480px) {
    #pf-panel { right: 8px; bottom: 84px; width: calc(100vw - 16px); }
    #pf-fab { right: 14px; bottom: 14px; }
  }
</style>

<div id="pf-root">
  <div id="pf-fab" title="Finance AI Assistant"><i class="fa-solid fa-chart-line"></i></div>

  <div id="pf-panel">
    <div class="pf-head">
      <div><b>Parnarav Finance AI</b><small>Trading • Investment • Loans</small></div>
      <div class="pf-close" id="pf-close">&times;</div>
    </div>

    <div class="pf-quick">
      <button class="pf-qbtn" data-tool="sip">SIP</button>
      <button class="pf-qbtn" data-tool="stepup">Step-Up SIP</button>
      <button class="pf-qbtn" data-tool="emi">Loan EMI</button>
      <button class="pf-qbtn" data-tool="cagr">CAGR</button>
      <button class="pf-qbtn" data-tool="rr">Risk:Reward</button>
      <button class="pf-qbtn" data-tool="rule72">Rule of 72</button>
    </div>

    <div class="pf-body" id="pf-body"></div>

    <div class="pf-foot">
      <textarea class="pf-input" id="pf-input" placeholder="Apna sawaal likhein..."></textarea>
      <button class="pf-send" id="pf-send"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
(function () {
  if (window.__PF_WIDGET_LOADED__) return; // duplicate-load guard
  window.__PF_WIDGET_LOADED__ = true;

  // ---------------- CONFIG (edit here to re-brand) ----------------
  const CONFIG = {
    brand: "Parnarav Finance AI",
    systemPrompt:
      "Aap ek finance, trading, investment aur loans expert AI assistant hain. " +
      "Hamesha seedha, saaf aur practical jawab dein — Hindi/Hinglish/English jo user use kare usi mein. " +
      "Numbers/calculations bilkul accurate hone chahiye. Kabhi bhi guaranteed-return ya 'sure-shot profit' " +
      "jaisa daava na karein — hamesha yeh spasht karein ki yeh general jaankari hai, personal financial advice nahi, " +
      "aur bade decisions se pehle SEBI-registered advisor/CA se salaah lein."
  };

  let history = [{ role: "system", content: CONFIG.systemPrompt }];
  let disclaimerShown = false;

  // ---------------- Helpers ----------------
  function esc(str) {
    const d = document.createElement("div");
    d.innerText = str;
    return d.innerHTML;
  }

  function addMsg(html, sender) {
    const body = document.getElementById("pf-body");
    const row = document.createElement("div");
    row.className = "pf-msg " + sender;
    row.innerHTML = html;
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
    return row;
  }

  function addCard(title, lines) {
    addMsg(`<b>${esc(title)}</b><br>${lines.map(esc).join("<br>")}`, "ai");
  }

  // ---------------- Real calculators (actual formulas, no fake data) ----------------
  const TOOLS = {
    sip: function () {
      const amt = parseFloat(prompt("Monthly SIP amount (₹):", "10000")) || 10000;
      const rate = parseFloat(prompt("Expected annual return (%):", "12")) || 12;
      const yrs = parseInt(prompt("Tenure (years):", "10")) || 10;
      const r = rate / 12 / 100, n = yrs * 12;
      const invested = amt * n;
      const corpus = amt * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
      addCard("SIP Projection", [
        `Monthly SIP: ₹${amt.toLocaleString()} for ${yrs} yrs @ ${rate}%`,
        `Total invested: ₹${Math.round(invested).toLocaleString()}`,
        `Projected corpus: ₹${Math.round(corpus).toLocaleString()}`
      ]);
    },
    stepup: function () {
      const start = parseFloat(prompt("Starting monthly SIP (₹):", "10000")) || 10000;
      const step = parseFloat(prompt("Annual step-up (%):", "10")) || 10;
      const rate = parseFloat(prompt("Expected annual return (%):", "12")) || 12;
      const yrs = parseInt(prompt("Tenure (years):", "10")) || 10;
      let invested = 0, sip = start, corpus = 0;
      const mRate = rate / 12 / 100;
      for (let y = 1; y <= yrs; y++) {
        for (let m = 1; m <= 12; m++) { invested += sip; corpus = (corpus + sip) * (1 + mRate); }
        sip += (sip * step) / 100;
      }
      addCard("Step-Up SIP Projection", [
        `Start: ₹${start.toLocaleString()}/mo, +${step}% every year, ${yrs} yrs`,
        `Total invested: ₹${Math.round(invested).toLocaleString()}`,
        `Projected corpus: ₹${Math.round(corpus).toLocaleString()}`
      ]);
    },
    emi: function () {
      const p = parseFloat(prompt("Loan amount (₹):", "500000")) || 500000;
      const rate = parseFloat(prompt("Interest rate (% p.a.):", "8.5")) || 8.5;
      const yrs = parseInt(prompt("Tenure (years):", "5")) || 5;
      const r = rate / 12 / 100, n = yrs * 12;
      const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      const total = emi * n;
      addCard("Loan EMI Breakdown", [
        `Principal: ₹${p.toLocaleString()} @ ${rate}% for ${yrs} yrs`,
        `Monthly EMI: ₹${Math.round(emi).toLocaleString()}`,
        `Total interest payable: ₹${Math.round(total - p).toLocaleString()}`
      ]);
    },
    cagr: function () {
      const initial = parseFloat(prompt("Initial value (₹):", "100000")) || 100000;
      const final = parseFloat(prompt("Final value (₹):", "250000")) || 250000;
      const yrs = parseFloat(prompt("Time (years):", "5")) || 5;
      const cagr = ((Math.pow(final / initial, 1 / yrs) - 1) * 100).toFixed(2);
      addCard("CAGR", [`₹${initial.toLocaleString()} → ₹${final.toLocaleString()} in ${yrs} yrs`, `CAGR: ${cagr}%`]);
    },
    rr: function () {
      const entry = parseFloat(prompt("Entry price (₹):", "100")) || 100;
      const sl = parseFloat(prompt("Stop-loss (₹):", "95")) || 95;
      const target = parseFloat(prompt("Target price (₹):", "115")) || 115;
      const risk = Math.abs(entry - sl), reward = Math.abs(target - entry);
      const ratio = (reward / risk).toFixed(2);
      addCard("Risk : Reward", [
        `Risk/share: ₹${risk} | Reward/share: ₹${reward}`,
        `Ratio: 1 : ${ratio} — ${ratio >= 2 ? "Favourable setup" : "Weak setup, be cautious"}`
      ]);
    },
    rule72: function () {
      const rate = parseFloat(prompt("Expected annual return (%):", "12")) || 12;
      addCard("Rule of 72", [`Time to double money @ ${rate}%: ~${(72 / rate).toFixed(1)} years`]);
    }
  };

  // ---------------- AI Engine (single, clean implementation) ----------------
  async function askAI(userText) {
    const thinking = addMsg("<i>Soch raha hoon...</i>", "ai");
    try {
      history.push({ role: "user", content: userText });
      const res = await puter.ai.chat(history, { stream: true });
      let full = "";
      if (res && res[Symbol.asyncIterator]) {
        for await (const part of res) {
          if (part?.text) { full += part.text; thinking.innerHTML = esc(full).replace(/\n/g, "<br>"); }
        }
      } else {
        full = typeof res === "string" ? res : (res?.message?.content || res?.text || "");
        thinking.innerHTML = esc(full).replace(/\n/g, "<br>");
      }
      history.push({ role: "assistant", content: full });

      if (!disclaimerShown) {
        thinking.innerHTML += `<br><br><small style="color:#9ca3af;">⚠️ Yeh general jaankari hai, personal financial advice nahi.</small>`;
        disclaimerShown = true;
      }
      document.getElementById("pf-body").scrollTop = 999999;
    } catch (err) {
      thinking.innerHTML = "⚠️ Connection error, dobara try karein.";
      console.error("Parnarav AI error:", err);
    }
  }

  // ---------------- UI wiring ----------------
  const fab = document.getElementById("pf-fab");
  const panel = document.getElementById("pf-panel");
  const input = document.getElementById("pf-input");

  fab.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open") && !document.getElementById("pf-body").hasChildNodes()) {
      addMsg(`<b>${esc(CONFIG.brand)}</b><br>Namaste! Trading, investment ya loan se juda koi bhi sawaal poochein, ya upar diye tools use karein.`, "ai");
    }
  });
  document.getElementById("pf-close").addEventListener("click", () => panel.classList.remove("open"));

  document.getElementById("pf-send").addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(esc(text), "user");
    input.value = "";
    askAI(text);
  }

  document.querySelectorAll(".pf-qbtn").forEach((btn) => {
    btn.addEventListener("click", () => TOOLS[btn.dataset.tool]());
  });
})();
</script>
