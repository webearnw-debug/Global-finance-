<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Master AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #030712;
            color: #f9fafb;
            display: flex;
            overflow: hidden;
        }

        /* Desktop Sidebar */
        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: #0b0f19;
            border-right: 1px solid #1f2937;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Text wrap fix */
        }

        .topbar {
            height: 60px;
            background-color: #0b0f19;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble-ai {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-left: 4px solid #38bdf8;
            border-radius: 10px;
            padding: 14px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .input-wrapper {
            padding: 12px 16px;
            background: #0b0f19;
            border-top: 1px solid #1f2937;
            flex-shrink: 0;
        }

        .input-box input {
            width: 100%;
            height: 44px;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 0 12px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        /* --- MOBILE RESPONSIVE FIX --- */
        @media (max-width: 768px) {
            .sidebar {
                display: none; /* मोबाइल पर साइडबार ऑटो-हाइड हो जाएगा */
            }
            .chat-bubble-ai {
                max-width: 95%; /* मोबाइल पर मैसेज पूरा चौड़ा दिखेगा */
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color: #38bdf8; font-size: 1.1rem;">NEXUS MASTER AI</h2>
        <p style="color: #9ca3af; font-size: 0.85rem; margin-top: 5px;">यूनिवर्सल AI स्टूडियो</p>
    </aside>

    <main class="workspace">
        <header class="topbar">
            <span style="font-weight: 600; font-size: 0.95rem;">Nexus Super AI Engine</span>
            <span style="color: #4ade80; font-size: 0.8rem;">● Online</span>
        </header>

        <section class="chat-container">
            <div class="chat-bubble-ai">
                <b>Nexus Master AI:</b> नमस्ते! मैं आपका ऑल-इन-वन सुपर AI हूँ। फाइनेंस, क्वांट ट्रेडिंग, कोडिंग और यूनिवर्सल ज्ञान में सहायता के लिए तैयार हूँ।
            </div>
        </section>

        <footer class="input-wrapper">
            <div class="input-box">
                <input type="text" placeholder="अपना सवाल दर्ज करें...">
            </div>
        </footer>
    </main>

</body>
</html>
