<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#030811">
<meta name="description" content="Global Finance — Markets, Trading, Investing, Crypto, Forex and Financial News">

<title>Global Finance — Smart Decisions, Stronger Future</title>

<style>
/* =========================================================
   GLOBAL FINANCE
   PREMIUM RESPONSIVE FINANCE PLATFORM
   ========================================================= */

:root{
  --bg:#02070e;
  --bg2:#06101c;
  --panel:#071522;
  --panel2:#0a1b2b;
  --line:rgba(255,255,255,.105);
  --line2:rgba(255,255,255,.06);
  --gold:#efb93f;
  --gold2:#ffd873;
  --green:#19dc7b;
  --red:#ff5364;
  --blue:#21a8ff;
  --text:#f5f7fa;
  --muted:#8b99aa;
  --shadow:0 25px 80px rgba(0,0,0,.42);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-width:320px;
  background:
    radial-gradient(circle at 80% 18%,rgba(20,130,255,.09),transparent 30%),
    radial-gradient(circle at 15% 55%,rgba(239,185,63,.045),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1500px,calc(100% - 28px));
  margin:auto;
}


/* =========================================================
   LIVE TICKER
   ========================================================= */

.ticker{
  height:48px;
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  background:#01050a;
  border-bottom:1px solid var(--line);
}

.ticker-track{
  width:max-content;
  height:100%;
  display:flex;
  align-items:center;
  animation:ticker 38s linear infinite;
}

.ticker:hover .ticker-track{
  animation-play-state:paused;
}

.ticker-item{
  height:100%;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:8px;
  border-right:1px solid var(--line2);
  color:#aab5c2;
  font-size:12px;
}

.ticker-item b{
  color:#f5f7fa;
}

.green{
  color:var(--green)!important;
}

.red{
  color:var(--red)!important;
}

.gold{
  color:var(--gold)!important;
}

.live{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  animation:blink 1.5s infinite;
}

@keyframes ticker{
  from{transform:translateX(0)}
  to{transform:translateX(-45%)}
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.35}
}


/* =========================================================
   NAVBAR
   ========================================================= */

.navbar{
  height:94px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  background:rgba(3,9,16,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(22px);
  position:relative;
  z-index:1000;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:245px;
}

.brand-logo{
  width:53px;
  height:53px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:#07101a;
  font-weight:950;
  font-size:20px;
  background:linear-gradient(145deg,#ffe59a,#c68b1c);
  box-shadow:0 0 30px rgba(239,185,63,.15);
}

.brand-name{
  font-size:24px;
  font-weight:850;
  letter-spacing:-1px;
}

.brand-name span{
  color:var(--gold);
}

.brand-tag{
  margin-top:5px;
  font-size:8px;
  color:#8290a0;
  letter-spacing:1.2px;
}

.nav{
  display:flex;
  align-items:center;
  gap:2px;
}

.nav a{
  padding:12px 11px;
  font-size:12px;
  font-weight:650;
  color:#c3ccd6;
  border-radius:8px;
  position:relative;
}

.nav a:hover,
.nav a.active{
  color:var(--gold2);
  background:rgba(255,255,255,.035);
}

.nav a.active:after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:3px;
  height:2px;
  background:var(--gold);
  box-shadow:0 0 10px rgba(239,185,63,.7);
}

.nav a .arrow{
  font-size:8px;
  margin-left:3px;
  opacity:.65;
}

.actions{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:225px;
  justify-content:flex-end;
}

.icon-btn{
  width:43px;
  height:43px;
  border:1px solid var(--line);
  border-radius:50%;
  color:#fff;
  background:#06101b;
}

.icon-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.login{
  height:43px;
  padding:0 17px;
  border:1px solid rgba(239,185,63,.7);
  background:transparent;
  color:white;
  border-radius:8px;
  font-size:12px;
}

.signup{
  height:43px;
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:#07101a;
  background:linear-gradient(135deg,#ffe18b,#d99d27);
  font-weight:800;
  font-size:12px;
}

.menu{
  display:none;
  width:43px;
  height:43px;
  background:#07121e;
  color:white;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:20px;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
  min-height:410px;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--line);
}

.hero-grid{
  position:absolute;
  inset:0;
  opacity:.14;
  background-image:
    linear-gradient(rgba(32,154,255,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(32,154,255,.15) 1px,transparent 1px);
  background-size:50px 50px;
  transform:perspective(550px) rotateX(58deg) scale(1.4);
  transform-origin:center bottom;
}

.hero-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 70% 55%,rgba(18,137,238,.16),transparent 28%),
    linear-gradient(90deg,#020912 0%,rgba(2,9,18,.78) 45%,rgba(2,9,18,.2) 75%,#020912 100%);
}

.hero-content{
  min-height:410px;
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  padding:40px 10px;
}

.hero-copy{
  width:55%;
  padding-left:7%;
}

.badge{
  display:inline-flex;
  padding:7px 12px;
  border:1px solid rgba(239,185,63,.45);
  border-radius:8px;
  color:var(--gold);
  background:rgba(239,185,63,.05);
  font-size:10px;
  font-weight:800;
}

.hero h1{
  margin-top:17px;
  font-size:clamp(42px,5vw,68px);
  line-height:.98;
  letter-spacing:-3px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  margin-top:18px;
  max-width:520px;
  color:#a6b2c0;
  line-height:1.65;
  font-size:15px;
}

.hero-search{
  width:min(500px,100%);
  height:50px;
  margin-top:22px;
  display:flex;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  overflow:hidden;
  background:rgba(0,0,0,.32);
}

.hero-search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:0 16px;
}

.hero-search input::placeholder{
  color:#687687;
}

.hero-search button{
  width:65px;
  border:0;
  background:var(--gold);
  color:#07101a;
  font-size:20px;
}

.stats{
  display:flex;
  gap:35px;
  margin-top:25px;
}

.stat{
  display:flex;
  flex-direction:column;
}

.stat b{
  font-size:18px;
}

.stat small{
  margin-top:3px;
  color:#768496;
  font-size:10px;
}


/* =========================================================
   DIGITAL GLOBE
   ========================================================= */

.globe{
  position:absolute;
  width:440px;
  height:440px;
  right:16%;
  top:50%;
  transform:translateY(-50%);
  border-radius:50%;
  border:1px solid rgba(43,170,255,.35);
  background:
    radial-gradient(circle at 35% 30%,rgba(71,197,255,.2),transparent 30%),
    radial-gradient(circle,#09223a 0%,#03101d 62%,#01060b 76%);
  box-shadow:
    inset -50px -30px 100px rgba(0,0,0,.85),
    0 0 100px rgba(19,146,255,.12);
  overflow:hidden;
}

.globe:before{
  content:"";
  position:absolute;
  inset:20px;
  border-radius:50%;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 27px,
      rgba(41,170,255,.16) 28px 29px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 27px,
      rgba(41,170,255,.12) 28px 29px
    );
  transform:rotate(-10deg) scale(1.12);
  animation:rotateGlobe 22s linear infinite;
}

.globe:after{
  content:"";
  position:absolute;
  left:7%;
  width:86%;
  top:51%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    #1ba6ff,
    #6fe5ff,
    #1ba6ff,
    transparent
  );
  box-shadow:0 0 18px #1ba6ff;
  transform:rotate(-13deg);
  animation:chart 2.2s ease-in-out infinite;
}

@keyframes rotateGlobe{
  from{transform:rotate(-10deg) scale(1.12)}
  to{transform:rotate(10deg) scale(1.12)}
}

@keyframes chart{
  0%,100%{opacity:.5}
  50%{opacity:1}
}


/* =========================================================
   MARKET SIDE PANEL
   ========================================================= */

.market-panel{
  position:absolute;
  z-index:10;
  right:3%;
  top:50%;
  transform:translateY(-50%);
  width:235px;
  padding:12px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;
  background:rgba(4,12,21,.76);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}

.market-row{
  min-height:47px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line2);
}

.market-row:last-child{
  border-bottom:0;
}

.market-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.market-icon{
  width:27px;
  height:27px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#087ecf;
  font-size:10px;
  font-weight:800;
}

.market-name{
  display:flex;
  flex-direction:column;
}

.market-name b{
  font-size:10px;
}

.market-name span{
  margin-top:2px;
  color:#9ba7b5;
  font-size:10px;
}

.change{
  color:var(--green);
  font-size:10px;
  font-weight:700;
}


/* =========================================================
   QUICK ACTION BAR
   ========================================================= */

.quick{
  position:relative;
  z-index:30;
  margin-top:-1px;
  padding:0 14px;
}

.quick-inner{
  min-height:104px;
  display:grid;
  grid-template-columns:repeat(9,1fr);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(8,24,39,.94),rgba(4,13,23,.96));
  backdrop-filter:blur(18px);
  overflow:hidden;
}

.quick-card{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
  border-right:1px solid var(--line2);
  transition:.25s;
}

.quick-card:last-child{
  border-right:0;
}

.quick-card:hover{
  background:rgba(255,255,255,.035);
  transform:translateY(-2px);
}

.quick-icon{
  font-size:22px;
  color:#d7e6f5;
}

.quick-card b{
  font-size:11px;
}

.quick-card span{
  color:#728093;
  font-size:9px;
}


/* =========================================================
   BREAKING NEWS
   ========================================================= */

.breaking{
  margin:22px auto 40px;
  min-height:62px;
  display:flex;
  border:1px solid rgba(255,255,255,.12);
  border-radius:11px;
  overflow:hidden;
  background:#07111d;
}

.breaking-title{
  width:190px;
  min-width:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
  font-weight:800;
  font-size:12px;
  border-right:1px solid rgba(239,185,63,.22);
}

.news{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  width:100%;
}

.news-item{
  padding:11px 18px;
  border-right:1px solid var(--line2);
}

.news-item:last-child{
  border-right:0;
}

.news-meta{
  color:#5f7185;
  font-size:9px;
}

.news-meta span{
  color:var(--blue);
}

.news-text{
  margin-top:5px;
  color:#d8e0e8;
  font-size:11px;
}


/* =========================================================
   SEARCH MODAL
   ========================================================= */

.search-modal{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  align-items:flex-start;
  justify-content:center;
  padding-top:110px;
}

.search-modal.open{
  display:flex;
}

.search-window{
  width:min(720px,92%);
  padding:10px;
  border:1px solid rgba(239,185,63,.35);
  border-radius:14px;
  background:#06101b;
  box-shadow:0 40px 100px rgba(0,0,0,.7);
}

.search-window input{
  width:100%;
  height:58px;
  border:0;
  outline:0;
  border-radius:9px;
  padding:0 18px;
  background:#0b1928;
  color:white;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:1200px){

  .navbar{
    padding:0 20px;
  }

  .nav{
    gap:0;
  }

  .nav a{
    padding:11px 7px;
    font-size:11px;
  }

  .brand{
    min-width:auto;
  }

  .brand-name{
    font-size:20px;
  }

  .brand-tag{
    display:none;
  }

  .actions{
    min-width:auto;
  }

  .login{
    display:none;
  }

  .globe{
    right:-70px;
    opacity:.55;
  }

  .market-panel{
    right:15px;
  }

  .quick-inner{
    grid-template-columns:repeat(5,1fr);
  }
}


@media(max-width:850px){

  .ticker{
    height:40px;
  }

  .ticker-item{
    height:40px;
    padding:0 13px;
    font-size:10px;
  }

  .navbar{
    height:74px;
  }

  .brand-logo{
    width:42px;
    height:42px;
    border-radius:11px;
  }

  .brand-name{
    font-size:18px;
  }

  .nav{
    display:none;
    position:absolute;
    top:74px;
    left:10px;
    right:10px;
    flex-direction:column;
    align-items:stretch;
    padding:8px;
    background:#06101b;
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
  }

  .nav.open{
    display:flex;
  }

  .nav a{
    padding:14px;
    font-size:13px;
  }

  .menu{
    display:block;
  }

  .icon-btn{
    display:none;
  }

  .hero{
    min-height:530px;
  }

  .hero-content{
    min-height:530px;
    align-items:flex-start;
    padding:45px 22px;
  }

  .hero-copy{
    width:100%;
    padding-left:0;
  }

  .hero h1{
    font-size:42px;
    letter-spacing:-2px;
  }

  .hero p{
    font-size:13px;
    max-width:450px;
  }

  .globe{
    width:330px;
    height:330px;
    right:-125px;
    top:70%;
    opacity:.35;
  }

  .market-panel{
    display:none;
  }

  .stats{
    gap:22px;
    flex-wrap:wrap;
  }

  .quick-inner{
    grid-template-columns:repeat(3,1fr);
  }

  .quick-card{
    min-height:84px;
  }

  .breaking{
    display:block;
  }

  .breaking-title{
    width:100%;
    min-width:0;
    height:44px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .news{
    grid-template-columns:1fr;
  }

  .news-item{
    min-height:55px;
    border-right:0;
    border-bottom:1px solid var(--line2);
  }
}


@media(max-width:500px){

  .container{
    width:calc
