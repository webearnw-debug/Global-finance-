<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance - Dark Bullish Layout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #06090e;
            --bg-card: #0d131f;
            --accent-green: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.3);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Top Live Ticker Bar */
        .ticker-bar {
            background: #030508;
            border-bottom: 1px solid var(--border-color);
            padding: 6px 4%;
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .ticker-val {
            color: var(--text-primary);
            font-weight: 600;
        }

        .ticker-up {
            color: var(--accent-green);
            font-weight: 600;
        }

        .ticker-down {
            color: #ff5252;
            font-weight: 600;
        }

        /* Top Header Navigation */
        .header {
            position: sticky;
            top: 0;
            background: rgba(13, 19, 31, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 4%;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            color: var(--accent-green);
            font-size: 1.3rem;
        }

        /* Main Top Header Menu Items */
        .navbar {
            display: flex;
            gap: 1.2rem;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-green);
            background: rgba(0, 230, 118, 0.08);
        }

        /* Header Right Side Controls & AI Badge */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent-green);
        }

        /* Photo Jaisa Glowing AI Badge Icon */
        .ai-header-btn {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 230, 118, 0.05));
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .ai-header-btn:hover, .ai-header-btn.active {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 20px var(--accent-green);
        }

        /* Operating Systems Area */
        .main-workspace {
            padding: 1.5rem 4%;
        }

        .os-view {
            display: none;
        }

        .os-view.active {
            display: block;
        }

        /* Blank OS Canvas for Your Code */
        .blank-os-container {
            width: 100%;
            min-height: 80vh;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: var(--bg-card);
            position: relative;
        }

        /* Mobile Hamburger Icon */
        .mobile-menu-btn {
            display: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .navbar {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: #0d131f;
                flex-direction: column;
                padding: 1rem;
                border-bottom: 1px solid var(--border-color);
            }
            .navbar.open {
                display: flex;
            }
            .mobile-menu-btn {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Top Stock Ticker Bar -->
    <div class="ticker-bar">
        <div class="ticker-item">NIFTY 50 <span class="ticker-val">24,834.85</span> <span class="ticker-up">+0.42%</span></div>
        <div class="ticker-item">SENSEX <span class="ticker-val">81,157.73</span> <span class="ticker-up">+0.45%</span></div>
        <div class="ticker-item">USD/INR <span class="ticker-val">83.28</span> <span class="ticker-down">-0.10%</span></div>
        <div class="ticker-item">GOLD (MCX) <span class="ticker-val">72,145.00</span> <span class="ticker-up">+0.15%</span></div>
        <div class="ticker-item">BTC/USDT <span class="ticker-val">67,245.30</span> <span class="ticker-up">+1.25%</span></div>
    </div>

    <!-- 2. Header & Main Navbar Menu -->
    <header class="header">
        <a href="#" class="logo">
            <i class="fa-solid fa-chart-line logo-icon"></i> GLOBAL FINANCE
        </a>

        <!-- Menu items matching photo header layout -->
        <ul class="navbar" id="topNavbar">
            <li><a class="nav-link active" onclick="switchOS('home', this)">Home</a></li>
            <li><a class="nav-link" onclick="switchOS('markets', this)">Markets</a></li>
            <li><a class="nav-link" onclick="switchOS('trading', this)">Trading</a></li>
            <li><a class="nav-link" onclick="switchOS('investments', this)">Investments</a></li>
            <li><a class="nav-link" onclick="switchOS('loans', this)">Loans</a></li>
            <li><a class="nav-link" onclick="switchOS('earnings', this)">Earnings</a></li>
            <li><a class="nav-link" onclick="switchOS('insights', this)">Insights</a></li>
            <li><a class="nav-link" onclick="switchOS('tools', this)">Tools <i class="fa-solid fa-chevron-down" style="font-size:0.7rem;"></i></a></li>
            <li><a class="nav-link" onclick="switchOS('more', this)">More <i class="fa-solid fa-chevron-down" style="font-size:0.7rem;"></i></a></li>
        </ul>

        <!-- Right side Header Actions & Updated AI Button -->
        <div class="header-actions">
            <button class="icon-btn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            
            <button class="ai-header-btn" onclick="switchOS('ai', this)">
                <i class="fa-solid fa-robot"></i> AI Personal Assistant
            </button>

            <button class="icon-btn" title="User Profile"><i class="fa-regular fa-user"></i></button>
            <div class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <!-- 3. Dynamic Isolated Operating System Containers -->
    <main class="main-workspace">

        <!-- OS: HOME -->
        <div id="os-home" class="os-view active">
            <div class="blank-os-container">
                <!-- AAPKA HOME OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: MARKETS -->
        <div id="os-markets" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA MARKETS OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: TRADING -->
        <div id="os-trading" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA TRADING OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: INVESTMENTS -->
        <div id="os-investments" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA INVESTMENTS OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: LOANS -->
        <div id="os-loans" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA LOANS OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: EARNINGS -->
        <div id="os-earnings" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA EARNINGS OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: INSIGHTS -->
        <div id="os-insights" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA INSIGHTS OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: TOOLS -->
        <div id="os-tools" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA TOOLS OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: MORE -->
        <div id="os-more" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA MORE OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

        <!-- OS: AI ASSISTANT -->
        <div id="os-ai" class="os-view">
            <div class="blank-os-container">
                <!-- AAPKA AI ASSISTANT OPERATING SYSTEM CODE YAHAN AAYEGA -->
            </div>
        </div>

    </main>

    <script>
        function switchOS(targetId, element) {
            // Hide all active OS views
            const views = document.querySelectorAll('.os-view');
            views.forEach(v => v.classList.remove('active'));

            // Reset active states on navbar items and AI button
            const navLinks = document.querySelectorAll('.nav-link, .ai-header-btn');
            navLinks.forEach(n => n.classList.remove('active'));

            // Show selected OS view container
            const activeOS = document.getElementById('os-' + targetId);
            if (activeOS) activeOS.classList.add('active');

            // Highlight active button
            if (element) element.classList.add('active');
        }

        function toggleMobileMenu() {
            document.getElementById('topNavbar').classList.toggle('open');
        }
    </script>
</body>
</html>
