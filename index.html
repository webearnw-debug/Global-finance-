<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Chatbot (No API Key Required)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .chat-container { width: 100%; max-width: 600px; height: 90vh; background: #111827; border-radius: 16px; border: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        
        .header { background: #1e293b; padding: 18px 20px; font-weight: 700; text-align: center; color: #38bdf8; font-size: 1.1rem; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #0b0f19; }
        
        .msg-row { display: flex; gap: 12px; max-width: 85%; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.ai { align-self: flex-start; }
        
        .avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
        .user .avatar { background: #2563eb; color: white; }
        .ai .avatar { background: #38bdf8; color: #0b0f19; }
        
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user .bubble { background: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .ai .bubble { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        
        .input-box { display: flex; padding: 15px; background: #111827; border-top: 1px solid #1e293b; gap: 10px; }
        input { flex: 1; padding: 14px 18px; background: #0b0f19; border: 1px solid #334155; color: white; border-radius: 10px; outline: none; font-size: 0.95rem; }
        input:focus { border-color: #38bdf8; }
        
        button { padding: 14px 20px; background: #38bdf8; color: #0b0f19; border: none; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <i class="fa-solid fa-bolt"></i> Direct Free AI (No Key Required)
    </div>
    
    <div class="messages" id="chat">
        <div class="msg-row ai">
            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="bubble">Namaste! Main bina kisi key ke direct chalne wala AI hoon. Kuch bhi poochhein!</div>
        </div>
    </div>
    
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Yahan apna sawal likhein..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    async function sendMsg() {
        const input = document.getElementById("userInput");
        const chat = document.getElementById("chat");
        const text = input.value.trim();
        if (!text) return;

        // User message UI
        chat.innerHTML += `
            <div class="msg-row user">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="bubble">${escapeHtml(text)}</div>
            </div>`;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        // AI Loading State
        const loadingId = "load-" + Date.now();
        chat.innerHTML += `
            <div class="msg-row ai" id="${loadingId}">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bubble">Soch raha hoon...</div>
            </div>`;
        chat.scrollTop = chat.scrollHeight;

        try {
            // Free Public AI Server (No API Key Required)
            const response = await fetch("https://text.pollinations.ai/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: "You are a highly intelligent, polite, and helpful AI assistant." },
                        { role: "user", content: text }
                    ],
                    model: "openai"
                })
            });

            const replyText = await response.text();
            document.getElementById(loadingId).querySelector('.bubble').innerText = replyText;

        } catch (err) {
            document.getElementById(loadingId).querySelector('.bubble').innerText = "Network issue! Kripya internet connection check karein.";
        }
        
        chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
