<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Master AI Studio Pro</title>
    <script src="https://js.puter.com/v2/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #080c14;
            --panel-dark: #0f172a;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --user-bubble: #2563eb;
            --ai-bubble: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container { width: 100%; max-width: 1050px; height: 95vh; background: var(--panel-dark); border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }

        .top-bar { padding: 14px 20px; background: #0b1120; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--accent); }
        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        select { background: var(--panel-dark); color: var(--text-main); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; outline: none; font-size: 0.85rem; cursor: pointer; }
        select:focus { border-color: var(--accent); }

        .btn-sm { background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-sm:hover { background: var(--accent); color: #080c14; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: #ef4444; color: white; }

        .chat-display { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: var(--bg-dark); scroll-behavior: smooth; }

        .msg-row { display: flex; gap: 12px; max-width: 88%; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.ai { align-self: flex-start; }

        .avatar { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }
        .user .avatar { background: var(--user-bubble); color: white; }
        .ai .avatar { background: var(--panel-dark); border: 1px solid var(--border); color: var(--accent); }

        .bubble { background: var(--ai-bubble); padding: 14px 18px; border-radius: 14px; border: 1px solid var(--border); font-size: 0.93rem; line-height: 1.6; word-break: break-word; position: relative; }
        .user .bubble { background: var(--user-bubble); border: none; border-bottom-right-radius: 2px; color: white; }
        .ai .bubble { border-bottom-left-radius: 2px; }

        .model-badge { display: inline-block; font-size: 0.7rem; padding: 2px 6px; background: rgba(56, 189, 248, 0.15); color: var(--accent); border-radius: 4px; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }

        .bubble-actions { display: flex; gap: 12px; margin-top: 10px; font-size: 0.78rem; color: var(--text-sub); border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; }
        .action-btn { cursor: pointer; transition: color 0.2s; display: flex; align-items: center; gap: 4px; }
        .action-btn:hover { color: var(--accent); }

        pre { background: #030712 !important; border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; padding: 12px; overflow-x: auto; }
        code { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.85rem; }
        th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        th { background: rgba(56, 189, 248, 0.1); color: var(--accent); }

        .input-bar { padding: 14px 20px; background: var(--panel-dark); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
        
        textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 12px 45px 12px 16px; border-radius: 12px; outline: none; font-size: 0.93rem; resize: none; height: 50px; line-height: 1.4; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .mic-btn { position: absolute; right: 12px; bottom: 12px; background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; }
        .send-btn { background: var(--accent); color: #080c14; width: 48px; height: 48px; border-radius: 12px; border: none; cursor: pointer; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="brand">
            <i class="fa-solid fa-brain"></i> NEXUS AI STUDIO PRO
        </div>
        <div class="controls">
            <select id="modelSelect" title="Select AI Model">
                <option value="deepseek-reasoner">🔥 DeepSeek R1 (Logic & Reasoning)</option>
                <option value="gpt-4o">🧠 GPT-4o (Master Intelligence)</option>
                <option value="gpt-4o-mini">🤖 GPT-4o Mini (Ultra Fast)</option>
                <option value="claude-3-5-sonnet">⚡ Claude 3.5 Sonnet</option>
            </select>
            <button class="btn-sm" onclick="exportChat()"><i class="fa-solid fa-download"></i> Save</button>
            <button class="btn-sm btn-danger" onclick="clearMemory()"><i class="fa-solid fa-trash"></i> Clear</button>
        </div>
    </div>

    <div class="chat-display" id="chatDisplay">
        <div class="msg-row ai">
            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="bubble">
                <span class="model-badge">System Ready</span>
                <div class="bubble-text">नमस्ते! Main **Nexus AI** hoon. Aap kisi bhi vishey par sawaal pooch sakte hain—chahe decision-making ho, scriptwriting, public speaking ho ya koi saadharan query. Main aapki zaroorat ke hisaab se sabse best aur natural jawab dunga!</div>
            </div>
        </div>
    </div>

    <div class="input-bar">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Ask anything naturally..." onkeydown="handleKeyPress(event)"></textarea>
            <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <button class="send-btn" onclick="processMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    let conversationHistory = [];
    let lastUserPrompt = "";

    // ADAPTIVE & NATURAL SYSTEM PROMPT (FIXES ROBOTIC OVERLOAD)
    const BUILTIN_MASTER_PROMPT = `
You are Nexus AI, an intelligent, authentic, and clear AI collaborator.

CORE CAPABILITIES IN YOUR TOOLKIT:
1. Decision Models (First Principles, Cognitive Biases, 80/20 Rule)
2. Articulate Communication (Structured reasoning, clarity, proper tone)
3. Practical Knowledge & Case Studies (Book insights, real-world examples)
4. High-Engagement Delivery (Hooks, clean layout, actionable takeaways)

BEHAVIORAL RULES:
- Match the depth to the user's intent:
  * For casual greeting / simple factual queries: Respond naturally, concisely, and directly in 1-3 sentences. DO NOT force templates or rigid structures.
  * For advice, complex decisions, scripts, or deep learning queries: Seamlessly apply relevant frameworks (First Principles, PREP logic, tables, or action steps) WITHOUT explicitly writing robotic labels like "Point:", "Reason:", "Example:".
- Keep responses readable, visually engaging, and highly conversational.`;

    window.onload = () => { marked.setOptions({ highlight: (code) => hljs.highlightAuto(code).value }); };

    function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); processMessage(); } }

    function getCleanHistory() {
        let clean = [];
        conversationHistory.forEach((item, idx) => {
            if (idx === 0 && item.role === 'user') {
                clean.push({ role: 'user', content: `[SYSTEM INSTRUCTION: ${BUILTIN_MASTER_PROMPT}]\n\nUser Query: ${item.content}` });
            } else {
                clean.push({ role: item.role, content: item.content });
            }
        });
        return clean;
    }

    async function processMessage(retryText = null) {
        const input = document.getElementById('userInput');
        const text = retryText || input.value.trim();
        const selectedModel = document.getElementById('modelSelect').value;

        if (!text) return;
        lastUserPrompt = text;

        if (!retryText) { renderUserMessage(text); input.value = ''; }

        const aiId = 'ai-' + Date.now();
        conversationHistory.push({ role: 'user', content: text });
        renderAiPlaceholder("Thinking...", aiId, selectedModel);

        const safePayload = getCleanHistory();
        let aiReply = "";
        let usedModel = selectedModel;

        try {
            const response = await puter.ai.chat(safePayload, { model: selectedModel });
            aiReply = extractTextResponse(response);
        } catch (err) {
            try {
                const defaultFallback = await puter.ai.chat(safePayload);
                aiReply = extractTextResponse(defaultFallback);
                usedModel = selectedModel + " (Fallback)";
            } catch (finalErr) {
                aiReply = "Error: Connection failed. Please try again.";
            }
        }

        conversationHistory.push({ role: 'assistant', content: aiReply });

        const bubbleContainer = document.getElementById(aiId);
        if (bubbleContainer) {
            bubbleContainer.querySelector('.model-badge').innerText = usedModel;
            const bubbleObj = bubbleContainer.querySelector('.bubble-text');
            bubbleObj.innerHTML = marked.parse(aiReply);
            hljs.highlightAll();
            appendActions(bubbleContainer.querySelector('.bubble'));
        }

        const chatDisplay = document.getElementById('chatDisplay');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    function extractTextResponse(response) {
        if (typeof response === 'string') return response;
        if (response?.message?.content) return response.message.content;
        if (response?.text) return response.text;
        return JSON.stringify(response);
    }

    function renderUserMessage(text) {
        const display = document.getElementById('chatDisplay');
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="avatar"><i class="fa-solid fa-user"></i></div><div class="bubble"><div class="bubble-text">${escapeHtml(text)}</div></div>`;
        display.appendChild(row);
        display.scrollTop = display.scrollHeight;
    }

    function renderAiPlaceholder(text, id, modelName) {
        const display = document.getElementById('chatDisplay');
        const row = document.createElement('div');
        row.className = 'msg-row ai'; row.id = id;
        row.innerHTML = `<div class="avatar"><i class="fa-solid fa-robot"></i></div><div class="bubble"><span class="model-badge">${modelName}</span><div class="bubble-text">${text}</div></div>`;
        display.appendChild(row);
        display.scrollTop = display.scrollHeight;
    }

    function appendActions(bubbleElement) {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'bubble-actions';
        actionsDiv.innerHTML = `
            <span class="action-btn" onclick="speakText(this)"><i class="fa-solid fa-volume-high"></i> Listen</span>
            <span class="action-btn" onclick="copyText(this)"><i class="fa-solid fa-copy"></i> Copy</span>
        `;
        bubbleElement.appendChild(actionsDiv);
    }

    function speakText(btn) {
        const text = btn.closest('.bubble').querySelector('.bubble-text').innerText;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    function copyText(btn) {
        const text = btn.closest('.bubble').querySelector('.bubble-text').innerText;
        navigator.clipboard.writeText(text);
        alert("Copied!");
    }

    function clearMemory() {
        conversationHistory = [];
        document.getElementById('chatDisplay').innerHTML = `<div class="msg-row ai"><div class="avatar"><i class="fa-solid fa-robot"></i></div><div class="bubble"><span class="model-badge">Reset Complete</span><div class="bubble-text">Memory cleared!</div></div></div>`;
    }

    function exportChat() {
        let content = "NEXUS AI CHAT LOG\n=================\n\n";
        conversationHistory.forEach(msg => { content += `[${msg.role.toUpperCase()}]:\n${msg.content}\n\n`; });
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Chat_${Date.now()}.txt`; a.click();
    }

    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
</script>
</body>
</html>
