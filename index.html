<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Finance Intelligence | Bloomberg v4 Quantum-X</title>
    
    
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bb-black: #000000;
            --bb-white: #ffffff;
            --bb-border: #eaeaea;
            --bb-dark: #0d0d0d;
            --bb-muted: #666666;
            --bb-blue: #0056b3;
            --bb-gold: #ffd700;
            --bb-neon-green: #00ff66;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bb-white);
            color: var(--bb-dark);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. MASTER FIXED COMPACT HEADER */
        .qx-master-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #000000;
            z-index: 9999999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .qx-fluid-container {
            width: 96%;
            max-width: 1540px;
            margin: 0 auto;
        }

        /* TOP CONTROL ROW (LOGO + SEARCH + SUBSCRIBE) */
        .qx-top-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #151515;
        }

        /* 3D Liquid Gold Logo Animation */
        .qx-animated-logo {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ffffff 0%, #ffd700 25%, #ffffff 50%, #ffd700 75%, #ffffff 100%);
            background-size: 400% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: qxGold 5s linear infinite;
            white-space: nowrap;
        }
        @keyframes qxGold { 0% { background-position: 0% center; } 100% { background-position: 400% center; } }

        /* Professional Search Input */
        .qx-search-terminal {
            flex: 1;
            max-width: 450px;
            margin: 0 20px;
        }
        .qx-search-input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 8px 15px;
            border-radius: 4px;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
        }

        /* Premium Golden Subscribe Button */
        .qx-subscribe-btn {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000000;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }

        /* NAVIGATION MENU BAR */
        .qx-menu-bar {
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 12px 0;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #151515;
        }
        .qx-menu-item {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .qx-menu-item:hover, .qx-menu-item.active {
            color: #ffd700;
        }

        /* FINAL TICKER STRIP LAYOUT */
        .qx-ticker-strip {
            background: #000000;
            padding: 8px 0;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #111;
        }
        
        .qx-blink-area {
            background: #ff0000;
            color: #ffffff;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
            animation: qxBlink 1.5s ease-in-out infinite;
        }
        @keyframes qxBlink { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        
        .qx-ticker-scroll {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            margin: 0 20px;
        }
        .qx-scroll-inner {
            display: inline-block;
            padding-left: 100%;
            animation: qxMarquee 26s linear infinite;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }
        @keyframes qxMarquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        .ticker-node { display: inline-block; margin-right: 40px; }
        .node-up { color: var(--bb-neon-green); font-weight: 800; }
        .node-down { color: #ff3333; font-weight: 800; }

        .qx-market-open {
            color: var(--bb-neon-green);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .qx-pulse-dot {
            height: 7px;
            width: 7px;
            background-color: var(--bb-neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--bb-neon-green);
        }

        /* 2. MAIN CONTENT AREA (3-COLUMN ENGINE) */
        .main-terminal-area {
            margin-top: 170px; 
            padding: 20px;
            max-width: 1440px;
            margin-left: auto;
            margin-right: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 35px;
            box-sizing: border-box;
        }

        @media (max-width: 991px) {
            .main-terminal-area { margin-top: 210px; } /* Mobile Gap Setup */
        }

        @media (min-width: 992px) {
            .main-terminal-area {
                grid-template-columns: 1fr 1.6fr 1fr; 
            }
        }

        .terminal-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        /* Sharp Vertical Grid Dividers */
        .border-column {
            border-right: 1px solid var(--bb-border);
            padding-right: 15px;
        }

        @media (max-width: 991px) {
            .border-column { border-right: none; padding-right: 0; }
        }

        /* 3. PREMIUM CONTENT COMPONENTS */
        .bb-post-card {
            border-bottom: 1px solid var(--bb-border);
            padding-bottom: 25px;
            margin-bottom: 5px;
        }
        .bb-post-card:last-child { border-bottom: none; }
        
        .post-tag {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--bb-blue);
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        .post-headline {
            font-family: 'Merriweather', serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0 0 10px 0;
            letter-spacing: -0.3px;
        }
        .post-headline a { color: #000000; text-decoration: none; }
        .post-headline a:hover { color: var(--bb-blue); text-decoration: underline; }
        
        .post-excerpt { font-size: 15px; line-height: 1.6; color: var(--bb-muted); }

        /* ADSENSE SLOT */
        .premium-adsense-slot {
            background-color: #fcfcfc;
            border: 1px dashed #cccccc;
            text-align: center;
            padding: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

  <!-- FIXED MASTER HEADER -->
  <div class="qx-master-wrapper">
    <div class="qx-fluid-container">
      
      <!-- TOP CONTROL ROW -->
      <div class="qx-top-row">
        <div class="qx-animated-logo">GLOBAL FINANCE</div>
        <div class="qx-search-terminal">
          <input class="qx-search-input" placeholder="Search markets, stocks, news..." type="text">
        </div>
        <button class="qx-subscribe-btn">SUBSCRIBE</button>
      </div>

      <!-- NAVIGATION MENU BAR -->
      <div class="qx-menu-bar">
        <a class="qx-menu-item active" href="#">🏠 Home</a>
        <a class="qx-menu-item" href="#">📈 Markets</a>
        <a class="qx-menu-item" href="#">📊 Stocks</a>
        <a class="qx-menu-item" href="#">🪙 Crypto</a>
        <a class="qx-menu-item" href="#">💱 Forex</a>
        <a class="qx-menu-item" href="#">📰 News</a>
        <a class="qx-menu-item" href="#">🛠️ Tools</a>
      </div>

      <!-- LIVE TICKER STRIP COMPONENT -->
      <div class="qx-ticker-strip">
        <div class="qx-blink-area">
          <span style="height:6px; width:6px; background:#fff; border-radius:50%; display:inline-block;"></span>BREAKING LIVE
        </div>

        <div class="qx-ticker-scroll">
          <div class="qx-scroll-inner">
            <span class="ticker-node">NIFTY 50: <span class="node-up">23,550.15 (+0.65% ▲)</span></span>
            <span class="ticker-node">S&P 500: <span class="node-up">$5,480.22 (+0.22% ▲)</span></span>
