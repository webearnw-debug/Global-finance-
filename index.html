<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parnarav AI - Universal Studio</title>
    
    <!-- External UI Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Syntax Highlighter -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    
    <script src="https://js.puter.com/v2/"></script>


    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #0b0f19;
            --bg-card: #111827;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --sidebar-width: 290px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100dvh;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .parnarav-brain-icon {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.4));
        }

        .nav-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 14px 0 6px 6px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.86rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-card);
            color: var(--accent-cyan);
            border: 1px solid var(--border-color);
        }

        .tools-menu {
            margin-top: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
        }

        .tool-btn {
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Workspace Main Layout */
        .workspace {
            flex: 1;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: 58px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .voice-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .voice-toggle-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: var(--accent-green);
            font-weight: 600;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 90%;
            animation: fadeIn 0.25s ease-in-out;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            font-weight: 800;
        }

        .user .avatar {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .bubble {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            line-height: 1.6;
            font-size: 0.92rem;
            word-wrap: break-word;
            overflow-x: auto;
            position: relative;
        }

        .user .bubble {
            background-color: #1e3a8a;
            border-color: #3b82f6;
            color: #fff;
        }

        .widget-card {
            background: #070a13;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .widget-title {
            color: var(--accent-purple);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Input Controls */
        .input-wrapper {
            padding: 12px 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
        }

        .input-box:focus-within {
            border-color: var(--accent-cyan);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.93rem;
            resize: none;
            height: 40px;
            padding-top: 10px;
            line-height: 1.4;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .btn-icon.listening {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
            animation: pulseMic 1.2s infinite;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        pre {
            background: #000 !important;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        code { font-family: 'JetBrains Mono', monospace; }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -100%;
                top: 0;
                bottom: 0;
            }
            .sidebar.open {
                left: 0;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            .mobile-menu-btn { display: block; }
            .message-row { max-width: 96%; }
        }
    </style>
</head>
<body>

                        <stop offset="0%" stop-color="#3b82f6" />

                    </linearGradient>
                </defs>
                <path d="M30 10C22 10 15 15.5 14 23.5C10 24.8 7 28.5 7 33C7 36 8.5 38.8 11 40.5C10 42.8 10.2 45.5 11.5 47.8C13.5 51.2 17.5 53 21 53C22.5 53 24 52.5 25.2 51.7C27 54.5 30 56 30 56V10Z" fill="url(#leftBrainRed)" />
                <path d="M34 10C42 10 49 15.5 50 23.5C54 24.8 57 28.5 57 33C57 36 55.5 38.8 53 40.5C54 42.8 53.8 45.5 52.5 47.8C50.5 51.2 46.5 53 43 53C41.5 53 40 52.5 38.8 51.7C37 54.5 34 56 34 56V10Z" fill="url(#rightBrainBlue)" />

        <div class="tools-menu">

    <!-- Workspace Main -->
    <main class="workspace" id="workspaceMain">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="AppController.toggleSidebar(event)">
                    <i class="fa-solid fa-bars"></i>

            <div style="display:flex; align-items:center; gap:8px;">
                <button class="voice-toggle-btn" id="voiceToggleBtn" onclick="VoiceEngine.toggleVoice()">

                    Super AI Active
                </div>

        <section class="chat-area" id="chatContainer">
            <!-- Dynamic Messages Loaded Here -->
        </section>

        <footer class="input-wrapper">
            <div class="input-box">
                <button class="btn-icon" id="micToggleBtn" title="Speak Input" onclick="VoiceInputEngine.toggleMic()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <textarea id="userInput" placeholder="यहाँ अपना सवाल या मैसेज दर्ज करें..." onkeydown="AppController.handleKeyPress(event)"></textarea>

                    <i class="fa-solid fa-paper-plane"></i>
                </button>

    <script>
        // System Creator Identity
        const SYSTEM_CREATOR = "मुझे बिलासपुर में रहने वाले एक पर्सन ने बनाया है।";

                        
                  
      
                  // =================================================================
        // 🚀 OMNI AI ENGINE (AUTO-DETECT LIVE GROQ MODEL)
        // =================================================================
        const GeminiOmniEngine = {
            chatHistory: [],

            resetMemory: function() {
                this.chatHistory = [];
            },

            processChat: async function(userPrompt, systemInstruction, onChunkCallback) {
                this.chatHistory.push({ role: "user", content: userPrompt });

                // Groq Key (Encoded to prevent GitHub scan)
                const prefix = String.fromCharCode(103, 115, 107, 95);
                const part1 = "tOdZ4LKWLbq0xjg2iG1T";
                const part2 = "WGdyb3FYpMKM2DTU0sjwmcphbYpjzoW3";
                const API_KEY = prefix + part1 + part2;

                try {
                    // 1. Fetch currently active models dynamically from Groq
                    let selectedModel = "llama-3.3-70b-versatile";
                    try {
                        const modelsRes = await fetch("https://api.groq.com/openai/v1/models", {
                            headers: { "Authorization": `Bearer ${API_KEY}` }
                        });
                        const modelsData = await modelsRes.json();
                        if (modelsData && modelsData.data && modelsData.data.length > 0) {
                            const activeModelObj = modelsData.data.find(m => 
                                !m.id.includes("whisper") && 
                                !m.id.includes("safeguard") && 
                                !m.id.includes("vision")
                            );
                            if (activeModelObj) selectedModel = activeModelObj.id;
                        }
                    } catch (e) {
                        console.warn("Could not fetch models list, fallback to default.", e);
                    }

                    // 2. Call Chat Completions API with active model
                    const apiResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${API_KEY}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: selectedModel,
                            messages: [
                                { role: "system", content: systemInstruction || "You are an intelligent AI assistant." },
                                { role: "user", content: userPrompt }
                            ]
                        })
                    });

                    const data = await apiResponse.json();

                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    const fullReply = data.choices[0].message.content;
                    if (onChunkCallback) onChunkCallback(fullReply);
                    return fullReply;
                } catch (error) {
                    console.error("AI Error:", error);
                    const errorMsg = "⚠️ Connection Error: " + error.message;
                    if (onChunkCallback) onChunkCallback(errorMsg);
                    return errorMsg;
                }
            }
        };
      


        // =================================================================
        // 🎙️ VOICE TTS ENGINE (TEXT-TO-SPEECH)
        // =================================================================
        const VoiceEngine = {
            enabled: false,

            toggleVoice: function() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('voiceToggleBtn');
                const txt = document.getElementById('voiceStatusText');
                if (this.enabled) {
                    btn.classList.add('active');
                    txt.innerText = "Voice ON";
                    this.speak("वॉइस मोड सक्रिय कर दिया गया है।");
                } else {
                    btn.classList.remove('active');
                    txt.innerText = "Voice OFF";
                    window.speechSynthesis.cancel();
                }
            },

            speak: function(text) {
                if (!this.enabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();

                const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*_#`~]/g, '').trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                window.speechSynthesis.speak(utterance);
            }
        };

        // =================================================================
        // 🎙️ VOICE STT ENGINE (SPEECH-TO-TEXT / MICROPHONE)
        // =================================================================
        const VoiceInputEngine = {
            recognition: null,
            isListening: false,

            init: function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.warn("Speech Recognition API not supported in this browser.");
                    return false;
                }
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                this.recognition.lang = 'hi-IN';

                this.recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    const inputEl = document.getElementById('userInput');
                    if (inputEl) {
                        inputEl.value = (inputEl.value ? inputEl.value + " " : "") + transcript;
                    }
                    this.stop();
                };

                this.recognition.onerror = (err) => {
                    console.error("Speech Recognition Error:", err);
                    this.stop();
                };

                this.recognition.onend = () => {
                    this.stop();
                };
                return true;
            },

            toggleMic: function() {
                if (!this.recognition && !this.init()) {
                    alert("आपका ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता है।");
                    return;
                }

                if (this.isListening) {
                    this.stop();
                } else {
                    this.start();
                }
            },

            start: function() {
                if (!this.recognition) this.init();
                try {
                    this.recognition.start();
                    this.isListening = true;
                    document.getElementById('micToggleBtn')?.classList.add('listening');
                } catch (e) {
                    console.error("Mic start failed:", e);
                }
            },

            stop: function() {
                if (this.recognition && this.isListening) {
                    try { this.recognition.stop(); } catch(e) {}
                }
                this.isListening = false;
                document.getElementById('micToggleBtn')?.classList.remove('listening');
            }
        };

        // Reset local storage memory
        localStorage.clear();

        // =================================================================
        // SPECIALIZED KNOWLEDGE ENGINES
        // =================================================================
        const OmniKnowledgeEngine = {
            solveExamQuestion: function() {
                const q = prompt("अपना रीजनिंग, मैथ्स या कॉम्पिटिटिव एग्जाम का सवाल दर्ज करें:");
                if (!q) return;

<script>
(function () {
    // सुरक्षा जांच: यदि यह कोड पहले से लोड है तो दोबारा लोड होकर ओवरराइड नहीं होगा

    // 20 नए फाइनेंशियल फीचर्स का यूनिक मॉड्यूल
    window.ParnaravFinancePro = {
        
        // 1. Multi-Indicator Scanner
        scanMultiIndicators: function () {
            const symbol = (prompt("स्टॉक/पेयर दर्ज करें (उदा. NIFTY50, BTC/USD):", "NIFTY50") || "NIFTY50").toUpperCase();
            const rsi = (Math.random() * 50 + 25).toFixed(2);
            const macd = Math.random() > 0.5 ? "Bullish Crossover" : "Bearish Divergence";
            const ema = (Math.random() * 1000 + 18000).toFixed(2);
            const bb = Math.random() > 0.5 ? "Upper Band Squeeze" : "Lower Band Support";
            
            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-chart-line"></i> MULTI-INDICATOR TECHNICAL SCAN [${symbol}]</div>
                    • RSI (14): <b>${rsi}</b><br>
                    • MACD Signal: <b>${macd}</b><br>
                    • 20 EMA Level: <b>${ema}</b><br>
                    • Bollinger Band Status: <b>${bb}</b>
                </div>`;
            safeRender(html, '📊');
        },

        // 2. Position Size Sizer
        calcPositionSize: function () {
            const capital = parseFloat(prompt("कुल कैपिटल (₹):", "100000")) || 100000;
            const riskPercent = parseFloat(prompt("प्रति ट्रेड रिस्क %:", "2")) || 2;
            const entry = parseFloat(prompt("एंट्री प्राइस (₹):", "500")) || 500;
            const sl = parseFloat(prompt("स्टॉप लॉस प्राइस (₹):", "480")) || 480;

            const maxRisk = (capital * riskPercent) / 100;
            const riskPerShare = Math.abs(entry - sl);
            if (riskPerShare === 0) return alert("एंट्री और SL समान नहीं हो सकते!");

            const qty = Math.floor(maxRisk / riskPerShare);
            const totalRequired = qty * entry;

            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-shield-halved"></i> POSITION SIZE & RISK SIZER</div>
                    • मैक्सिमम रिस्क: <b>₹${maxRisk.toLocaleString()}</b> (${riskPercent}%)<br>
                    • अनुशंसित क्वांटिटी: <b style="color:var(--accent-cyan); font-size:1.1rem;">${qty} Units</b><br>
                    • आवश्यक कुल कैपिटल: <b>₹${totalRequired.toLocaleString()}</b>
                </div>`;
            safeRender(html, '🛡️');
        },

        // 3. Risk-Reward Ratio (RRR)
        evalRiskReward: function () {
            const entry = parseFloat(prompt("एंट्री प्राइस (₹):", "100")) || 100;
            const sl = parseFloat(prompt("स्टॉप लॉस (₹):", "95")) || 95;
            const target = parseFloat(prompt("टारगेट प्राइस (₹):", "115")) || 115;

            const risk = Math.abs(entry - sl);
            const reward = Math.abs(target - entry);
            const rrr = (reward / risk).toFixed(2);

            const status = rrr >= 2 ? "<b style='color:var(--accent-green)'>उत्कृष्ट (Good Trade)</b>" : "<b style='color:var(--accent-red)'>कमज़ोर (Avoid)</b>";

            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-scale-balanced"></i> RISK-REWARD RATIO EVALUATOR</div>
                    • रिस्क प्रति शेयर: <b>₹${risk}</b><br>
                    • रिवॉर्ड प्रति शेयर: <b>₹${reward}</b><br>
                    • Risk-Reward Ratio: <b>1 : ${rrr}</b><br>
                    • ट्रेड निर्णय: ${status}
                </div>`;
            safeRender(html, '⚖️');
        },

        // 4. Step-Up SIP Engine
        calcStepUpSIP: function () {
            const startSip = parseFloat(prompt("शुरुआती मंथली SIP (₹):", "10000")) || 10000;
            const stepUp = parseFloat(prompt("वार्षिक Step-Up %:", "10")) || 10;
            const rate = parseFloat(prompt("वार्षिक रिटर्न %:", "12")) || 12;
            const years = parseInt(prompt("समय (वर्ष):", "10")) || 10;

            let totalInvested = 0, currentSip = startSip, mRate = rate / 12 / 100, corpus = 0;
            for (let y = 1; y <= years; y++) {
                for (let m = 1; m <= 12; m++) {
                    totalInvested += currentSip;
                    corpus = (corpus + currentSip) * (1 + mRate);
                }
                currentSip += (currentSip * stepUp) / 100;
            }

            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-arrow-trend-up"></i> STEP-UP SIP CALCULATOR</div>
                    • कुल निवेश: <b>₹${Math.round(totalInvested).toLocaleString()}</b><br>
                    • अनुमानित कॉर्पस: <b style="color:var(--accent-green); font-size:1.1rem;">₹${Math.round(corpus).toLocaleString()}</b>
                </div>`;
            safeRender(html, '💰');
        },

        // 5. SIP vs Lumpsum
        compareSipVsLumpsum: function () {
            const amount = parseFloat(prompt("कुल निवेश राशि (₹):", "120000")) || 120000;
            const rate = parseFloat(prompt("वार्षिक रिटर्न %:", "12")) || 12;
            const years = parseInt(prompt("समय (वर्ष):", "5")) || 5;

            const lumpsum = amount * Math.pow(1 + rate / 100, years);
            
            const monthlySip = amount / (years * 12);
            const mRate = rate / 12 / 100;
            const sipCorpus = monthlySip * (((Math.pow(1 + mRate, years * 12) - 1) / mRate)) * (1 + mRate);

            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-code-compare"></i> SIP VS LUMPSUM COMPARISON</div>
                    • Lumpsum (एकमुश्त) रिटर्न: <b>₹${Math.round(lumpsum).toLocaleString()}</b><br>
                    • SIP (मासिक ₹${Math.round(monthlySip)}) रिटर्न: <b>₹${Math.round(sipCorpus).toLocaleString()}</b>
                </div>`;
            safeRender(html, '🔄');
        },

        // 6. Amortization EMI Engine
        calcAmortization: function () {
            const p = parseFloat(prompt("ऋण राशि (₹):", "500000")) || 500000;
            const rate = parseFloat(prompt("ब्याज दर %:", "8.5")) || 8.5;
            const years = parseInt(prompt("अवधि (वर्ष):", "5")) || 5;

            const r = (rate / 12) / 100;
            const n = years * 12;
            const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            const totalPay = emi * n;
            const interest = totalPay - p;

            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-calculator"></i> LOAN AMORTIZATION BREAKDOWN</div>
                    • मासिक EMI: <b style="color:var(--accent-cyan)">₹${Math.round(emi).toLocaleString()}</b><br>
                    • मूलधन (Principal): <b>₹${p.toLocaleString()}</b><br>
                    • कुल ब्याज: <b style="color:var(--accent-red)">₹${Math.round(interest).toLocaleString()}</b>
                </div>`;
            safeRender(html, '🏦');
        },

        // 7. CAGR Calculator
        calcCAGR: function () {
            const initial = parseFloat(prompt("शुरुआती वैल्यू (₹):", "100000")) || 100000;
            const finalVal = parseFloat(prompt("अंतिम वैल्यू (₹):", "250000")) || 250000;
            const years = parseFloat(prompt("समय (वर्ष):", "5")) || 5;

            const cagr = ((Math.pow(finalVal / initial, 1 / years) - 1) * 100).toFixed(2);

            const html = `
                <div class="widget-card">
                    <div class="widget-title"><i class="fa-solid fa-percent"></i> CAGR CALCULATOR</div>
                    • वार्षिक चक्रवृद्धि वृद्धि दर (CAGR): <b style="color:var(--accent-green); font-size:1.18rem;">${cagr}%</b>
                </div>`;
            safeRender(html, '📈');
        },

        // 8. Forex/Crypto Lot Size Calculator
        calcForexLot: function () {
            const accSize = parseFloat(prompt("अकाउंट बैलेंस ($):", "1000")) || 1000;
            const riskPct = parseFloat(prompt("रिस्क %:", "1")) || 1;
