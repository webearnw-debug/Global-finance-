<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance & Pranava AI</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #06090e;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background-color: #0b0e14;
            border-bottom: 1px solid #161f2e;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
        }

        .logo i { color: #22c55e; font-size: 22px; }

        .desktop-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .desktop-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }

        .desktop-links a:hover, .desktop-links a.active { color: #22c55e; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .search-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
        }

        .search-btn:hover { color: #ffffff; }

        /* Pranava AI Header Button */
        .ai-top-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.15);
        }

        .menu-toggle-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Container Layout */
        .app-container {
            display: flex;
            position: relative;
            min-height: calc(100vh - 64px);
        }

        /* Drawer Side Menu */
        .menu-drawer {
            width: 320px;
            background-color: #0b0e14;
            border-right: 1px solid #161f2e;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: margin-left 0.3s ease;
            z-index: 999;
        }

        .menu-drawer.closed { margin-left: -320px; }

        .drawer-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drawer-list li a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: #d1d5db;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .drawer-list li a:hover, .drawer-list li.active a {
            background-color: #121824;
            color: #22c55e;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .item-left i { font-size: 18px; width: 22px; text-align: center; }

        .icon-home { color: #22c55e; }
        .icon-markets { color: #3b82f6; }
        .icon-trading { color: #f97316; }
        .icon-investments { color: #a855f7; }
        .icon-loans { color: #eab308; }
        .icon-earnings { color: #10b981; }

        .arrow-icon { font-size: 12px; color: #4b5563; }

        /* Pranava AI Bottom Card */
        .ai-banner-card {
            background-color: #111622;
            border: 1px solid #1a2e26;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-top: auto;
        }

        .ai-banner-card:hover {
            border-color: #22c55e;
            background-color: #131d2b;
        }

        .ai-banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .robot-icon-box {
            width: 40px;
            height: 40px;
            background-color: rgba(34, 197, 94, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #22c55e;
            font-size: 20px;
        }

        .ai-banner-text h4 { font-size: 14px; font-weight: 600; color: #ffffff; }
        .ai-banner-text p { font-size: 11px; color: #6b7280; margin-top: 2px; }

        /* Dashboard View Screen */
        .main-dashboard { flex: 1; padding: 24px; }

        .content-card {
            background-color: #0d1117;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 24px;
            min-height: 450px;
        }

        .content-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .content-subtitle { color: #8b949e; font-size: 14px; margin-bottom: 24px; }

        /* Interactive Section Mock Components */
        .data-panel {
            background: #111622;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 16px;
            margin-top: 15px;
        }

        .action-btn {
            background: #22c55e;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        /* Search Popup Modal */
        .search-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
        }

        .search-modal.open { display: flex; }

        .search-box-container {
            width: 90%;
            max-width: 600px;
            background-color: #0d1117;
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 20px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 12px 16px;
            border-radius: 8px;
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            color: #ffffff;
            width: 100%;
            font-size: 15px;
            outline: none;
        }

        .search-close-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
        }

        .search-results {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #1f293d;
            color: #6b7280;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .desktop-links { display: none; }
            .menu-drawer {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 100%;
            }
            .menu-drawer.closed { margin-left: -100%; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="navbar">
        <a href="#" class="logo">
            <i class="fa-solid fa-chart-line"></i>
            <span>GLOBAL FINANCE</span>
        </a>

        <ul class="desktop-links">
            <li><a class="active" onclick="switchSection('home')">Home</a></li>
            <li><a onclick="switchSection('markets')">Markets</a></li>
            <li><a onclick="switchSection('trading')">Trading</a></li>
            <li><a onclick="switchSection('investments')">Investments</a></li>
            <li><a onclick="switchSection('loans')">Loans</a></li>
            <li><a onclick="switchSection('earnings')">Earnings</a></li>
        </ul>

        <div class="nav-right">
            <button class="search-btn" id="openSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            
            <button class="ai-top-btn" onclick="openPranavaAI()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Pranava AI
            </button>

            <button class="menu-toggle-btn" id="menuToggle">
                <i class="fa-solid fa-xmark" id="toggleIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main Body App Structure -->
    <div class="app-container">

        <!-- Drawer Sidebar Menu -->
        <div class="menu-drawer" id="menuDrawer">
            <ul class="drawer-list">
                <li class="nav-item active" data-section="home">
                    <a onclick="switchSection('home')">
                        <div class="item-left"><i class="fa-solid fa-house icon-home"></i> <span>Home</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </li>
                <li class="nav-item" data-section="markets">
                    <a onclick="switchSection('markets')">
                        <div class="item-left"><i class="fa-solid fa-chart-simple icon-markets"></i> <span>Markets</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </li>
                <li class="nav-item" data-section="trading">
                    <a onclick="switchSection('trading')">
                        <div class="item-left"><i class="fa-solid fa-money-bill-transfer icon-trading"></i> <span>Trading</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </li>
                <li class="nav-item" data-section="investments">
                    <a onclick="switchSection('investments')">
                        <div class="item-left"><i class="fa-solid fa-chart-pie icon-investments"></i> <span>Investments</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </li>
                <li class="nav-item" data-section="loans">
                    <a onclick="switchSection('loans')">
                        <div class="item-left"><i class="fa-solid fa-building-columns icon-loans"></i> <span>Loans</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </li>
                <li class="nav-item" data-section="earnings">
                    <a onclick="switchSection('earnings')">
                        <div class="item-left"><i class="fa-solid fa-wallet icon-earnings"></i> <span>Earnings</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </li>
            </ul>

            <!-- Pranava AI Card -->
            <div class="ai-banner-card" onclick="openPranavaAI()">
                <div class="ai-banner-left">
                    <div class="robot-icon-box">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div class="ai-banner-text">
                        <h4>Pranava AI</h4>
                        <p>Your smart financial companion</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </div>
        </div>

        <!-- Main Display Container -->
        <main class="main-dashboard">
            <div class="content-card" id="contentDisplay">
                <!-- Content gets dynamically loaded via JS when clicking menu options -->
            </div>
        </main>
    </div>

    <!-- Search Overlay Box -->
    <div class="search-modal" id="searchModal">
        <div class="search-box-container">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass" style="color:#8b949e;"></i>
                <input type="text" id="searchInput" placeholder="Search Markets, Trading, Loans..." autocomplete="off">
                <button class="search-close-btn" id="closeSearchBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="search-results" id="searchResults">
                🔍 Type above to search...
            </div>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuDrawer = document.getElementById('menuDrawer');
        const toggleIcon = document.getElementById('toggleIcon');
        const contentDisplay = document.getElementById('contentDisplay');

        const searchModal = document.getElementById('searchModal');
        const openSearchBtn = document.getElementById('openSearchBtn');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        menuToggle.addEventListener('click', () => {
            menuDrawer.classList.toggle('closed');
            toggleIcon.className = menuDrawer.classList.contains('closed') ? 'fa-solid fa-bars' : 'fa-solid fa-xmark';
        });

        // Menu Section Switcher Logic
        function switchSection(section) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.section === section);
            });

            // What displays when a user clicks each button:
            if (section === 'home') {
                contentDisplay.innerHTML = `
                    <div class="content-title"><i class="fa-solid fa-house icon-home"></i> Home Dashboard</div>
                    <div class="content-subtitle">स्वागत है! यहाँ आपके पर्सनल फाइनेंस और मार्केट का मुख्य ओवरव्यू दिखेगा।</div>
                    <div class="data-panel">📈 Live Nifty 50: <span style="color:#22c55e;">25,120.40 (+0.85%)</span></div>
                `;
            } else if (section === 'markets') {
                contentDisplay.innerHTML = `
                    <div class="content-title"><i class="fa-solid fa-chart-simple icon-markets"></i> Live Markets</div>
                    <div class="content-subtitle">शेयर मार्केट, गोल्ड और क्रिप्टो करेंसी के ताज़ा रेट्स।</div>
                    <div class="data-panel">📊 Sensex: 82,100 | USD/INR: 83.90 | Gold: ₹73,200</div>
                `;
            } else if (section === 'trading') {
                contentDisplay.innerHTML = `
                    <div class="content-title"><i class="fa-solid fa-money-bill-transfer icon-trading"></i> Trading Terminal</div>
                    <div class="content-subtitle">यहाँ से आप शेयर्स खरीद या बेच सकते हैं।</div>
                    <div class="data-panel">
                        <button class="action-btn">Buy Stock</button>
                        <button class="action-btn" style="background:#ef4444; color:#fff;">Sell Stock</button>
                    </div>
                `;
            } else if (section === 'investments') {
                contentDisplay.innerHTML = `
                    <div class="content-title"><i class="fa-solid fa-chart-pie icon-investments"></i> Investments</div>
                    <div class="content-subtitle">म्यूचुअल फंड्स (SIP) और पोर्टफोलियो मैनेजमेंट।</div>
                    <div class="data-panel">💡 Active SIPs: 3 Funds Running | Expected Returns: 15%</div>
                `;
            } else if (section === 'loans') {
                contentDisplay.innerHTML = `
                    <div class="content-title"><i class="fa-solid fa-building-columns icon-loans"></i> Loans & EMI</div>
                    <div class="content-subtitle">पर्सनल लोन, होम लोन और EMI कैलकुलेटर।</div>
                    <div class="data-panel">🏦 Home Loan Interest Rates starting from 8.40% p.a.</div>
                `;
            } else if (section === 'earnings') {
                contentDisplay.innerHTML = `
                    <div class="content-title"><i class="fa-solid fa-wallet icon-earnings"></i> Earnings & Passive Income</div>
                    <div class="content-subtitle">डिविडेंड्स और पैसिव इनकम की विस्तृत जानकारी।</div>
                    <div class="data-panel">💵 Total Dividend Received: ₹12,450</div>
                `;
            }

            if (window.innerWidth <= 768) {
                menuDrawer.classList.add('closed');
                toggleIcon.className = 'fa-solid fa-bars';
            }
        }

        // Initialize Home View
        switchSection('home');

        // Search Handlers
        openSearchBtn.addEventListener('click', () => {
            searchModal.classList.add('open');
            searchInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => {
            searchModal.classList.remove('open');
        });

        searchInput.addEventListener('keyup', (e) => {
            const query = e.target.value.trim();
            if (query.length === 0) {
                searchResults.innerHTML = "🔍 Type above to search...";
            } else {
                searchResults.innerHTML = `⚠️ No results found for "<strong>${query}</strong>"`;
            }
        });

        // Pranava AI Launch Trigger
        function openPranavaAI() {
            contentDisplay.innerHTML = `
                <div class="content-title"><i class="fa-solid fa-wand-magic-sparkles" style="color:#22c55e;"></i> Pranava AI Online</div>
                <div class="content-subtitle">आपका 4,000 लाइन वाला प्रणावा एआई कोड यहाँ चालू होगा।</div>
            `;
        }
    </script>
</body>
</html>
