<style>
/* =========================
   GLOBAL FINANCE VARIABLES
========================= */

.gf-premium-header{
  --gf-white:#ffffff;
  --gf-soft:#f7f8fa;
  --gf-soft2:#f1f3f6;
  --gf-text:#17202b;
  --gf-text2:#4f5b68;
  --gf-muted:#7b8794;
  --gf-border:#e5e8ec;
  --gf-blue:#173b67;
  --gf-blue2:#24588f;
  --gf-gold:#b38a3c;
  --gf-shadow:0 12px 35px rgba(20,35,55,.10);

  width:100%;
  position:relative;
  z-index:99999;
  background:var(--gf-white);
  color:var(--gf-text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

/* =========================
   TOP BRAND BAR
========================= */

.gf-topbar{
  width:100%;
  border-bottom:1px solid var(--gf-border);
  background:#ffffff;
}

.gf-topbar-inner{
  width:min(1440px,94%);
  min-height:72px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

/* =========================
   BRAND
========================= */

.gf-brand{
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  text-decoration:none;
}

.gf-logo{
  width:45px;
  height:45px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #173b67,
      #285f95
    );

  color:#ffffff;

  font-size:15px;
  font-weight:900;
  letter-spacing:-1px;

  box-shadow:
    0 7px 18px rgba(23,59,103,.16);
}

.gf-brand-text{
  line-height:1.05;
}

.gf-brand-title{
  color:#17202b;
  font-size:16px;
  font-weight:800;
  letter-spacing:2px;
}

.gf-brand-subtitle{
  margin-top:5px;

  color:var(--gf-gold);

  font-size:8px;
  font-weight:700;
  letter-spacing:2.5px;
}

/* =========================
   TOP RIGHT
========================= */

.gf-top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.gf-small-button{
  min-height:38px;
  padding:0 13px;

  border:1px solid var(--gf-border);
  border-radius:9px;

  background:#ffffff;
  color:var(--gf-text2);

  cursor:pointer;

  font-size:11px;
  font-weight:700;

  transition:
    background .2s ease,
    border .2s ease,
    color .2s ease,
    transform .2s ease;
}

.gf-small-button:hover{
  background:var(--gf-soft);
  border-color:#cfd5dc;
  color:var(--gf-blue);
  transform:translateY(-1px);
}

.gf-subscribe{
  min-height:38px;
  padding:0 16px;

  border:0;
  border-radius:9px;

  background:var(--gf-blue);
  color:#ffffff;

  cursor:pointer;

  font-size:10px;
  font-weight:800;
  letter-spacing:.7px;

  transition:.2s ease;
}

.gf-subscribe:hover{
  background:var(--gf-blue2);
  transform:translateY(-1px);
}

/* =========================
   MAIN NAVIGATION
========================= */

.gf-navigation{
  width:100%;
  background:#ffffff;
  border-bottom:1px solid var(--gf-border);
}

.gf-navigation-inner{
  width:min(1440px,94%);
  min-height:58px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   NAV ITEM
========================= */

.gf-nav-list{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;

  list-style:none;
  margin:0;
  padding:0;
}

.gf-nav-item{
  position:relative;
}

.gf-nav-button{
  min-height:42px;

  padding:0 18px;

  border:1px solid transparent;
  border-radius:9px;

  background:transparent;

  color:#34404d;

  cursor:pointer;

  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;

  transition:
    background .2s ease,
    color .2s ease,
    border .2s ease;
}

.gf-nav-button:hover,
.gf-nav-item.gf-active .gf-nav-button{
  background:#f5f7f9;
  border-color:#e5e8ec;
  color:var(--gf-blue);
}

.gf-arrow{
  display:inline-block;

  margin-left:6px;

  color:#7b8794;

  font-size:8px;

  transition:transform .2s ease;
}

.gf-nav-item.gf-active .gf-arrow{
  transform:rotate(180deg);
}

/* =========================
   DROPDOWN
========================= */

.gf-dropdown{
  position:absolute;

  top:calc(100% + 8px);
  left:50%;

  width:270px;

  padding:8px;

  transform:
    translateX(-50%)
    translateY(-6px);

  background:#ffffff;

  border:1px solid var(--gf-border);

  border-radius:13px;

  box-shadow:
    0 18px 45px rgba(20,35,55,.13);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease;
}

.gf-nav-item.gf-active .gf-dropdown{
  opacity:1;
  visibility:visible;
  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}

/* little top pointer */

.gf-dropdown::before{
  content:"";

  position:absolute;

  top:-6px;
  left:50%;

  width:10px;
  height:10px;

  background:#ffffff;

  border-left:1px solid var(--gf-border);
  border-top:1px solid var(--gf-border);

  transform:
    translateX(-50%)
    rotate(45deg);
}

/* =========================
   DROPDOWN OPTION
========================= */

.gf-option{

}

.gf-option:hover{

.gf-option-description{

<script>

/* =========================
   DESKTOP DROPDOWN
========================= */

function gfToggleMenu(button){

  const current =
    button.closest(".gf-nav-item");

  document
    .querySelectorAll(".gf-nav-item")
    .forEach(function(item){

      if(item !== current){

        item.classList.remove("gf-active");

      }

    });

  current.classList.toggle("gf-active");

}


/* =========================
   CLOSE WHEN CLICK OUTSIDE
========================= */

document.addEventListener(
  "click",
  function(event){

    if(
      !event.target.closest(".gf-nav-item") &&
      !event.target.closest(".gf-mobile-menu-button")
    ){

      document
        .querySelectorAll(".gf-nav-item")
        .forEach(function(item){

          item.classList.remove("gf-active");

        });

    }

  }
);


/* =========================
   OPTION CLICK
========================= */

function gfAction(name){

  document
    .querySelectorAll(".gf-nav-item")
    .forEach(function(item){

      item.classList.remove("gf-active");

    });

  document
    .getElementById("gfMobilePanel")
    .classList.remove("gf-show");

  /*
    अभी testing के लिए.
    बाद में यहाँ actual page/route लगाया जाएगा.
  */

  console.log(
    "Global Finance:",
    name
  );

  alert(
    "Opening: " + name
  );

}


/* =========================
   HOME
========================= */

function gfGoHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   SUBSCRIBE
========================= */

function gfSubscribe(){

  alert(
    "Subscribe panel will open here."
  );

}


/* =========================
   SEARCH
========================= */

function gfOpenSearch(){

  document
    .getElementById("gfSearchPanel")
    .classList.add("gf-show");

  setTimeout(function(){

    document
      .getElementById("gfSearchInput")
      .focus();

  },100);

}

function gfCloseSearch(){

  document
    .getElementById("gfSearchPanel")
    .classList.remove("gf-show");

}


/* =========================
   MOBILE MENU
========================= */

function gfMobileToggle(){

  document
    .getElementById("gfMobilePanel")
    .classList.toggle("gf-show");

}


/* =========================
   MOBILE DROPDOWNS
========================= */

function gfMobileSection(button){

  const section =
    button.closest(".gf-mobile-section");

  document
    .querySelectorAll(".gf-mobile-section")
    .forEach(function(item){

      if(item !== section){

        item.classList.remove("gf-open");

      }

    });

  section.classList.toggle("gf-open");

}


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      document
        .querySelectorAll(".gf-nav-item")
        .forEach(function(item){

          item.classList.remove("gf-active");

        });

      document
        .getElementById("gfMobilePanel")
        .classList.remove("gf-show");

      gfCloseSearch();

    }

  }
);
