<!-- GLOBAL FINANCE — PREMIUM HEADER ONLY -->
<style>
:root{
  --gf-bg:#07090d;
  --gf-panel:#0d1118;
  --gf-text:#f4f5f7;
  --gf-muted:#8d96a4;
  --gf-gold:#d8b46a;
  --gf-gold2:#f0d28c;
  --gf-line:rgba(255,255,255,.09);
}

.gf-header{
  position:sticky;
  top:0;
  z-index:99999;
  width:100%;
  background:
    linear-gradient(180deg,rgba(8,10,14,.98),rgba(8,10,14,.93));
  border-bottom:1px solid var(--gf-line);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  font-family:Arial,Helvetica,sans-serif;
}

.gf-header-inner{
  width:min(1450px,94%);
  min-height:82px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:28px;
}

/* LOGO */

.gf-brand{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  flex-shrink:0;
}

.gf-logo{
  width:46px;
  height:46px;
  border-radius:13px;
  border:1px solid rgba(216,180,106,.65);
  display:grid;
  place-items:center;
  color:var(--gf-gold2);
  font-size:15px;
  font-weight:900;
  letter-spacing:-1px;
  background:
    radial-gradient(circle at 30% 20%,
    rgba(216,180,106,.16),
    transparent 60%);
  box-shadow:
    inset 0 0 25px rgba(216,180,106,.04),
    0 0 35px rgba(216,180,106,.05);
}

.gf-brand-name{
  line-height:1.05;
}

.gf-brand-name strong{
  display:block;
  color:#f5f5f6;
  font-size:15px;
  letter-spacing:2.3px;
  font-weight:800;
}

.gf-brand-name span{
  display:block;
  color:var(--gf-gold);
  font-size:8px;
  letter-spacing:3px;
  margin-top:5px;
}

/* NAV */

.gf-nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}

.gf-nav-item{
  position:relative;
}

.gf-nav-btn{
  border:0;
  outline:none;
  background:transparent;
  color:#d9dde3;
  padding:13px 15px;
  border-radius:10px;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
  transition:
    background .25s ease,
    color .25s ease,
    transform .25s ease;
}

.gf-nav-btn:hover,
.gf-nav-item.open .gf-nav-btn{
  color:var(--gf-gold2);
  background:rgba(216,180,106,.075);
}

.gf-arrow{
  display:inline-block;
  margin-left:6px;
  font-size:8px;
  transition:transform .25s ease;
}

.gf-nav-item.open .gf-arrow{
  transform:rotate(180deg);
}

/* DROPDOWN */

.gf-dropdown{
  position:absolute;
  top:calc(100% + 13px);
  left:50%;
  width:285px;
  padding:9px;
  transform:
    translateX(-50%)
    translateY(-8px)
    scale(.98);

  background:
    linear-gradient(
      145deg,
      rgba(18,23,31,.99),
      rgba(10,13,18,.99)
    );

  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.035);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;
}

.gf-nav-item.open .gf-dropdown{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:
    translateX(-50%)
    translateY(0)
    scale(1);
}

.gf-dropdown:before{
  content:"";
  position:absolute;
  top:-6px;
  left:50%;
  width:11px;
  height:11px;
  transform:translateX(-50%) rotate(45deg);
  background:#131820;
  border-left:1px solid rgba(255,255,255,.10);
  border-top:1px solid rgba(255,255,255,.10);
}

.gf-option{
  width:100%;
  display:block;
  text-align:left;
  padding:14px 13px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#e8eaed;
  cursor:pointer;
  transition:.2s ease;
}

.gf-option:hover{
  background:rgba(216,180,106,.085);
  transform:translateX(2px);
}

.gf-option-title{
  display:block;
  font-size:12px;
  font-weight:800;
  letter-spacing:.2px;
}

.gf-option-desc{
  display:block;
  color:#747e8c;
  font-size:9px;
  margin-top:5px;
  line-height:1.4;
}

/* RIGHT SIDE */

.gf-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:8px;
}

.gf-search{
  width:40px;
  height:40px;
  border-radius:10px;
  border:1px solid var(--gf-line);
  background:#0d1118;
  color:#e8eaed;
  cursor:pointer;
  font-size:19px;
  display:grid;
  place-items:center;
  transition:.25s;
}

.gf-search:hover{
  color:var(--gf-gold2);
  border-color:rgba(216,180,106,.4);
}

.gf-subscribe{
  height:40px;
  padding:0 17px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  background:
    linear-gradient(
      135deg,
      #c89f52,
      #efd087
    );
  color:#171208;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:
    0 8px 25px rgba(216,180,106,.12);
  transition:.25s;
}

.gf-subscribe:hover{
  transform:translateY(-1px);
  box-shadow:
    0 12px 30px rgba(216,180,106,.2);
}

/* MOBILE */

.gf-mobile{
  display:none;
}

@media(max-width:1050px){

  .gf-nav{
    display:none;
  }

  .gf-mobile{
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--gf-line);
    background:#0d1118;
    color:#fff;
    cursor:pointer;
    font-size:18px;
  }

  .gf-header-inner{
    justify-content:space-between;
  }

  .gf-actions{
    margin-left:auto;
  }
}

@media(max-width:600px){

  .gf-header-inner{
    min-height:70px;
    width:94%;
    gap:10px;
  }

  .gf-logo{
    width:40px;
    height:40px;
    border-radius:11px;
  }

  .gf-brand-name strong{
    font-size:11px;
    letter-spacing:1.7px;
  }

  .gf-brand-name span{
    font-size:6px;
    letter-spacing:2px;
  }

  .gf-subscribe{
    display:none;
  }
}

/* MOBILE MENU PANEL */

.gf-mobile-panel{
  position:fixed;
  top:71px;
  left:3%;
  right:3%;
  z-index:99998;
  padding:12px;

  background:
    linear-gradient(
      145deg,
      rgba(18,23,31,.99),
      rgba(8,11,16,.99)
    );

  border:1px solid var(--gf-line);
  border-radius:17px;

  box-shadow:0 30px 80px rgba(0,0,0,.55);

  display:none;
}

.gf-mobile-panel.show{
  display:block;
}

.gf-mobile-main{
  width:100%;
  border:1px solid var(--gf-line);
  background:#0d1118;
  color:#e9ebef;
  padding:14px;
  border-radius:10px;
  margin-bottom:7px;
  text-align:left;
  font-size:11px;
  font-weight:800;
}
</style>


<header class="gf-header">

  <div class="gf-header-inner">

    <!-- BRAND -->
    <div class="gf-brand" onclick="gfHome()">

      <div class="gf-logo">GF</div>

      <div class="gf-brand-name">
        <strong>GLOBAL FINANCE</strong>
        <span>GLOBAL FINANCIAL INTELLIGENCE</span>
      </div>

    </div>


    <!-- DESKTOP NAV -->
    <nav class="gf-nav">

      <!-- MARKETS -->
      <div class="gf-nav-item">

        <button class="gf-nav-btn" onclick="gfToggle(this)">
          MARKETS
          <span class="gf-arrow">▼</span>
        </button>

        <div class="gf-dropdown">

          <button class="gf-option"
                  onclick="gfOpen('Global Markets')">

            <span class="gf-option-title">
              Global Markets
            </span>

            <span class="gf-option-desc">

            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Stocks & Indices')">

            <span class="gf-option-title">
              Stocks & Indices
            </span>

            <span class="gf-option-desc">
              Equities and benchmark indices
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Forex & Crypto')">

            <span class="gf-option-title">
              Forex & Crypto
            </span>

            <span class="gf-option-desc">
              Currency and digital asset markets
            </span>

          </button>

        </div>

      </div>


      <!-- TRADING -->
      <div class="gf-nav-item">

        <button class="gf-nav-btn" onclick="gfToggle(this)">
          TRADING
          <span class="gf-arrow">▼</span>
        </button>

        <div class="gf-dropdown">

          <button class="gf-option"
                  onclick="gfOpen('Trading Ideas')">

            <span class="gf-option-title">
              Trading Ideas
            </span>

            <span class="gf-option-desc">
              Market setups and ideas
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Technical Analysis')">

            <span class="gf-option-title">
              Technical Analysis
            </span>

            <span class="gf-option-desc">
              Charts and indicators
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Trading Strategies')">

            <span class="gf-option-title">
              Trading Strategies
            </span>

            <span class="gf-option-desc">
              Strategy education
            </span>

          </button>

        </div>

      </div>


      <!-- INVESTING -->
      <div class="gf-nav-item">

        <button class="gf-nav-btn" onclick="gfToggle(this)">
          INVESTING
          <span class="gf-arrow">▼</span>
        </button>

        <div class="gf-dropdown">

          <button class="gf-option"
                  onclick="gfOpen('Investment Ideas')">

            <span class="gf-option-title">
              Investment Ideas
            </span>

            <span class="gf-option-desc">
              Long-term investment concepts
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Portfolio')">

            <span class="gf-option-title">
              Portfolio
            </span>

            <span class="gf-option-desc">
              Portfolio and allocation
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Wealth Management')">

            <span class="gf-option-title">
              Wealth Management
            </span>

            <span class="gf-option-desc">
              Long-term wealth principles
            </span>

          </button>

        </div>

      </div>


      <!-- INTELLIGENCE -->
      <div class="gf-nav-item">

        <button class="gf-nav-btn" onclick="gfToggle(this)">
          INTELLIGENCE
          <span class="gf-arrow">▼</span>
        </button>

        <div class="gf-dropdown">

          <button class="gf-option"
                  onclick="gfOpen('Market Insights')">

            <span class="gf-option-title">
              Market Insights
            </span>

            <span class="gf-option-desc">
              Financial market perspectives
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Economic Outlook')">

            <span class="gf-option-title">
              Economic Outlook
            </span>

            <span class="gf-option-desc">
              Macro and economic themes
            </span>

          </button>

          <button class="gf-option"
                  onclick="gfOpen('Research & Reports')">

            <span class="gf-option-title">
              Research & Reports
            </span>

            <span class="gf-option-desc">
              Research and financial reports
            </span>

          </button>

        </div>

      </div>

    </nav>


    <!-- ACTIONS -->
    <div class="gf-actions">

      <button class="gf-search"
              onclick="gfSearch()"
              aria-label="Search">
        ⌕
      </button>

      <button class="gf-subscribe"
              onclick="gfSubscribe()">
        SUBSCRIBE
      </button>

      <button class="gf-mobile"
              onclick="gfMobile()">
        ☰
      </button>

    </div>

  </div>

</header>


<!-- MOBILE PANEL -->

<div class="gf-mobile-panel" id="gfMobilePanel">

  <button class="gf-mobile-main"
          onclick="gfOpen('Markets')">
    MARKETS
  </button>

  <button class="gf-mobile-main"
          onclick="gfOpen('Trading')">
    TRADING
  </button>

  <button class="gf-mobile-main"
          onclick="gfOpen('Investing')">
    INVESTING
  </button>

  <button class="gf-mobile-main"
          onclick="gfOpen('Intelligence')">
    INTELLIGENCE
  </button>

</div>


<script>

function gfToggle(button){

  const current=button.closest(".gf-nav-item");

  document
    .querySelectorAll(".gf-nav-item")
    .forEach(item=>{
      if(item!==current){
        item.classList.remove("open");
      }
    });

  current.classList.toggle("open");
}


document.addEventListener("click",function(e){

  if(!e.target.closest(".gf-nav-item")){

    document
      .querySelectorAll(".gf-nav-item")
      .forEach(item=>{
        item.classList.remove("open");
      });

  }

});


function gfOpen(name){

  document
    .querySelectorAll(".gf-nav-item")
    .forEach(item=>{
      item.classList.remove("open");
    });

  document
    .getElementById("gfMobilePanel")
    .classList.remove("show");

  /*
    यहाँ अभी demo action है।
    बाद में इसी function में तुम्हारे
    actual pages/routes connect होंगे।
  */

  console.log("Opening:",name);

  alert(name + " selected");
}


function gfSearch(){

  alert("Global Finance Search");

}


function gfSubscribe(){

  alert("Subscribe panel");

}


function gfHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function gfMobile(){

  document
    .getElementById("gfMobilePanel")
    .classList.toggle("show");

}


document.addEventListener("keydown",function(e){

  if(e.key==="Escape"){

    document
      .querySelectorAll(".gf-nav-item")
      .forEach(item=>{
        item.classList.remove("open");
      });

    document
      .getElementById("gfMobilePanel")
      .classList.remove("show");

  }

});

</script>
