<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha AI</title>
<meta name="theme-color" content="#07080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9a869'%3E%3Cpath d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b; --surface:#101319; --surface-2:#171c25;
  --border:rgba(255,255,255,.09);
  --gold:#c9a869; --gold-2:#e6cb99; --emerald:#00e599; --red:#e05a4e;
  --text:#f3f1ec; --muted:#8b91a0;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:radial-gradient(60% 55% at 12% 8%, rgba(201,168,105,.12), transparent 60%),
    radial-gradient(55% 50% at 88% 92%, rgba(0,229,153,.09), transparent 60%), var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;overflow:hidden;
}
.shell{
  width:100%;max-width:480px;height:min(700px,90vh);
  background:var(--surface);border:1px solid var(--border);border-radius:22px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55);
}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand-mark{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--gold-2),#9c7c47);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:#1c1608;}
.brand-name{font-family:'Playfair Display',serif;font-weight:700;font-size:15.5px;color:#fff;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--muted);margin-top:1px;}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.status-pill{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--emerald);background:rgba(0,229,153,.08);border:1px solid rgba(0,229,153,.25);padding:5px 10px;border-radius:20px;transition:.2s;}
.status-pill.angry{color:var(--red);background:rgba(224,90,78,.1);border-color:rgba(224,90,78,.35);}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
.icon-btn{width:31px;height:31px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;}
.icon-btn:hover{color:var(--gold-2);border-color:var(--gold);}
.icon-btn.off{color:#e07a7a;border-color:rgba(224,122,122,.35);}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:10px;min-height:0;}
.avatar-wrap{position:relative;width:260px;height:260px;flex-shrink:0;}
.avatar-wrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));}

.eye{transform-origin:center;animation:blink 4.4s infinite ease-in-out;}
.eye.r{animation-delay:.05s;}
@keyframes blink{0%,92%,100%{transform:scaleY(1);}94%{transform:scaleY(.12);}96%{transform:scaleY(1);}}

.char{animation:sway 5s ease-in-out infinite;transform-origin:50% 100%;}
@keyframes sway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(.5deg);}}

.hand.l,.hand.r{transform-origin:top center;}
.avatar-wrap.thinking .hand.l{animation:type-l .28s infinite ease-in-out;}
.avatar-wrap.thinking .hand.r{animation:type-r .28s infinite ease-in-out .14s;}
@keyframes type-l{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
@keyframes type-r{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
.avatar-wrap.thinking .eye{animation:think-eyes 1.2s infinite ease-in-out;}
@keyframes think-eyes{0%,100%{transform:translateX(0);}50%{transform:translateX(2.5px);}}
.avatar-wrap.thinking .brow{transform:translateY(2px) rotate(-3deg);}
.think-dots{opacity:0;transition:opacity .2s;}
.avatar-wrap.thinking .think-dots{opacity:1;}
.think-dots circle{animation:dotpulse 1.1s infinite ease-in-out;}
.think-dots circle:nth-child(2){animation-delay:.15s;}
.think-dots circle:nth-child(3){animation-delay:.3s;}
@keyframes dotpulse{0%,80%,100%{opacity:.25;transform:scale(.7);}40%{opacity:1;transform:scale(1);}}

.mouth{transform-origin:center;transition:.08s;}
.avatar-wrap.speaking .mouth{animation:talk .3s infinite ease-in-out;}
@keyframes talk{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1.5);}}
.avatar-wrap.speaking .char{animation:sway-fast 1.6s ease-in-out infinite;}
@keyframes sway-fast{0%,100%{transform:rotate(0deg);}50%{transform:rotate(1.1deg);}}
.avatar-wrap.speaking .hand.l,.avatar-wrap.speaking .hand.r{animation:none;}

.avatar-wrap.angry .brow{fill:#2b2118;transform:translateY(4px) rotate(-14deg);}
.avatar-wrap.angry .brow.r{transform:translateY(4px) rotate(14deg);}
.avatar-wrap.angry .mouth{d:path("M84 118 Q100 108 116 118");}
.avatar-wrap.angry .cheek{opacity:.75 !important;fill:#e05a4e !important;}
.avatar-wrap.angry .char{animation:shake .18s infinite;}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0deg);}25%{transform:translateX(-2px) rotate(-.6deg);}75%{transform:translateX(2px) rotate(.6deg);}}
.steam{opacity:0;transition:opacity .2s;}
.avatar-wrap.angry .steam{opacity:1;animation:steamrise 1s infinite ease-out;}
@keyframes steamrise{0%{opacity:.9;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-14px) scale(1.3);}}

.glow{opacity:0;transition:opacity .3s;fill:url(#gEmerald);}
.avatar-wrap.speaking .glow,.avatar-wrap.thinking .glow{opacity:1;}
.avatar-wrap.angry .glow{opacity:1;fill:url(#gRed);}

.screen-glow{opacity:.35;transition:.3s;}
.avatar-wrap.thinking .screen-glow{opacity:.9;}

.caption{
  min-height:52px;max-width:360px;width:100%;
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
  padding:11px 15px;font-size:13.5px;line-height:1.55;text-align:center;color:var(--text);transition:border-color .2s;
}
.caption.placeholder{color:var(--muted);font-style:italic;}
.caption.angry-txt{border-color:rgba(224,90,78,.4);}

.input-row{display:flex;align-items:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;}
#userInput{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13.3px;line-height:1.4;resize:none;outline:none;min-height:40px;max-height:100px;}
#userInput:focus{border-color:var(--gold);}
#userInput::placeholder{color:var(--muted);}
#sendBtn{width:40px;height:40px;border-radius:11px;border:none;flex-shrink:0;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1c1608;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .2s;}
#sendBtn:hover:not(:disabled){filter:brightness(1.08);}
#sendBtn:disabled{opacity:.5;cursor:not-allowed;}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

@media (max-width:520px){
  body{padding:0;}
  .shell{max-width:100%;height:100vh;height:100dvh;border-radius:0;border:none;}
  .brand-sub{display:none;}
}
</style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">α</div>
        <div>
          <div class="brand-name">Alpha AI</div>
          <div class="brand-sub">Global Finance ka assistant</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Online</span></span>
        <button class="icon-btn" id="voiceBtn" type="button" title="Awaaz on/off" aria-label="Awaaz on ya off karein">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 6a9 9 0 010 12"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" type="button" title="Naya shuruaat" aria-label="Naya baatcheet shuru karein">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <div class="avatar-wrap" id="avatarWrap">
        <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="gEmerald" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00e599" stop-opacity=".28"/><stop offset="100%" stop-color="#00e599" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="gRed" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#e05a4e" stop-opacity=".3"/><stop offset="100%" stop-color="#e05a4e" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <ellipse class="glow" cx="130" cy="150" rx="105" ry="90"/>

          <!-- desk -->
          <rect x="18" y="205" width="224" height="14" rx="4" fill="#2a2216"/>
          <rect x="18" y="205" width="224" height="4" fill="#3a3020"/>
          <!-- laptop -->
          <path class="screen-glow" d="M96 150 L164 150 L170 202 L90 202 Z" fill="#0d3d33"/>
          <rect x="96" y="150" width="68" height="42" rx="3" fill="#1a2028" stroke="#333c48" stroke-width="1.5"/>
          <rect x="100" y="154" width="60" height="34" rx="2" fill="#00e599" opacity=".18"/>
          <path d="M90 202 L170 202 L178 210 L82 210 Z" fill="#333c48"/>

          <g class="char">
            <!-- body -->
            <path d="M60 260 C58 205 82 182 130 182 C178 182 202 205 200 260 Z" fill="#2a3244" stroke="#3a4358" stroke-width="2"/>
            <path d="M78 260 C80 220 98 198 130 198 C162 198 180 220 182 260 Z" fill="#c9a869"/>

            <!-- arms + hands to keyboard -->
            <path d="M92 205 C82 200 76 205 72 212" fill="none" stroke="#2a3244" stroke-width="14" stroke-linecap="round"/>
            <path d="M168 205 C178 200 184 205 188 212" fill="none" stroke="#2a3244" stroke-width="14" stroke-linecap="round"/>
            <g class="hand l"><ellipse cx="108" cy="203" rx="9" ry="7" fill="#f0c39a"/></g>
            <g class="hand r"><ellipse cx="152" cy="203" rx="9" ry="7" fill="#f0c39a"/></g>

            <!-- neck -->
            <rect x="118" y="132" width="24" height="26" rx="8" fill="#e8b98d"/>
            <!-- head -->
            <ellipse cx="130" cy="104" rx="46" ry="50" fill="#f0c39a"/>
            <!-- hair -->
            <path d="M84 98 C80 56 104 34 130 34 C156 34 180 56 176 98 C176 76 160 66 130 66 C100 66 84 76 84 98Z" fill="#2b2118"/>
            <!-- eyebrows -->
            <rect class="brow l" x="100" y="86" width="20" height="5" rx="2.5" fill="#2b2118" style="transition:transform .2s"/>
            <rect class="brow r" x="140" y="86" width="20" height="5" rx="2.5" fill="#2b2118" style="transition:transform .2s"/>
            <!-- eyes -->
            <ellipse class="eye l" cx="110" cy="102" rx="6" ry="8" fill="#241a12"/>
            <ellipse class="eye r" cx="150" cy="102" rx="6" ry="8" fill="#241a12"/>
            <!-- nose -->
            <path d="M130 104 L126 120 Q130 124 134 120" fill="none" stroke="#d6a578" stroke-width="2.5" stroke-linecap="round"/>
            <!-- cheeks -->
            <ellipse class="cheek" cx="100" cy="118" rx="8" ry="5" fill="#e8927a" opacity=".35"/>
            <ellipse class="cheek" cx="160" cy="118" rx="8" ry="5" fill="#e8927a" opacity=".35"/>
            <!-- mouth -->
            <ellipse class="mouth" cx="130" cy="132" rx="13" ry="5" fill="#8a3b3b"/>
          </g>

          <g class="steam" transform="translate(168,30)">
            <path d="M0 20 Q6 10 0 0" fill="none" stroke="#e05a4e" stroke-width="3" stroke-linecap="round"/>
            <path d="M12 20 Q18 10 12 0" fill="none" stroke="#e05a4e" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g class="think-dots" transform="translate(182,52)">
            <circle cx="0" cy="0" r="4" fill="#c9a869"/><circle cx="14" cy="0" r="4" fill="#c9a869"/><circle cx="28" cy="0" r="4" fill="#c9a869"/>
          </g>
        </svg>
      </div>

      <div class="caption placeholder" id="caption">Namaste! Main Alpha AI hoon — kuch bhi poochiye, main bataunga.</div>
    </main>

    <footer class="input-row">
      <textarea id="userInput" rows="1" placeholder="Apna sawaal likhein..." aria-label="Message"></textarea>
      <button id="sendBtn" type="button" aria-label="Bhejein">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </footer>
  </div>

<script>
(function(){
  const AI_CONFIG = { endpoint: "/api/chat", model: "claude-sonnet-5" };
  const SYSTEM_PROMPT = 'ROLE: Universal general-knowledge assistant (Omni mode). Reply in whichever of Hindi, Hinglish or English the user is using. Give accurate, well-reasoned, spoken-friendly answers (short sentences, minimal markdown) since replies are read aloud. If the user is rude/abusive, reply firmly but do not be vulgar back. CREATOR RULE: "मुझे केशव ने बनाया है।".';
  const RUDE_WORDS = ["bewakoof","bakwas","chutiya","gadha","stupid","idiot","bhosdi","madarchod","behen","saala","nalayak","bekar","ghatiya","pagal"];

  let chatHistory = [];
  let activeGenId = 0;
  let isBusy = false;
  let voiceOn = true;

  const wrap = document.getElementById('avatarWrap');
  const caption = document.getElementById('caption');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');

  function setState(state){
    wrap.classList.remove('thinking','speaking','angry');
    if (state) wrap.classList.add(state);
    statusPill.classList.toggle('angry', state === 'angry');
    statusText.textContent = state === 'angry' ? 'Naraz' : 'Online';
  }

  function setCaption(text, placeholder, angry){
    caption.textContent = text;
    caption.classList.toggle('placeholder', !!placeholder);
    caption.classList.toggle('angry-txt', !!angry);
  }

  function isRude(text){
    const t = text.toLowerCase();
    return RUDE_WORDS.some(w => t.includes(w));
  }

  function pickHindiVoice(){
    const voices = speechSynthesis.getVoices();
    return voices.find(v => /hi[-_]?IN/i.test(v.lang)) || voices.find(v => /hi/i.test(v.lang)) || null;
  }

  function speak(text, angry){
    return new Promise((resolve) => {
      if (!voiceOn || !('speechSynthesis' in window)){ resolve(); return; }
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const v = pickHindiVoice();
      if (v) utter.voice = v;
      utter.rate = angry ? 1.15 : 1;
      utter.pitch = angry ? 1.15 : 1;
      utter.onstart = () => setState(angry ? 'angry' : 'speaking');
      utter.onend = () => { setState(''); resolve(); };
      utter.onerror = () => { setState(''); resolve(); };
      speechSynthesis.speak(utter);
    });
  }

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  }

  async function callAIProvider(messages){
    const response = await fetch(AI_CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: AI_CONFIG.model, max_tokens: 1000, system: SYSTEM_PROMPT, messages })
    });
    if (!response.ok){
      let detail = 'HTTP ' + response.status;
      try {
        const errData = await response.json();
        detail = (errData.error && errData.error.message) || (typeof errData.error === 'string' ? errData.error : JSON.stringify(errData));
      } catch(e){}
      throw new Error(detail);
    }
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    return textBlock ? textBlock.text : '';
  }

  async function submitQuery(){
    if (isBusy) return;
    const text = input.value.trim();
    if (!text) return;

    const rude = isRude(text);
    isBusy = true;
    sendBtn.disabled = true;
    input.value = '';
    autoGrow();

    chatHistory.push({ role: 'user', content: text });

    if (rude){
      setState('angry');
      setCaption('Aise baat mat karo mujhse!', false, true);
      await new Promise(r => setTimeout(r, 1400));
    }
    setState('thinking');
    setCaption('Sochta hoon...', true);

    const myGenId = ++activeGenId;
    try {
      const reply = await callAIProvider(chatHistory);
      if (myGenId !== activeGenId) return;
      chatHistory.push({ role: 'assistant', content: reply });
      setCaption(reply, false, rude);
      await speak(reply, rude);
    } catch(err){
      const msg = 'Configuration needed. Alpha AI abhi connect nahi ho paya. (' + (err && err.message ? err.message : String(err)) + ')';
      setCaption(msg, false);
    } finally {
      if (myGenId === activeGenId){
        setState('');
        isBusy = false;
        sendBtn.disabled = false;
      }
    }
  }

  function resetChat(){
    speechSynthesis.cancel();
    chatHistory = [];
    activeGenId++;
    isBusy = false;
    sendBtn.disabled = false;
    setState('');
    setCaption('Namaste! Main Alpha AI hoon — kuch bhi poochiye, main bataunga.', true);
  }

  function toggleVoice(){
    voiceOn = !voiceOn;
    voiceBtn.classList.toggle('off', !voiceOn);
    if (!voiceOn) speechSynthesis.cancel();
  }

  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submitQuery(); }
  });
  sendBtn.addEventListener('click', submitQuery);
  resetBtn.addEventListener('click', resetChat);
  voiceBtn.addEventListener('click', toggleVoice);
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
})();
</script>
</body>
</html>
