<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Global Finance - Live API Connected</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#06090e;color:#f8fafc;font-family:'Inter',system-ui,Arial,sans-serif;overflow-x:hidden}
img{display:block;width:100%}

/* REAL-TIME API TICKER STRIP */
.ticker-wrap{width:100%;height:42px;overflow:hidden;background:#020406;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;position:relative;z-index:2000;display:flex;align-items:center}
.ticker-move{height:100%;width:max-content;display:flex;align-items:center;gap:35px;padding-left:15px;animation:tickerMove 32s linear infinite}
.ticker-move:hover{animation-play-state:paused}

.ticker-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#94a3b8;flex-shrink:0;font-weight:600}
.ticker-title{color:#e2e8f0;font-weight:700}
.ticker-value{color:#fff;font-weight:700;padding:2px 6px;border-radius:4px;transition:all 0.3s ease}
.up{color:#00e676;font-weight:700}
.down{color:#ff5252;font-weight:700}

/* FLASH ANIMATIONS ON LIVE PRICE CHANGE */
.flash-up{background:rgba(0,230,118,0.25)!important;color:#00e676!important;text-shadow:0 0 10px rgba(0,230,118,0.8)}
.flash-down{background:rgba(255,82,82,0.25)!important;color:#ff5252!important;text-shadow:0 0 10px rgba(255,82,82,0.8)}

@keyframes tickerMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* HEADER */
.header{width:100%;height:60px;position:sticky;top:0;z-index:1500;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:rgba(6,9,14,.96);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:16px;font-weight:800;letter-spacing:.5px}
.logo i{color:#00e676;font-size:20px;filter:drop-shadow(0 0 8px rgba(0,230,118,.4))}

/* MENU BUTTON & DROPDOWN */
.menu-area{position:relative}
.menu-button{height:38px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#00e676,#00c853);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s ease;box-shadow:0 0 15px rgba(0,230,118,.3)}
.menu-button:hover{background:#00c853;box-shadow:0 0 20px rgba(0,230,118,.5)}
.menu-button:active{transform:scale(.96)}

.menu-dropdown{position:absolute;top:48px;right:0;width:230px;padding:8px;display:none;flex-direction:column;gap:4px;background:rgba(12,16,24,.98);border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.8);backdrop-filter:blur(20px)}
.menu-dropdown.open{display:flex;animation:dropdownOpen .18s ease-out}
@keyframes dropdownOpen{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.menu-item{width:100%;min-height:42px;border:0;background:transparent;color:#94a3b8;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:600;transition:.2s ease}
.menu-item:hover,.menu-item.active{background:rgba(0,230,118,.12);color:#00e676}
.alpha-ai{margin-top:4px;color:#fff;border:1px solid #00dfd8;background:linear-gradient(135deg,rgba(121,40,202,.25),rgba(0,223,216,.2))}
.alpha-ai:hover,.alpha-ai.active{background:linear-gradient(135deg,#7928ca,#00dfd8);color:#fff}

/* MAIN FULL WIDTH EDGE-TO-EDGE COVERAGE */
main{width:100%;margin:0;padding:0}
.page{display:none;width:100%;margin:0;padding:0}
.page.active{display:block}

.hero-full-card{width:100%;margin:0;padding:0;overflow:hidden;background:#000;position:relative}
.hero-full-card img{width:100%;height:calc(100vh - 102px);min-height:500px;display:block;object-fit:cover;object-position:center;margin:0;padding:0;border:none}

@media(max-width:480px){
.header{padding:0 12px;height:56px}
.logo{font-size:15px}
.menu-button{height:34px;padding:0 12px;font-size:13px}
.hero-full-card img{height:calc(100vh - 98px);min-height:450px}
}
</style>
</head>
<body>

<!-- REAL-TIME LIVE API TICKER TAPE -->
<div class="ticker-wrap">
  <div class="ticker-move" id="tickerContainer">
    <div class="ticker-item"><span class="ticker-title">NIFTY 50</span> <span class="ticker-value up" id="niftyVal">24,834.85</span> <span class="up" id="niftyPct">+0.42%</span></div>
    <div class="ticker-item"><span class="ticker-title">SENSEX</span> <span class="ticker-value up" id="sensexVal">81,157.73</span> <span class="up" id="sensexPct">+0.45%</span></div>
    <div class="ticker-item"><span class="ticker-title">RELIANCE</span> <span class="ticker-value up" id="relVal">2,980.50</span> <span class="up" id="relPct">+0.65%</span></div>
    <div class="ticker-item"><span class="ticker-title">USD/INR</span> <span class="ticker-value down" id="usdinrVal">83.28</span> <span class="down" id="usdinrPct">-0.10%</span></div>
    <div class="ticker-item"><span class="ticker-title">BTC/USDT</span> <span class="ticker-value up" id="btcVal">67,245.30</span> <span class="up" id="btcPct">+1.25%</span></div>
    <div class="ticker-item"><span class="ticker-title">ETH/USDT</span> <span class="ticker-value up" id="ethVal">3,245.67</span> <span class="up" id="ethPct">+0.88%</span></div>

    <!-- REPEATED FOR INFINITE SMOOTH LOOP -->
    <div class="ticker-item"><span class="ticker-title">NIFTY 50</span> <span class="ticker-value up" id="niftyVal2">24,834.85</span> <span class="up" id="niftyPct2">+0.42%</span></div>
    <div class="ticker-item"><span class="ticker-title">SENSEX</span> <span class="ticker-value up" id="sensexVal2">81,157.73</span> <span class="up" id="sensexPct2">+0.45%</span></div>
    <div class="ticker-item"><span class="ticker-title">BTC/USDT</span> <span class="ticker-value up" id="btcVal2">67,245.30</span> <span class="up" id="btcPct2">+1.25%</span></div>
  </div>
</div>

<!-- HEADER -->
<header class="header">
<a href="#" class="logo" onclick="goHome(); return false;">
<i class="fa-solid fa-chart-line"></i>GLOBAL FINANCE
</a>
<div class="menu-area">
<button class="menu-button" id="menuButton" onclick="toggleMenu()">
<i class="fa-solid fa-bars"></i><span>Menu</span>
</button>
<div class="menu-dropdown" id="menuDropdown">
<button class="menu-item active" onclick="openPage('home',this)"><span>Home</span><i class="fa-solid fa-house"></i></button>
<button class="menu-item" onclick="openPage('financial',this)"><span>Financial</span><i class="fa-solid fa-wallet"></i></button>
<button class="menu-item" onclick="openPage('trading',this)"><span>Trading</span><i class="fa-solid fa-chart-line"></i></button>
<button class="menu-item" onclick="openPage('investment',this)"><span>Investment</span><i class="fa-solid fa-chart-pie"></i></button>
<button class="menu-item" onclick="openPage('loans',this)"><span>Loans</span><i class="fa-solid fa-hand-holding-dollar"></i></button>
<button class="menu-item" onclick="openPage('earning',this)"><span>Earning Tips</span><i class="fa-solid fa-lightbulb"></i></button>
<button class="menu-item alpha-ai" onclick="openPage('alpha',this)"><span>Alpha AI</span><i class="fa-solid fa-bolt"></i></button>
</div>
</div>
</header>

<!-- MAIN CONTENT -->
<main>
<section id="home" class="page active">
<div class="hero-full-card">
<img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1600&q=80" alt="Global Finance Trading Chart" onerror="this.src='47961.png'">
</div>
</section>

<section id="financial" class="page"></section>
<section id="trading" class="page"></section>
<section id="investment" class="page"></section>
<section id="loans" class="page"></section>
<section id="earning" class="page"></section>
<section id="alpha" class="page"></section>
</main>

<script>
// YOUR ALPHA VANTAGE API KEY
const API_KEY = "H1GTXBSD23BXWGXU";

// MENU FUNCTIONALITY
const menu = document.getElementById("menuDropdown"), menuButton = document.getElementById("menuButton");
function toggleMenu(){ menu.classList.toggle("open"); }
function openPage(e, t){
  document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
  const targetPage = document.getElementById(e);
  if(targetPage) targetPage.classList.add("active");
  document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
  if(t) t.classList.add("active");
  menu.classList.remove("open");
  window.scrollTo({top: 0, behavior: "smooth"});
}
function goHome(){ openPage("home"); }
document.addEventListener("click", e => { menu.contains(e.target) || menuButton.contains(e.target) || menu.classList.remove("open"); });
document.addEventListener("keydown", e => { "Escape" === e.key && menu.classList.remove("open"); });

// UI PRICE UPDATE & FLASH FUNCTION
function updatePriceUI(valId, pctId, newPrice, changePct) {
  const elem = document.getElementById(valId);
  const pctElem = document.getElementById(pctId);
  if(!elem) return;

  const oldPrice = parseFloat(elem.textContent.replace(/,/g, ''));
  elem.textContent = typeof newPrice === 'number' ? newPrice.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : newPrice;

  if(pctElem && changePct !== undefined) {
    const numericPct = parseFloat(changePct);
    pctElem.textContent = (numericPct >= 0 ? '+' : '') + numericPct.toFixed(2) + '%';
    pctElem.className = numericPct >= 0 ? 'up' : 'down';
  }

  if (parseFloat(newPrice) > oldPrice) {
    elem.classList.add('flash-up');
    setTimeout(() => elem.classList.remove('flash-up'), 500);
  } else if (parseFloat(newPrice) < oldPrice) {
    elem.classList.add('flash-down');
    setTimeout(() => elem.classList.remove('flash-down'), 500);
  }

  // Duplicate Element for smooth loop
  const dup = document.getElementById(valId + '2');
  if(dup) dup.textContent = elem.textContent;
}

// 1. FETCH STOCKS & FOREX FROM ALPHA VANTAGE API
async function fetchStockFromAlphaVantage(symbol, valId, pctId) {
  try {
    const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${API_KEY}`;
    const response = await fetch(url);
    const data = await response.json();

    if (data["Global Quote"] && data["Global Quote"]["05. price"]) {
      const price = parseFloat(data["Global Quote"]["05. price"]);
      const changePercent = parseFloat(data["Global Quote"]["10. change percent"]);
      updatePriceUI(valId, pctId, price, changePercent);
    }
  } catch (error) {
    console.log("Alpha Vantage Fetching...", symbol);
  }
}

// 2. FETCH REAL-TIME CRYPTO FROM BINANCE API (FREE 24x7)
async function fetchCryptoRealtime() {
  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT"]');
    if(res.ok) {
      const data = await res.json();
      data.forEach(item => {
        if(item.symbol === "BTCUSDT") updatePriceUI('btcVal', 'btcPct', parseFloat(item.lastPrice), parseFloat(item.priceChangePercent));
        if(item.symbol === "ETHUSDT") updatePriceUI('ethVal', 'ethPct', parseFloat(item.lastPrice), parseFloat(item.priceChangePercent));
      });
    }
  } catch(e) {}
}

// LIVE DATA FETCH SCHEDULE
function initRealtimeData() {
  fetchCryptoRealtime();
  fetchStockFromAlphaVantage('RELIANCE.BSE', 'relVal', 'relPct');
  fetchStockFromAlphaVantage('USDINR=X', 'usdinrVal', 'usdinrPct');
}

// INTERVAL UPDATES (Every 3 seconds)
setInterval(() => {
  fetchCryptoRealtime();
}, 3000);

// Alpha Vantage Updates (Rotated to maintain API Rate limits)
setInterval(() => {
  fetchStockFromAlphaVantage('RELIANCE.BSE', 'relVal', 'relPct');
}, 15000);

initRealtimeData();
</script>

</body>
</html>
