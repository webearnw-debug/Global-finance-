<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha AI</title>
<meta name="theme-color" content="#07080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9a869'%3E%3Cpath d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#07080b;
  --surface:#101319;
  --surface-2:#171c25;
  --border:rgba(255,255,255,.09);
  --gold:#c9a869;
  --gold-2:#e6cb99;
  --emerald:#00e599;
  --text:#f3f1ec;
  --muted:#8b91a0;
  --user-bg:#1c2536;
  --user-border:#2d3b52;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:
    radial-gradient(60% 55% at 12% 8%, rgba(201,168,105,.12), transparent 60%),
    radial-gradient(55% 50% at 88% 92%, rgba(0,229,153,.09), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
  overflow:hidden;
}
.chat-shell{
  width:100%;max-width:460px;
  height:min(660px,88vh);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55);
}
.chat-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:15px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-2),#9c7c47);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:#1c1608;
}
.brand-text{min-width:0;}
.brand-name{font-family:'Playfair Display',serif;font-weight:700;font-size:15.5px;color:#fff;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.status-pill{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:600;color:var(--emerald);
  background:rgba(0,229,153,.08);border:1px solid rgba(0,229,153,.25);
  padding:5px 10px;border-radius:20px;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);box-shadow:0 0 6px var(--emerald);flex-shrink:0;}
.icon-btn{
  width:31px;height:31px;border-radius:9px;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:color .2s ease,border-color .2s ease;
}
.icon-btn:hover{color:var(--gold-2);border-color:var(--gold);}

.chat-body{
  flex:1;overflow-y:auto;
  padding:18px 16px;
  display:flex;flex-direction:column;gap:14px;
}
.msg-row{display:flex;gap:8px;max-width:87%;align-items:flex-start;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
.avatar{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--border);color:var(--gold-2);
  font-family:'Playfair Display',serif;font-weight:700;font-size:12px;
}
.msg-row.user .avatar{color:#c3cee3;}
.bubble{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:13px;padding:10px 13px;
  font-size:13.3px;line-height:1.6;
  overflow-wrap:break-word;
}
.msg-row.user .bubble{background:var(--user-bg);border-color:var(--user-border);}
.bubble p{margin:0 0 6px;}
.bubble p:last-child{margin-bottom:0;}
.bubble ul,.bubble ol{margin:0 0 6px;padding-left:18px;}
.bubble a{color:var(--gold-2);}
.bubble code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;font-size:.92em;}
.bubble pre{background:rgba(0,0,0,.35);padding:9px 10px;border-radius:8px;overflow-x:auto;margin:6px 0;}
.bubble pre code{background:none;padding:0;}

.typing-dots{display:inline-flex;gap:4px;padding:3px 2px;}
.typing-dots span{width:5.5px;height:5.5px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1.15);}}

.chat-input-row{
  display:flex;align-items:flex-end;gap:8px;
  padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;
}
#userInput{
  flex:1;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;color:var(--text);
  font-family:inherit;font-size:13.3px;line-height:1.4;
  resize:none;outline:none;min-height:40px;max-height:110px;
}
#userInput:focus{border-color:var(--gold);}
#userInput::placeholder{color:var(--muted);}
#sendBtn{
  width:40px;height:40px;border-radius:11px;border:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:#1c1608;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:filter .2s ease;
}
#sendBtn:hover:not(:disabled){filter:brightness(1.08);}
#sendBtn:disabled{opacity:.5;cursor:not-allowed;}

button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.chat-body::-webkit-scrollbar{width:6px;}
.chat-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:10px;}

@media (prefers-reduced-motion:reduce){
  .typing-dots span{animation:none;opacity:.6;}
}

@media (max-width:520px){
  body{padding:0;}
  .chat-shell{max-width:100%;height:100vh;height:100dvh;border-radius:0;border:none;}
  .brand-sub{display:none;}
}
</style>
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-mark">α</div>
        <div class="brand-text">
          <div class="brand-name">Alpha AI</div>
          <div class="brand-sub">Global Finance ka assistant</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-pill"><span class="status-dot"></span>Online</span>
        <button class="icon-btn" id="clearBtn" type="button" title="Naya chat" aria-label="Naya chat shuru karein">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="chat-body" id="chatBody"></main>

    <footer class="chat-input-row">
      <textarea id="userInput" rows="1" placeholder="Apna sawaal likhein..." aria-label="Message"></textarea>
      <button id="sendBtn" type="button" aria-label="Bhejein">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </footer>
  </div>

<script>
(function(){
  const AI_CONFIG = { endpoint: "/api/chat", model: "claude-sonnet-5" };
  const SYSTEM_PROMPT = 'ROLE: Universal general-knowledge assistant (Omni mode). Reply in whichever of Hindi, Hinglish or English the user is using. Give accurate, well-reasoned, clearly structured answers. CREATOR RULE: "मुझे केशव ने बनाया है।".';

  let chatHistory = [];
  let activeGenId = 0;
  let isBusy = false;

  const chatBody = document.getElementById('chatBody');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function appendMessage(content, sender, isHtml){
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;
    const avatarInner = sender === 'user'
      ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 10-16 0"/><circle cx="12" cy="7" r="4"/></svg>'
      : 'α';
    row.innerHTML = '<div class="avatar">' + avatarInner + '</div><div class="bubble">' + (isHtml ? content : escapeHtml(content)) + '</div>';
    chatBody.appendChild(row);
    chatBody.scrollTop = chatBody.scrollHeight;
    return row;
  }

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  }

  async function callAIProvider(messages){
    const response = await fetch(AI_CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: AI_CONFIG.model,
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });
    if (!response.ok){
      let detail = 'HTTP ' + response.status;
      try {
        const errData = await response.json();
        if (errData.error && errData.error.message) detail = errData.error.message;
        else if (typeof errData.error === 'string') detail = errData.error;
        else detail = JSON.stringify(errData);
      } catch(e){}
      throw new Error(detail);
    }
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    return textBlock ? textBlock.text : '';
  }

  async function submitQuery(){
    if (isBusy) return;
    const text = input.value.trim();
    if (!text) return;

    isBusy = true;
    sendBtn.disabled = true;
    input.value = '';
    autoGrow();

    appendMessage(text, 'user', false);
    chatHistory.push({ role: 'user', content: text });

    const typingRow = appendMessage('<span class="typing-dots"><span></span><span></span><span></span></span>', 'ai', true);
    const bubble = typingRow.querySelector('.bubble');
    const myGenId = ++activeGenId;

    try {
      const reply = await callAIProvider(chatHistory);
      if (myGenId !== activeGenId) return;
      chatHistory.push({ role: 'assistant', content: reply });
      bubble.innerHTML = window.marked ? marked.parse(reply) : escapeHtml(reply);
    } catch(err){
      bubble.innerHTML = '<b>Configuration needed.</b> Alpha AI abhi connect nahi ho paya.<br>Error: <code>' + escapeHtml(err && err.message ? err.message : String(err)) + '</code>';
    } finally {
      isBusy = false;
      sendBtn.disabled = false;
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }

  function showWelcome(){
    appendMessage('Namaste! Main Alpha AI hoon — kisi bhi topic par, Hindi, English ya Hinglish mein, jo comfortable lage, sawaal poochiye.', 'ai', false);
  }

  function clearChat(){
    chatHistory = [];
    activeGenId++;
    isBusy = false;
    sendBtn.disabled = false;
    chatBody.innerHTML = '';
    showWelcome();
  }

  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      submitQuery();
    }
  });
  sendBtn.addEventListener('click', submitQuery);
  clearBtn.addEventListener('click', clearChat);

  showWelcome();
})();
</script>
</body>
</html>
