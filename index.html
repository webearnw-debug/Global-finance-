        /* ==========================================================================
           CORE DESIGN SYSTEMS & QUANTUM VARIABLES (BLUEPRINT OPTIMIZED)
           ========================================================================== */
        :root {
            --bg-body: #0a0c10;
            --bg-surface: #12161f;
            --bg-card: #1c212e;
            --text-primary: #ffffff;
            --text-secondary: #9aa5b5;
            --brand-gold: #ffd700;
            --brand-blue: #0056b3;
            --neon-green: #00ff66;
            --neon-red: #ff3333;
            --border-color: #242b35;
            --max-width: 1440px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 25px;
        }

        /* ==========================================================================
           1. TOP UTILITY STRIP & DYNAMIC TICKER (SECTION 1 IN BLUEPRINT)
           ========================================================================== */
        .top-strip {
            background-color: #000000;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
            font-size: 12px;
            font-weight: 500;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000000;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .strip-marquee {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: stripMarquee 35s linear infinite;
        }

        @keyframes stripMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .strip-item {
            display: inline-block;
            margin-right: 45px;
            color: var(--text-secondary);
        }

        .strip-item strong { color: var(--text-primary); }
        .trend-up { color: var(--neon-green); font-weight: 700; }
        .trend-down { color: var(--neon-red); font-weight: 700; }

        /* ==========================================================================
           2. EXECUTIVE NAVBAR SYSTEM (SECTION 2 IN BLUEPRINT)
           ========================================================================== */
        .main-navbar {
            background-color: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 38px;
            left: 0;
            width: 100%;
            z-index: 999999;
            padding: 15px 0;
        }

        .nav-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ffffff, var(--brand-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .nav-links { display: none; } /* रिस्पॉन्सिव मेनू */
        }

        .nav-item {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--brand-gold);
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-subscribe {
            background: linear-gradient(135deg, var(--brand-gold), #b8860b);
            color: #000000;
            padding: 9px 24px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 4px;
            border: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            cursor: pointer;
        }

        }

        .hero-badge {
            color: var(--brand-gold);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;

        }

        .hero-title {
            font-size: 54px;

            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-subtitle {

            color: var(--text-secondary);
            max-width: 600px;

        }

        .search-terminal-box {

        .search-terminal-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 20px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .search-terminal-box button {
            background: var(--brand-gold);
            border: none;

            color: #000;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }

        .hero-stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .hero-stats-row { grid-template-columns: repeat(4, 1fr); }
        }

        .stat-node h4 { font-size: 28px; font-weight: 900; color: var(--text-primary); }
        .stat-node p { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; margin-top: 5px; }

        .section-title {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;

            border-left: 3px solid var(--brand-gold);

        .index-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 4px;
        }

        .index-name-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .index-val {
            font-size: 24px;
            font-weight: 900;
            margin: 10px 0 5px 0;
        }
