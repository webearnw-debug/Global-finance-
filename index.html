<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance - Bull Edition</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #06090e;
            --bg-card: #0d131f;
            --accent-green: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.25);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* --- 1. Top Live Market Ticker Bar --- */
        .ticker-bar {
            background: #030508;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 4%;
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            font-size: 0.78rem;
            color: var(--text-secondary);
            scrollbar-width: none; /* Hide scrollbar for clean look */
        }

        .ticker-bar::-webkit-scrollbar {
            display: none;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .ticker-val { color: var(--text-primary); font-weight: 600; }
        .ticker-up { color: var(--accent-green); font-weight: 600; }
        .ticker-down { color: #ff5252; font-weight: 600; }

        /* --- 2. Header Navbar (Logo + Single Menu Button) --- */
        .header {
            position: sticky;
            top: 0;
            background: rgba(13, 19, 31, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 4%;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            color: var(--accent-green);
            font-size: 1.2rem;
        }

        /* Menu Button */
        .menu-trigger-btn {
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .menu-trigger-btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 18px var(--accent-green);
        }

        /* Popup Dropdown Menu */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 110%;
            right: 4%;
            background: #0d131f;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            width: 220px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            flex-direction: column;
            gap: 4px;
            z-index: 2000;
        }

        .dropdown-menu.active {
            display: flex;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 14px;
            text-align: left;
            font-size: 0.88rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dropdown-item:hover, .dropdown-item.active {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
        }

        /* --- 3. Main Body Container (Only Bull Photo) --- */
        .main-workspace {
            padding: 1rem 4%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bull-container {
            width: 100%;
            max-width: 1200px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .bull-img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 1. Live Rates Top Bar -->
    <div class="ticker-bar">
        <div class="ticker-item">NIFTY 50 <span class="ticker-val">24,834.85</span> <span class="ticker-up">+0.42%</span></div>
        <div class="ticker-item">SENSEX <span class="ticker-val">81,157.73</span> <span class="ticker-up">+0.45%</span></div>
        <div class="ticker-item">BANK NIFTY <span class="ticker-val">51,230.10</span> <span class="ticker-up">+0.30%</span></div>
        <div class="ticker-item">USD/INR <span class="ticker-val">83.28</span> <span class="ticker-down">-0.10%</span></div>
        <div class="ticker-item">GOLD (MCX) <span class="ticker-val">72,145.00</span> <span class="ticker-up">+0.15%</span></div>
    </div>

    <!-- 2. Header (Logo + Single Menu Button) -->
    <header class="header">
        <a href="#" class="logo">
            <i class="fa-solid fa-chart-line logo-icon"></i>
            GLOBAL FINANCE
        </a>

        <!-- Menu Button -->
        <div style="position: relative;">
            <button class="menu-trigger-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i> Menu
            </button>

            <!-- Popup Menu Dropdown -->
            <div class="dropdown-menu" id="menuDropdown">
                <button class="dropdown-item active">Home <i class="fa-solid fa-house"></i></button>
                <button class="dropdown-item">Financial Overview <i class="fa-solid fa-wallet"></i></button>
                <button class="dropdown-item">Trading Live <i class="fa-solid fa-chart-candlestick"></i></button>
                <button class="dropdown-item">Investment Portfolio <i class="fa-solid fa-chart-pie"></i></button>
                <button class="dropdown-item">Loans & Credit <i class="fa-solid fa-hand-holding-dollar"></i></button>
            </div>
        </div>
    </header>

    <!-- 3. Main Workspace (Only Bull Photo) -->
    <main class="main-workspace">
        <div class="bull-container">
            <!-- Replace 'bull-image.jpg' with your photo filename or URL -->
            <img src="bull-image.jpg" alt="Bull Market" class="bull-img">
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        function toggleMenu() {
            document.getElementById('menuDropdown').classList.toggle('active');
        }

        // Close menu when clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('.menu-trigger-btn') && !event.target.matches('.menu-trigger-btn *')) {
                const dropdown = document.getElementById('menuDropdown');
                if (dropdown && dropdown.classList.contains('active')) {
                    dropdown.classList.remove('active');
                }
            }
        }
    </script>
</body>
</html>
