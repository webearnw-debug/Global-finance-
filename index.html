<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parnarav AI - Universal Studio (Captain Supreme Edition)</title>
    
    <!-- External UI Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Syntax Highlighter -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    
    <!-- AI Engine Core SDK -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #0b0f19;
            --bg-card: #111827;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --sidebar-width: 290px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100dvh;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
            z-index: 100;
            overflow-y: auto;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .parnarav-brain-icon {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.4));
        }

        .nav-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 14px 0 6px 6px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.86rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-card);
            color: var(--accent-cyan);
            border: 1px solid var(--border-color);
        }

        .nav-item.captain-mode-item {
            color: #f87171 !important;
            border: 1px solid rgba(239, 68, 68, 0.4) !important;
            background: rgba(239, 68, 68, 0.1) !important;
        }

        .tools-menu {
            margin-top: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
        }

        .tool-btn {
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .workspace {
            flex: 1;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: 58px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .target-url-box {
            display: flex;
            align-items: center;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 8px;
            gap: 6px;
            max-width: 340px;
            width: 100%;
        }

        .target-url-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            width: 100%;
        }

        .voice-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .voice-toggle-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: var(--accent-green);
            font-weight: 600;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .chat-area {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 90%;
            animation: fadeIn 0.2s ease-in-out;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            font-weight: 800;
        }

        .user .avatar {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .avatar.armor-1 { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border-color: var(--accent-cyan); }
        .avatar.armor-2 { background: rgba(251, 191, 36, 0.2); color: var(--accent-yellow); border-color: var(--accent-yellow); }
        .avatar.armor-3 { background: rgba(248, 113, 113, 0.2); color: var(--accent-red); border-color: var(--accent-red); }
        .avatar.armor-4 { background: rgba(192, 132, 252, 0.2); color: var(--accent-purple); border-color: var(--accent-purple); }
        .avatar.armor-5 { background: rgba(74, 222, 128, 0.2); color: var(--accent-green); border-color: var(--accent-green); }

        .bubble {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            line-height: 1.6;
            font-size: 0.92rem;
            word-wrap: break-word;
            overflow-x: auto;
            position: relative;
        }

        .user .bubble {
            background-color: #1e3a8a;
            border-color: #3b82f6;
            color: #fff;
        }

        .widget-card {
            background: #070a13;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .widget-title {
            color: var(--accent-purple);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .captain-lock-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(15, 23, 42, 0.95));
            border: 2px solid #ef4444;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
        }

        .captain-pass-box {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .captain-pass-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .captain-pass-input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }

        .captain-unlock-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .captain-unlock-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .captain-exit-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .captain-exit-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .armor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 14px;
        }

        .armor-card-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .armor-card-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(30, 41, 59, 0.9);
        }

        .input-wrapper {
            padding: 12px 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
        }

        .input-box:focus-within {
            border-color: var(--accent-cyan);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.93rem;
            resize: none;
            height: 40px;
            padding-top: 10px;
            line-height: 1.4;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        pre {
            background: #000 !important;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        code { font-family: 'JetBrains Mono', monospace; }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -100%;
                top: 0;
                bottom: 0;
            }
            .sidebar.open {
                left: 0;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            .mobile-menu-btn { display: block; }
            .message-row { max-width: 96%; }
            .target-url-box { display: none; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand-logo">
            <svg class="parnarav-brain-icon" viewBox="0 0 64 64" fill="none">
                <defs>
                    <linearGradient id="leftBrainRed" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ef4444" />
                        <stop offset="100%" stop-color="#b91c1c" />
                    </linearGradient>
                    <linearGradient id="rightBrainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1d4ed8" />
                    </linearGradient>
                </defs>
                <path d="M30 10C22 10 15 15.5 14 23.5C10 24.8 7 28.5 7 33C7 36 8.5 38.8 11 40.5C10 42.8 10.2 45.5 11.5 47.8C13.5 51.2 17.5 53 21 53C22.5 53 24 52.5 25.2 51.7C27 54.5 30 56 30 56V10Z" fill="url(#leftBrainRed)" />
                <path d="M34 10C42 10 49 15.5 50 23.5C54 24.8 57 28.5 57 33C57 36 55.5 38.8 53 40.5C54 42.8 53.8 45.5 52.5 47.8C50.5 51.2 46.5 53 43 53C41.5 53 40 52.5 38.8 51.7C37 54.5 34 56 34 56V10Z" fill="url(#rightBrainBlue)" />
            </svg>
            <span style="background: linear-gradient(135deg, #ff4d4d, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Parnarav AI</span>
        </div>

        <div class="nav-section-title">Operating Modes & Communication Roles</div>
        <ul class="nav-list" id="navList">
            <li class="nav-item active" onclick="AppController.switchMode('OMNI', this)">
                <i class="fa-solid fa-brain"></i> Omni Super AI
            </li>
            <li class="nav-item" onclick="AppController.switchMode('FINANCE', this)">
                <i class="fa-solid fa-chart-line"></i> Trading & Finance
            </li>
            <li class="nav-item" onclick="AppController.switchMode('DEV', this)">
                <i class="fa-solid fa-code"></i> Coding Master
            </li>
            <li class="nav-item" onclick="AppController.switchMode('INTERVIEW', this)">
                <i class="fa-solid fa-user-tie"></i> Mock Interviewer
            </li>
            <li class="nav-item" onclick="AppController.switchMode('SALES', this)">
                <i class="fa-solid fa-handshake"></i> Sales Executive
            </li>
            <li class="nav-item captain-mode-item" id="captainNavItem" onclick="AppController.switchMode('CAPTAIN', this)">
                <i class="fa-solid fa-crown" style="color:#ef4444;"></i> Captain Keshav OS
            </li>
        </ul>

        <div class="tools-menu">
            <div style="font-size:0.75rem; font-weight:700; color:var(--accent-cyan); margin-bottom:8px; text-transform:uppercase;">
                Omni Knowledge Tools
            </div>
            <button class="tool-btn" onclick="OmniKnowledgeEngine.solveExamQuestion()">
                <i class="fa-solid fa-graduation-cap" style="color:var(--accent-purple)"></i> Exam Solver
            </button>
            <button class="tool-btn" onclick="OmniKnowledgeEngine.deepResearch()">
                <i class="fa-solid fa-book-open" style="color:var(--accent-cyan)"></i> Deep Research
            </button>
            <button class="tool-btn" onclick="GeminiOmniEngine.triggerAgenticTask()">
                <i class="fa-solid fa-robot" style="color:var(--accent-yellow)"></i> Agentic Auto-Fix Loop
            </button>

            <div style="font-size:0.75rem; font-weight:700; color:var(--accent-purple); margin:12px 0 8px 0; text-transform:uppercase;">
                Finance Tools
            </div>
            <button class="tool-btn" onclick="QuantEngine.runAnalysis()">
                <i class="fa-solid fa-bolt" style="color:var(--accent-green)"></i> Quant Signals
            </button>
            <button class="tool-btn" onclick="FinancialEngine.calcSIP()">
                <i class="fa-solid fa-calculator" style="color:var(--accent-cyan)"></i> SIP Calculator
            </button>
            <button class="tool-btn" onclick="FinancialEngine.calcEMI()">
                <i class="fa-solid fa-house" style="color:var(--accent-yellow)"></i> Loan EMI Engine
            </button>
        </div>
    </aside>

    <main class="workspace" id="workspaceMain">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="AppController.toggleSidebar(event)">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="mode-indicator" style="font-weight: 700; font-size: 0.88rem;">
                    Parnarav AI: Omni Super AI Active
                </div>
            </div>

            <!-- Target Site Input Bar -->
            <div class="target-url-box">
                <i class="fa-solid fa-globe" style="color:var(--accent-cyan); font-size:0.8rem;"></i>
                <input type="text" id="targetUrlInput" class="target-url-input" value="" placeholder="यहाँ अपनी Target Website URL दर्ज करें..." onchange="ArmorFleet.targetUrl = this.value.trim()">
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <button class="voice-toggle-btn" id="voiceToggleBtn" onclick="VoiceEngine.toggleVoice()">
                    <i class="fa-solid fa-volume-high"></i> <span id="voiceStatusText">Voice OFF</span>
                </button>

                <div class="status-badge">
                    <div class="status-dot"></div>
                    Super AI Active
                </div>
            </div>
        </header>

        <section class="chat-area" id="chatContainer">
            <!-- Dynamic Messages Loaded Here -->
        </section>

        <footer class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" placeholder="यहाँ अपना सवाल या मैसेज दर्ज करें..." onkeydown="AppController.handleKeyPress(event)"></textarea>
                <button class="btn-send" onclick="AppController.submitQuery()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>

    <script>
        // =================================================================
        // 1. CONFIG & SYSTEM IDENTITY
        // =================================================================
        const CAPTAIN_CONFIG = {
            PASSWORD: "360",
            SYSTEM_NAME: "Keshav-OS Executive Core v5.0 Supreme",
            CREATOR_INFO: "मुझे बिलासपुर में रहने वाले एक पर्सन ने बनाया है।"
        };

        // =================================================================
        // 🚀 OMNI AI ENGINE MODULE (FIXED & FULLY INTEGRATED)
        // =================================================================
        const GeminiOmniEngine = {
            chatHistory: [],

            resetMemory: function() {
                this.chatHistory = [];
                console.log("[GeminiOmniEngine]: Conversation memory cleared.");
            },

            processChat: async function(userPrompt, systemInstruction, onChunkCallback) {
                if (this.chatHistory.length === 0 && systemInstruction) {
                    this.chatHistory.push({ role: "system", content: systemInstruction });
                }
                
                this.chatHistory.push({ role: "user", content: userPrompt });

                try {
                    const responseStream = await puter.ai.chat(this.chatHistory, { stream: true });

                    let fullReply = "";
                    for await (const part of responseStream) {
                        if (part?.text) {
                            fullReply += part.text;
                            if (onChunkCallback) onChunkCallback(fullReply);
                        }
                    }

                    this.chatHistory.push({ role: "assistant", content: fullReply });
                    return fullReply;

                } catch (err) {
                    console.error("[GeminiOmniEngine Error]:", err);
                    const response = await puter.ai.chat(this.chatHistory);
                    const textResponse = typeof response === 'string' 
                        ? response 
                        : (response?.message?.content || response?.text || "Error processing request.");

                    this.chatHistory.push({ role: "assistant", content: textResponse });
                    if (onChunkCallback) onChunkCallback(textResponse);
                    return textResponse;
                }
            },

            generateStructuredData: async function(prompt) {
                const systemPrompt = "तैयार डेटा को केवल शुद्ध और क्लीन JSON फॉर्मेट में ही रिटर्न करें।";
                return await puter.ai.chat(`${systemPrompt}\n\nTask: ${prompt}`);
            },

            searchLiveWeb: async function(query) {
                const prompt = `[LIVE WEB SEARCH MODE]: ताज़ा जानकारी और वेब डेटा के आधार पर जवाब दें: ${query}`;
                return await puter.ai.chat(prompt);
            },

            createEmbeddingMemory: function(text) {
                console.log("[RAG Engine]: Embeddings Created for text chunk ->", text.slice(0, 30));
                return true;
            },

            triggerAgenticTask: async function() {
                const userTask = prompt("एजेंट को ऑटो-एक्ज़ीक्यूशन और सेल्फ-करेक्शन के लिए टास्क दें:");
                if (!userTask) return;

                document.getElementById('userInput').value = `[Agentic Loop Executing]: ${userTask}`;
                AppController.submitQuery();
            }
        };

        // =================================================================
        // 🎙️ VOICE ENGINE (TEXT-TO-SPEECH)
        // =================================================================

                navigator.clipboard.writeText(clone.innerText.trim()).then(() => {
                    btn.innerHTML = '✅ Copied!';
                    setTimeout(() => { btn.innerHTML = '📋 Copy'; }, 2000);
                });
            },

            toggleFeedback: function(btn, type) {
                btn.style.color = '#4ade80';
            },

            submitQuery: async function() {
                const input = document.getElementById('userInput');
                if (!input) return;

                const text = input.value.trim();
                if (!text) return;

                const mode = this.currentMode;

                // 🔒 1. Captain Mode Lock Check
                if (mode === 'CAPTAIN' && !this.isCaptainUnlocked) {
                    UIManager.appendMsg(text, 'user');
                    input.value = '';
                    UIManager.appendMsg("🔒 <b>[Access Denied]</b> Captain Keshav OS लॉक्ड है! सही सुरक्षा कोड (360) दर्ज करें।", 'ai', null, '🔒');
                    return;
                }

                // 🛡️ 2. ARMOR FLEET COMMANDS
                const matchArmor = text.match(/@Armor-([1-5])/i);
                if (matchArmor) {
                    const armorNum = matchArmor[1];
                    const armorObj = ArmorFleet[`Armor_${armorNum}`];

                    UIManager.appendMsg(text, 'user');
                    input.value = '';

                    const aiMsgId = 'armor-' + Date.now();
                    UIManager.appendMsg(`<i>${armorObj.codeName} साइकोलॉजिकल व टेक्निकल रिपोर्ट तैयार कर रहा है... ⚡</i>`, 'ai', aiMsgId, armorObj.avatarIcon, armorObj.avatarClass);

                    const userPromptOnly = text.replace(/@Armor-[1-5]:?/i, '').trim();
                    const armorReport = await armorObj.inspect(ArmorFleet.targetUrl, userPromptOnly);
                    const bubbleElement = document.getElementById(aiMsgId);
                    if (bubbleElement) {
                        const bubble = bubbleElement.querySelector('.bubble');
                        bubble.innerHTML = window.marked ? marked.parse(armorReport) : armorReport;
                        UIManager.renderActionBar(aiMsgId);
                    }
                    VoiceEngine.speak(`${armorObj.codeName} की रिपोर्ट तैयार है।`);
                    return;
                }

                // 3. AI Query Processing
                UIManager.appendMsg(text, 'user');
                input.value = '';

                // RAG Embedding Engine Logging
                GeminiOmniEngine.createEmbeddingMemory(text);

                const aiMsgId = 'ai-' + Date.now();
                let currentAvatar = '🧠';

                if (mode === 'INTERVIEW') currentAvatar = '👔';
                else if (mode === 'SALES') currentAvatar = '🤝';
                else if (mode === 'DEV') currentAvatar = '💻';
                else if (mode === 'FINANCE') currentAvatar = '📈';

                UIManager.appendMsg("<i>Thinking... ⚡</i>", 'ai', aiMsgId, currentAvatar);

                // DYNAMIC SYSTEM PROMPT CONFIGURED FOR DIFFERENT ROLES
                let systemRolePrompt = "";

                if (mode === 'CAPTAIN' && this.isCaptainUnlocked) {
                    systemRolePrompt = `STRICT EXECUTIVE PROTOCOL FOR KESHAV OS (CAPTAIN MODE):
1. ADDRESSING RULE: You MUST strictly address the user as "कैप्टन" or "कैप्टन केशव".
2. CREATOR / IDENTITY RULE: If asked who created you ("किसने बनाया", "creator", "owner"), reply strictly: "${CAPTAIN_CONFIG.CREATOR_INFO}".
3. DOMAIN RESTRICTION RULE:
   - Keshav OS ONLY handles: Target Website status/audit (${ArmorFleet.targetUrl ? ArmorFleet.targetUrl : "No site connected"}) and armor commands.
   - If user asks general questions, reply politely: "प्रणाम कैप्टन! कैप्टन ओएस केवल वेबसाइट सुरक्षा और आर्मर सिस्टम तक सीमित है।"`;
                } else if (mode === 'INTERVIEW') {
                    systemRolePrompt = `ROLE: Senior Tech Lead & Mock Interviewer.
1. DUTY: Conduct a structured technical mock interview. Ask strictly ONE question at a time.
2. FEEDBACK: Evaluate user's answers with constructive feedback before asking the next question.
3. TONE: Professional, analytical, fair, and supportive. DO NOT call the user Captain.
4. CREATOR RULE: "${CAPTAIN_CONFIG.CREATOR_INFO}".`;
                } else if (mode === 'SALES') {
                    systemRolePrompt = `ROLE: B2B SaaS Sales Executive & Persuasion Specialist.
1. DUTY: Handle objections, explain product value proposition, and practice B2B sales pitch negotiations.
2. TONE: Energetic, highly persuasive, confident, and solution-oriented. DO NOT call the user Captain.
3. CREATOR RULE: "${CAPTAIN_CONFIG.CREATOR_INFO}".`;
                } else if (mode === 'FINANCE') {
                    systemRolePrompt = `ROLE: Quantitative & Financial Trading AI Specialist. DO NOT call the user Captain. Creator info: "${CAPTAIN_CONFIG.CREATOR_INFO}".`;
                } else if (mode === 'DEV') {
                    systemRolePrompt = `ROLE: Senior Software Architect and Master Programmer. DO NOT call the user Captain. Creator info: "${CAPTAIN_CONFIG.CREATOR_INFO}".`;
                } else {
                    systemRolePrompt = `ROLE: Universal General Knowledge & Omni AI Communication Specialist.
1. TONE & COMMUNICATION: Adapt tone dynamically, switch language smoothly between Hindi/Hinglish/English.
2. DO NOT call the user Captain.
3. CREATOR RULE: "${CAPTAIN_CONFIG.CREATOR_INFO}".`;
                }

                const bubbleElement = document.getElementById(aiMsgId);
                const bubble = bubbleElement ? bubbleElement.querySelector('.bubble') : null;

                try {
                    const finalReply = await GeminiOmniEngine.processChat(
                        text,
                        systemRolePrompt,
                        (streamedText) => {
                            if (bubble) {
                                bubble.innerHTML = window.marked ? marked.parse(streamedText) : streamedText;
                                if (window.hljs) hljs.highlightAll();
                            }
                        }
                    );

                    if (bubbleElement) {
                        UIManager.renderActionBar(aiMsgId);
                    }
                    VoiceEngine.speak(finalReply);
                } catch (err) {
                    if (bubble) {
                        bubble.innerHTML = `**[System Error]** AI Connection Error: \`${err.message || err}\``;
                    }
                }
            },

            toggleSidebar: function(e) {
                if (e) e.stopPropagation();
                document.getElementById('sidebar').classList.toggle('open');
            },

            closeSidebarMobile: function() {
                document.getElementById('sidebar').classList.remove('open');
            }
        };

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            AppController.init();
        });
    </script>
</body>
</html>
