<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance - Smart Trading & Investment</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #06090e;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Top Navbar Container */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background-color: #0b0e14;
            border-bottom: 1px solid #161f2e;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 60px;
        }

        /* Logo Branding */
        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            color: #22c55e;
            font-size: 20px;
        }

        .logo-text h2 {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 9px;
            color: #6b7280;
            display: block;
            text-transform: uppercase;
        }

        /* Desktop Nav Links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #22c55e;
        }

        /* Right Header Controls */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 14px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: #ffffff; }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .lang-selector:hover { color: #fff; }

        /* Sleek & Compact Personal AI Assistant Button */
        .ai-assistant-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.15);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .ai-assistant-btn:hover {
            background: rgba(34, 197, 94, 0.2);
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.35);
            color: #ffffff;
        }

        .login-btn {
            background: #111827;
            border: 1px solid #1f293d;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover { background: #1f293d; }

        .hamburger-btn {
            display: none;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Mobile Slide-down Drawer Menu */
        .mobile-drawer {
            display: none;
            flex-direction: column;
            background-color: #0b0e14;
            border-bottom: 1px solid #161f2e;
            padding: 16px 24px;
            gap: 14px;
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            z-index: 999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .mobile-drawer.active {
            display: flex;
        }

        .mobile-drawer a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .mobile-drawer a:hover, .mobile-drawer a.active {
            color: #22c55e;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .nav-links, .lang-selector, .login-btn { display: none; }
            .hamburger-btn { display: block; }
        }

        @media (max-width: 480px) {
            .ai-btn-text { font-size: 11px; }
            .logo-text span { display: none; }
            .navbar { padding: 10px 14px; }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <!-- Brand Logo -->
        <a href="#" class="logo-box">
            <i class="fa-solid fa-chart-line logo-icon"></i>
            <div class="logo-text">
                <h2>GLOBAL FINANCE</h2>
                <span>Trade. Invest. Grow.</span>
            </div>
        </a>

        <!-- Navigation Links (Desktop) -->
        <nav>
            <ul class="nav-links">
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#markets">Markets</a></li>
                <li><a href="#trading">Trading</a></li>
                <li><a href="#investments">Investments</a></li>
                <li><a href="#loans">Loans</a></li>

            </ul>
        </nav>

        <!-- Header Actions -->
        <div class="nav-actions">
            <button class="icon-btn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>

            <div class="lang-selector">
                <i class="fa-solid fa-globe"></i>

            </button>

            <button class="login-btn">Login</button>
            <button class="hamburger-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-drawer" id="mobileDrawer">
        <a href="#home" class="active">Home</a>
        <a href="#markets">Markets</a>
        <a href="#trading">Trading</a>
        <a href="#investments">Investments</a>
        <a href="#loans">Loans</a>
        <a href="#earnings">Earnings</a>
        <a href="#insights">Insights</a>
        <a href="#tools">Tools</a>
        <a href="#more">More</a>
    </div>

    <!-- JavaScript Handler -->
    <script>

        const menuToggle = document.getElementById('menuToggle');
        const mobileDrawer = document.getElementById('mobileDrawer');

        menuToggle.addEventListener('click', () => {
            mobileDrawer.classList.toggle('active');
        });

        }
    </script>

</body>
</html>
